<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>补货完成</title>
<style>
:root{
  --brand:#2434c8;--brand-deep:#1b299e;--brand-weak:#edf0ff;
  --ink:#0b102f;--text-2:#697095;--text-3:#9aa1b7;
  --bg:#f5f6fa;--surface:#fff;--surface-2:#f0f2f8;--line:#e4e7ef;
  --ok:#008f63;--ok-bg:#e8f7f1;--danger:#d92d20;--danger-bg:#fff0ef;
  --r-card:16px;--r-ctl:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:#e7eaf3;color:var(--ink);-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible{outline:3px solid rgba(36,52,200,.22);outline-offset:2px}
svg{display:block;flex:0 0 auto}

.app{position:relative;width:100%;max-width:390px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

/* ---------- 状态栏 / 顶栏 ---------- */
.status{flex:0 0 28px;height:28px;display:flex;align-items:center;justify-content:space-between;padding:2px 20px 0;background:var(--surface);font-size:12px;font-weight:700}
.status-icons{display:flex;align-items:center;gap:5px}
.signal{width:16px;height:10px;display:flex;align-items:flex-end;gap:1.5px}
.signal i{display:block;width:3px;border-radius:1px;background:var(--ink)}
.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:8px}.signal i:nth-child(4){height:10px}
.battery{position:relative;width:21px;height:10px;padding:1px;border:1.5px solid var(--ink);border-radius:3px}
.battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:var(--ink);border-radius:0 1px 1px 0}
.battery i{display:block;width:80%;height:100%;border-radius:1px;background:var(--ink)}

.navbar{flex:0 0 52px;height:52px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.navbar h1{text-align:center;font-size:17px;line-height:24px;font-weight:700;letter-spacing:-.2px}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--ink)}
.icon-btn:active{background:var(--surface-2)}

/* ---------- 内容 ---------- */
.body{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch}
.card{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface)}
.card+.card{margin-top:10px}
.card-head{padding:13px 14px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title{font-size:15px;line-height:21px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:10px;font-weight:700}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.muted{background:var(--surface-2);color:var(--text-2)}

/* 完成摘要 */
.result{padding:20px 20px 18px;text-align:center}
.result-icon{width:48px;height:48px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ok-bg);color:var(--ok)}
.result h2{font-size:19px;line-height:26px;font-weight:700;letter-spacing:-.4px}
.result p{margin-top:5px;font-size:13px;line-height:19px;color:var(--text-2)}
.result p b{font-size:16px;font-weight:800;color:var(--brand);letter-spacing:-.2px;font-variant-numeric:tabular-nums}

/* 任务信息 */
.rows{padding:4px 14px 6px}
.row{min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row dt{flex:0 0 auto;font-size:13px;line-height:19px;color:var(--text-2)}
.row dd{min-width:0;font-size:13px;line-height:19px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 补货照片 */
.photo-wrap{padding:11px 14px 14px}
.photo{
  position:relative;width:100%;height:152px;border-radius:12px;overflow:hidden;
  background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:box-shadow .15s
}
.photo:active{box-shadow:inset 0 0 0 2px var(--brand-weak)}
.photo.has-shot{background:#111730}
.photo .shot{position:absolute;inset:0;width:100%;height:100%}
.photo [hidden]{display:none!important}
.photo-empty{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.photo-shot{position:absolute;inset:0;display:block}
.photo-icon{color:#a7aec3}
.photo-t{font-size:13px;line-height:19px;font-weight:600;color:var(--text-2)}
.photo-s{font-size:11px;line-height:16px;color:var(--text-3)}
.photo .pill{position:absolute;left:8px;top:8px;z-index:2;height:22px;padding:0 9px;display:inline-flex;align-items:center;border-radius:999px;background:rgba(255,255,255,.92);font-size:10px;font-weight:700;font-style:normal;color:var(--brand)}
.photo-hint{
  position:absolute;right:8px;bottom:8px;z-index:2;height:24px;padding:0 9px;
  display:inline-flex;align-items:center;gap:4px;border-radius:999px;
  background:rgba(11,16,47,.62);font-size:10px;font-weight:700;color:#fff
}
.photo-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(11,16,47,.28),rgba(11,16,47,0) 40%,rgba(11,16,47,.42))}

/* 补货详情 */
.detail-sum{font-size:11px;line-height:16px;font-weight:600;color:var(--text-2)}
.detail-row{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line)}
.detail-row:last-child{border-bottom:0}
.detail-k{min-width:0;font-size:13px;line-height:19px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-v{flex:0 0 auto;font-size:13px;line-height:19px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.detail-v small{margin-left:2px;font-size:11px;font-weight:600;color:var(--text-2)}
.detail-total{
  margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;line-height:17px;color:var(--text-2)
}
.detail-total b{font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.detail-k em{margin-left:6px;font-style:normal;font-size:11px;font-weight:600;color:var(--text-3);font-variant-numeric:tabular-nums}
.detail-cup{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--ok-bg);display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12px;line-height:17px;color:#00674a}
.detail-cup b{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.detail-cup em{font-style:normal;font-size:10px;color:#3f8a72;white-space:nowrap}

/* 备注 */
.note-wrap{padding:11px 14px 14px}
.note{width:100%;min-height:84px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);font-size:13px;line-height:20px;resize:none;outline:0}
.note::placeholder{color:var(--text-3)}
.note:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(36,52,200,.10)}

/* 底部主操作 */
.footer{flex:0 0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.98)}
.btn-primary{width:100%;height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-ctl);background:var(--brand);color:#fff;font-size:15px;font-weight:700;letter-spacing:.5px}
.btn-primary:active{background:var(--brand-deep)}
.btn-ghost{width:100%;height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-ctl);background:var(--surface);color:var(--text-2);font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}

/* 照片弹层 */
.overlay{
  position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;
  background:rgba(11,16,47,.42);opacity:0;visibility:hidden;transition:opacity .2s
}
.overlay.open{opacity:1;visibility:visible}
.sheet{
  width:100%;max-height:88%;overflow-y:auto;padding:6px 16px calc(16px + env(safe-area-inset-bottom));
  border-radius:22px 22px 0 0;background:var(--surface);
  box-shadow:0 -8px 30px rgba(11,16,47,.12);transform:translateY(24px);transition:transform .22s
}
.overlay.open .sheet{transform:translateY(0)}
.handle{width:40px;height:4px;margin:2px auto 10px;border-radius:4px;background:#dfe3ee}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-head h2{font-size:18px;line-height:25px;font-weight:700;letter-spacing:-.25px}
.close{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--surface-2);color:var(--text-2)}
.sheet-note{margin-bottom:12px;font-size:13px;line-height:20px;color:var(--text-2)}
.photo-opt{
  width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left
}
.photo-opt:active{background:var(--surface-2)}
.photo-opt[hidden]{display:none}
.photo-opt-icon{
  flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--brand-weak);color:var(--brand)
}
.photo-opt-main{flex:1;min-width:0}
.photo-opt-title{display:block;font-size:14px;line-height:20px;font-weight:600}
.photo-opt-sub{display:block;margin-top:1px;font-size:11px;line-height:16px;color:var(--text-2)}
.photo-opt.danger .photo-opt-icon{background:var(--danger-bg);color:var(--danger)}
.photo-opt.danger .photo-opt-title{color:var(--danger)}
.sheet-cancel{margin-top:4px}

.toast{
  position:absolute;left:50%;bottom:96px;z-index:70;max-width:78%;padding:9px 14px;border-radius:10px;
  background:rgba(11,16,47,.9);color:#fff;font-size:13px;line-height:19px;font-weight:600;text-align:center;
  opacity:0;visibility:hidden;transform:translate(-50%,8px);transition:opacity .2s,transform .2s
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

@media(min-width:520px){
  .app{height:min(844px,calc(100dvh - 32px));margin-top:16px;border-radius:26px;box-shadow:0 18px 60px rgba(20,20,20,.14)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      </button>
      <button class="photo-opt danger" id="removePhoto" type="button" hidden>
        <span class="photo-opt-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></span>
        <span class="photo-opt-main"><span class="photo-opt-title">删除照片</span><span class="photo-opt-sub">重新上传前可先删除</span></span>
      </button>
      <button class="btn-ghost sheet-cancel" id="sheetCancel" type="button">取消</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</main>
<script>
(function(){
  var qs=new URLSearchParams(location.search);
  var mode=qs.get('mode')==='coffee'?'coffee':'retail';
  /* 补货页会带上设备与门（door=left|right），双门柜在设备名称下补一条货柜信息 */
  var door=qs.get('door');

  var DATA={
    retail:{
      device:'曼谷机场 T1-A01',
      taskNo:'WO-20260625-001',
      duration:'05 分 21 秒',
      result:'本次补货完成，共补 <b>39</b> 件',
      sum:'6 种商品 · 39 件',
      rows:[
        {name:'可口可乐 330ml',qty:6},
        {name:'雪碧 330ml',qty:8},
        {name:'农夫山泉饮用天然水 550ml',qty:10},
        {name:'乐事薯片 原味',qty:6},
        {name:'巧克力 50g',qty:5},
        {name:'益达口香糖 薄荷',qty:4}
      ]
    },
    coffee:{
      device:'中央广场咖啡机',
      taskNo:'WO-20260625-004',
      duration:'08 分 12 秒',
      result:'本次补货完成，共补 <b>4</b> 种原料',
      sum:'4 种原料',
      rows:[
        {name:'咖啡粉 · 意式拼配',qty:'500 g'},
        {name:'咖啡豆 · 埃塞',qty:'800 g'},
        {name:'牛奶',qty:'1000 ml'},
        {name:'糖浆 · 香草',qty:'300 ml'}
      ]
    }
  };

  var data=DATA[mode];
  var cabinetNo=qs.get('cab')||'01';

  /* 补货页把本次实际录入的料仓明细放在 rows 里带过来 */
  var parsed=null;
  try{parsed=JSON.parse(qs.get('rows')||'null')}catch(e){parsed=null}
  if(mode==='coffee'&&parsed&&parsed.length){
    data.rows=parsed;
    data.result='本次补货完成，共补 <b>'+parsed.length+'</b> 个料仓';
    data.sum=parsed.length+' 个料仓';
  }
  document.getElementById('taskDevice').textContent=qs.get('name')||data.device;
  /* 咖啡机：照片说明按料仓口径 */
  if(mode==='coffee'){
    var pill=document.querySelector('.photo-wrap .pill');if(pill)pill.textContent='料仓照片';
    var desc=document.querySelector('.photo-wrap .photo-s');if(desc)desc.textContent='补货后的料仓照片，便于后台核验';
    var note=document.querySelector('.sheet-note');if(note)note.textContent='拍摄补货后的料仓整体照片，便于后台核验。可拍照，也可从相册选择已有照片。';
    var sub=document.querySelector('.photo-opt-sub');if(sub)sub.textContent='调用相机拍摄料仓';
  }

  /* 咖啡机没有货柜，隐藏「货柜」一行 */
  if(mode==='coffee'){
    var cabRow=document.getElementById('taskCabinet');
    var row=cabRow&&cabRow.parentNode;
    if(row)row.style.display='none';
  }else{
    document.getElementById('taskCabinet').textContent=cabinetNo+(door==='both'?' 左右两侧':door==='left'?' 左侧':door==='right'?' 右侧':'');
  }
  document.getElementById('taskNo').textContent=data.taskNo;
  document.getElementById('taskDuration').textContent=data.duration;
  document.getElementById('resultText').innerHTML=data.result;
  document.getElementById('detailSum').textContent=data.sum;
  function fmt(n){return Number(n||0).toLocaleString('en-US')}
  var totals={},order=[],cups=0;
  document.getElementById('detailRows').innerHTML=data.rows.map(function(row){
    var value;
    if(typeof row.qty==='number'){
      value=row.unit?fmt(row.qty)+'<small>'+row.unit+'</small>':'×'+row.qty+'<small>件</small>';
      if(row.unit){
        if(!totals[row.unit]){totals[row.unit]=0;order.push(row.unit)}
        totals[row.unit]+=row.qty;
      }
      if(row.cups)cups+=row.cups;
    }else{
      value=row.qty;
    }
    var label=row.name+(row.slot?'<em>料仓 '+row.slot+'</em>':'');
    return '<div class="detail-row"><span class="detail-k">'+label+'</span><span class="detail-v">'+value+'</span></div>';
  }).join('')
  +'<div class="detail-total"><span>'+(mode==='coffee'?'分单位小计':'商品合计')+'</span><b>'
  +(mode==='coffee'&&order.length?order.map(function(unit){return unit+' '+fmt(totals[unit])}).join(' · '):data.sum)
  +'</b></div>'
  +(mode==='coffee'&&cups>0?'<div class="detail-cup"><span>预计可出杯 <b>约 '+fmt(cups)+' 杯</b></span><em>按粉料 9 g/杯 折算，仅供参考</em></div>':'');

  /* ---------- 补货照片 ---------- */
  var photoBtn=document.getElementById('photoBtn'),
      photoEmpty=document.getElementById('photoEmpty'),
      photoShot=document.getElementById('photoShot'),
      photoShade=document.getElementById('photoShade'),
      photoHint=document.getElementById('photoHint'),
      photoBadge=document.getElementById('photoBadge'),
      removePhoto=document.getElementById('removePhoto'),
      sheet=document.getElementById('photoSheet'),
      toastEl=document.getElementById('toast'),
      hasPhoto=false,toastTimer;

  function toast(text){
    clearTimeout(toastTimer);
    toastEl.textContent=text;
    toastEl.classList.add('show');
    toastTimer=setTimeout(function(){toastEl.classList.remove('show')},1800);
  }
  function renderPhoto(){
    photoEmpty.hidden=hasPhoto;
    photoShot.hidden=!hasPhoto;
    photoShade.hidden=!hasPhoto;
    photoHint.hidden=!hasPhoto;
    removePhoto.hidden=!hasPhoto;
    photoBtn.classList.toggle('has-shot',hasPhoto);
    photoBadge.textContent=hasPhoto?'已上传 1 张':'未上传';
    photoBadge.className='badge '+(hasPhoto?'ok':'muted');
  }
  function openSheet(){sheet.classList.add('open')}
  function closeSheet(){sheet.classList.remove('open')}

  photoBtn.addEventListener('click',openSheet);
  document.getElementById('sheetClose').addEventListener('click',closeSheet);
  document.getElementById('sheetCancel').addEventListener('click',closeSheet);
  sheet.addEventListener('click',function(event){if(event.target===sheet)closeSheet()});
  document.addEventListener('keydown',function(event){if(event.key==='Escape')closeSheet()});

  document.getElementById('takePhoto').addEventListener('click',function(){
    closeSheet();
    hasPhoto=true;renderPhoto();
    toast('照片已上传');
  });
  document.getElementById('pickPhoto').addEventListener('click',function(){
    closeSheet();
    hasPhoto=true;renderPhoto();
    toast('已从相册上传 1 张');
  });
  removePhoto.addEventListener('click',function(){
    closeSheet();
    hasPhoto=false;renderPhoto();
    toast('照片已删除');
  });

  document.getElementById('doneBtn').addEventListener('click',function(){appHome()});
  renderPhoto();
})();
</script>
<script src="app-ui.js"></script>
</body>
</html>
