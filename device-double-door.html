<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>设备详情 · 双门开门柜</title>
<link rel="stylesheet" href="app-ui.css">
<style>
/* 双门开门柜 · 页面前缀 dd- */
.dd-device{padding:2px 0 10px}
.dd-device-name{font-size:19px;line-height:26px;font-weight:700;letter-spacing:-.4px}
.dd-device-id{margin-top:2px;font-size:12px;line-height:17px;color:var(--text-2);font-variant-numeric:tabular-nums}
.dd-tags{display:flex;gap:6px;margin-top:8px}
.dd-stats{margin-bottom:8px}

/* 柜体示意 · 双门 */
.dd-cabinet{
  position:relative;height:184px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,var(--surface-2),var(--surface-3));
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.dd-inner{
  position:absolute;inset:18px 30px;display:flex;gap:6px;padding:6px;
  border:2px solid var(--brand-line);border-radius:10px;background:var(--surface)
}
.dd-door{
  position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--brand-line);border-radius:8px;
  background:linear-gradient(180deg,var(--brand-weak),var(--brand-line));
  transition:border-color .2s,box-shadow .2s,background .2s
}
.dd-door.is-open{border-color:var(--brand);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--brand)}
.dd-handle{
  position:absolute;top:50%;width:4px;height:38px;border-radius:3px;
  background:var(--brand-line);transform:translateY(-50%)
}
.dd-door[data-door="left"] .dd-handle{right:8px}
.dd-door[data-door="right"] .dd-handle{left:8px}
.dd-door.is-open .dd-handle{background:var(--brand)}
.dd-lock{
  width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--brand);
  box-shadow:0 2px 8px rgba(36,52,200,.12);
  display:flex;align-items:center;justify-content:center
}
.dd-door.is-open .dd-lock{color:var(--ok);box-shadow:none}
.dd-lbl{font-size:12px;line-height:16px;font-weight:700;color:var(--text-2)}
.dd-door.is-open .dd-lbl{color:var(--brand)}
.dd-note{margin-top:2px;font-size:12px;line-height:17px;color:var(--text-2)}

/* 左右两门补货 */
.dd-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 状态值 */
.dd-ok{color:var(--ok)}
</style>
</head>
<body>
<main class="app" id="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left">
      <button class="icon-btn" aria-label="返回" onclick="appBack(event)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    </span>
    <h1>设备详情</h1>
    <span class="nav-right">
      <button class="icon-btn" id="inventoryBtn" aria-label="盘点"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M6 7l1 13h10l1-13M9 7V4h6v3M10 11v5M14 11v5"/></svg></button>
    </span>
  </header>

  <div class="body">
    <section class="dd-device">
      <div class="dd-device-name" data-device-name>机场 3 号柜</div>
      <div class="dd-device-id"><span data-device-id>VM-1004</span> · 双门开门柜</div>
      <div class="dd-tags"><span class="badge ok" data-conn-badge><span class="dot ok"></span>在线</span><span class="badge">双门开门柜</span></div>
    </section>

    <section class="stats dd-stats" aria-label="补货统计">
      <div class="stat primary"><div class="stat-label">待补商品</div><div class="stat-value">4</div></div>
      <div class="stat"><div class="stat-label">预计补货 / 件</div><div class="stat-value">32</div></div>
    </section>

    <section class="card" aria-label="柜体示意">
      <div class="card-head"><h2 class="card-title">柜体 · 双门</h2></div>
      <div class="card-body">
        <div class="dd-cabinet">
          <div class="dd-inner">
            <div class="dd-door" data-door="left">
              <span class="dd-handle"></span>
              <span class="dd-lock"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
              <span class="dd-lbl">左门</span>
            </div>
            <div class="dd-door" data-door="right">
              <span class="dd-handle"></span>
              <span class="dd-lock"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
              <span class="dd-lbl">右门</span>
            </div>
          </div>
        </div>
        <p class="dd-note">双门开门柜左右各一扇门，可分别开门补货；柜内按「货架层」管理商品，无货道概念。</p>
      </div>
    </section>

    <section class="card" aria-label="设备状态">
      <div class="card-head"><h2 class="card-title">设备状态</h2></div>
      <div class="card-body">
        <div class="rows">
          <div class="row"><span class="row-k">在线状态</span><span class="row-v dd-ok" data-conn-value>在线</span></div>
          <div class="row"><span class="row-k">门状态</span><span class="row-v" id="doorState">已关闭</span></div>
          <div class="row"><span class="row-k">货架层数</span><span class="row-v">4 层</span></div>
          <div class="row"><span class="row-k">上次补货</span><span class="row-v">2026-11-18 09:10</span></div>
        </div>
      </div>
    </section>

    <section class="card" aria-label="远程操作">
      <div class="card-head"><h2 class="card-title">远程操作</h2></div>
      <div class="card-body">
        <div class="ops">
          <button class="btn btn-secondary" type="button" data-unlock data-door="left" aria-haspopup="dialog" aria-controls="unlockSheet">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
            <span data-unlock-label>开左门</span>
          </button>
          <button class="btn btn-secondary" type="button" data-unlock data-door="right" aria-haspopup="dialog" aria-controls="unlockSheet">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
            <span data-unlock-label>开右门</span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <footer class="footer">
    <div class="dd-actions">
      <button class="btn btn-primary" id="restockLeft"><span>左门补货</span></button>
      <button class="btn btn-primary" id="restockRight"><span>右门补货</span></button>
    </div>
  </footer>

  <div class="overlay" id="unlockSheet" role="dialog" aria-modal="true" aria-labelledby="unlockTitle">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-head">
        <h2 id="unlockTitle">远程开锁</h2>
        <button class="close" type="button" data-close aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <p class="sheet-note">确认后所选柜门可被打开，请确认设备周边安全后再继续。</p>
        <div class="rows">
          <div class="row"><span class="row-k">设备</span><span class="row-v">VM-1004 · 机场 3 号柜</span></div>
          <div class="row"><span class="row-k">门</span><span class="row-v" id="sheetDoor">左门</span></div>
        </div>
        <div class="sheet-btns">
          <button class="btn btn-ghost" type="button" data-close>取消</button>
          <button class="btn btn-primary" type="button" data-unlock-confirm>确认开锁</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</main>
<script>
(function(){
  /* 左右门补货都进单门柜那套补货页，只多带一个 door 参数 */
  var query='?id=VM-1004&name='+encodeURIComponent('机场 3 号柜')+'&door=';
  document.getElementById('restockLeft').addEventListener('click',function(){location.href='cabinet-restock-c.html'+query+'left'});
  document.getElementById('restockRight').addEventListener('click',function(){location.href='cabinet-restock-c.html'+query+'right'});
  document.getElementById('inventoryBtn').addEventListener('click',function(){location.href='inventory.html?device=VM-1004'});

  document.addEventListener('DOMContentLoaded',function(){
    if(!window.appUnlock)return;
    var doors=document.querySelectorAll('.dd-door');
    function paint(door){
      doors.forEach(function(d){d.classList.toggle('is-open',d.getAttribute('data-door')===door)});
    }
    appUnlock({
      buttons:'[data-unlock]',sheet:'unlockSheet',doorRow:'sheetDoor',statusRow:'doorState',toast:'toast',
      onUnlock:function(door){paint(door)},
      onReset:function(){paint(null)}
    });
  });
})();
</script>
<script src="app-ui.js"></script>
</body>
</html>
