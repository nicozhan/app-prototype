<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品详情 · VendSolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vend.css">
<style>
  .heroimg{ margin:20px 20px 0; padding:26px; display:flex; justify-content:center; }
  .heroimg img{ width:208px; height:208px; border-radius:14px; object-fit:cover; }
  .pinfo{ padding:18px 20px 0; }
  .pinfo h1{ font-size:20px; font-weight:800; line-height:1.3; letter-spacing:-.2px; }
  .price{ display:flex; align-items:baseline; gap:10px; margin-top:10px; }
  .price .now{ font-size:20px; font-weight:800; color:var(--blue); }
  .price .was{ font-size:14px; color:var(--gray); text-decoration:line-through; }
  .pinfo .badge{ display:inline-block; margin-top:12px; }
  .ptabs{ display:flex; gap:24px; padding:18px 20px 0; font-size:14px; font-weight:600; color:var(--gray); }
  .ptabs .on{ color:var(--blue); border-bottom:2.5px solid var(--blue); padding-bottom:9px; }
  .fields{ padding:16px 20px 0; display:flex; flex-direction:column; gap:12px; }
  .field{ padding:14px 16px; }
  .field .k{ font-size:12px; color:var(--gray); margin-bottom:6px; }
  .field .v{ font-size:15px; font-weight:600; }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <a class="back" href="products.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回</a>
    <div class="title">商品详情</div>
    <button class="iconbtn" style="background:transparent;color:var(--ink);"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </div>

  <div class="heroimg card"><img src="assets/p_pepsi_copy_hero.png" alt="商品图"></div>

  <div class="pinfo">
    <h1>Pepsi Zero Sugar Soda Wild Cherry &amp; Cream 12 fl oz, 12 Count Cans (Copy)</h1>
    <div class="price"><span class="now">$12.99</span><span class="was">$15.99</span></div>
    <span class="badge b-gray">草稿</span>
  </div>

  <div class="ptabs"><span class="on">概览</span></div>

  <div class="fields">
    <div class="field card"><div class="k">描述</div><div class="v">这是一个标品商品</div></div>
    <div class="field card"><div class="k">SKU</div><div class="v">SKU-001-COPY</div></div>
    <div class="field card"><div class="k">保质期</div><div class="v">12个月</div></div>
  </div>

  <button class="btn-primary">编辑商品</button>
</div>
</body>
</html>
