<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>商品销量排行 · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
  /* 筛选 */
  .rp-filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .rp-flt{
    display:block;text-align:left;padding:8px 10px;border:1px solid var(--line);
    border-radius:var(--r-ctl);background:var(--surface)
  }
  .rp-flt:active{background:var(--surface-2)}
  .rp-flb{display:block;font-size:10px;line-height:14px;color:var(--text-3);font-weight:600}
  .rp-flv{
    margin-top:1px;display:flex;align-items:center;justify-content:space-between;gap:2px;
    font-size:13px;line-height:19px;font-weight:600;white-space:nowrap
  }
  .rp-flv svg{color:var(--text-3);flex:0 0 auto}

  .rp-sub{font-size:11px;line-height:16px;color:var(--text-2);white-space:nowrap}

  /* 排行表 */
  .rp-th{
    display:grid;grid-template-columns:24px minmax(0,1fr) 54px 66px;gap:8px;
    padding:2px 14px 8px;font-size:11px;line-height:16px;font-weight:600;color:var(--text-3)
  }
  .rp-th span:nth-child(3),.rp-th span:nth-child(4){text-align:right}
  .rp-row{
    display:grid;grid-template-columns:24px minmax(0,1fr) 54px 66px;gap:8px;align-items:center;
    padding:11px 14px;border-top:1px solid var(--line)
  }
  .rp-rank{justify-content:center;padding:0;min-width:24px;height:22px;font-size:11px;font-variant-numeric:tabular-nums}
  .rp-rank.top{background:var(--brand);color:#fff}
  .rp-main{min-width:0}
  .rp-name{display:flex;align-items:center;gap:6px;min-width:0}
  .rp-ic{
    width:24px;height:24px;flex:0 0 auto;border-radius:8px;background:var(--brand-weak);color:var(--brand);
    display:flex;align-items:center;justify-content:center
  }
  .rp-name b{
    min-width:0;font-size:14px;line-height:20px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .rp-bar{display:block;margin-top:6px;height:4px;border-radius:999px;background:var(--surface-3);overflow:hidden}
  .rp-bar i{display:block;height:100%;border-radius:999px;background:var(--brand)}
  .rp-qty{
    text-align:right;font-size:13px;line-height:19px;font-weight:600;
    color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap
  }
  .rp-amt{
    text-align:right;font-size:13px;line-height:19px;font-weight:700;
    font-variant-numeric:tabular-nums;white-space:nowrap
  }
  .rp-more{
    display:flex;align-items:center;justify-content:center;gap:3px;height:44px;
    border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--brand)
  }
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <div class="nav-left">
      <a class="icon-btn" href="stats.html" aria-label="返回" onclick="return appBack(event)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
    </div>
    <h1>商品销量排行</h1>
    <span></span>
  </header>

  <div class="body">

    <div class="rp-filters">
      <button class="rp-flt" type="button">
        <span class="rp-flb">时间</span>
        <span class="rp-flv">近7天
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </button>
      <button class="rp-flt" type="button">
        <span class="rp-flb">点位</span>
        <span class="rp-flv">全部点位
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </button>
      <button class="rp-flt" type="button">
        <span class="rp-flb">商品分类</span>
        <span class="rp-flv">全部分类
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </button>
    </div>

    <div class="segmented mt-12" id="sortTabs">
      <button class="active" type="button">销售数量</button>
      <button type="button">销售额</button>
      <button type="button">订单数</button>
    </div>

    <section class="card mt-12">
      <div class="card-head bordered">
        <h2 class="card-title">商品销量排行</h2>
        <span class="rp-sub">共 5 条 · 按销售数量</span>
      </div>

      <div class="rp-th">
        <span>排名</span><span>商品</span><span>销量</span><span>销售额</span>
      </div>

      <div class="rp-row">
        <span class="badge rp-rank top">1</span>
        <div class="rp-main">
          <div class="rp-name">
            <span class="rp-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></span>
            <b>美式咖啡</b>
          </div>
          <div class="rp-bar"><i style="width:100%"></i></div>
        </div>
        <span class="rp-qty">326 杯</span>
        <span class="rp-amt">¥ 4,890</span>
      </div>

      <div class="rp-row">
        <span class="badge rp-rank">2</span>
        <div class="rp-main">
          <div class="rp-name">
            <span class="rp-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></span>
            <b>拿铁</b>
          </div>
          <div class="rp-bar"><i style="width:82%"></i></div>
        </div>
        <span class="rp-qty">268 杯</span>
        <span class="rp-amt">¥ 5,360</span>
      </div>

      <div class="rp-row">
        <span class="badge rp-rank">3</span>
        <div class="rp-main">
          <div class="rp-name">
            <span class="rp-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></span>
            <b>卡布奇诺</b>
          </div>
          <div class="rp-bar"><i style="width:59%"></i></div>
        </div>
        <span class="rp-qty">193 杯</span>
        <span class="rp-amt">¥ 3,860</span>
      </div>

      <div class="rp-row">
        <span class="badge rp-rank">4</span>
        <div class="rp-main">
          <div class="rp-name">
            <span class="rp-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4v4l2 3v12a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9l2-3z"/><line x1="8" y1="13" x2="16" y2="13"/></svg></span>
            <b>橙汁</b>
          </div>
          <div class="rp-bar"><i style="width:47%"></i></div>
        </div>
        <span class="rp-qty">152 瓶</span>
        <span class="rp-amt">¥ 2,280</span>
      </div>

      <div class="rp-row">
        <span class="badge rp-rank">5</span>
        <div class="rp-main">
          <div class="rp-name">
            <span class="rp-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></span>
            <b>冰美式</b>
          </div>
          <div class="rp-bar"><i style="width:44%"></i></div>
        </div>
        <span class="rp-qty">143 杯</span>
        <span class="rp-amt">¥ 2,145</span>
      </div>

      <a class="rp-more" href="#">加载更多</a>
    </section>

  </div>

</main>
<script>
  document.querySelectorAll('.segmented').forEach(function(g){
    g.addEventListener('click', function(e){
      var c = e.target.closest('button'); if(!c) return;
      g.querySelectorAll('button').forEach(function(x){ x.classList.remove('active'); });
      c.classList.add('active');
      var s = document.querySelector('.rp-sub');
      if(s) s.textContent = '共 5 条 · 按' + c.textContent.trim();
    });
  });
</script>
<script src="app-ui.js"></script>
</body>
</html>
