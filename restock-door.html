<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>机器详情 · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
.rsd-head{display:flex;align-items:flex-start;gap:12px}
.rsd-head-main{min-width:0;flex:1}
.rsd-kicker{font-size:12px;line-height:17px;font-weight:700;letter-spacing:1.4px;color:var(--brand)}
.rsd-name{font-size:20px;line-height:27px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.rsd-dist{flex:0 0 auto;font-size:15px;line-height:20px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.rsd-facts{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.rsd-fact{display:flex;align-items:center;gap:6px;font-size:12px;line-height:17px;color:var(--text-2);min-width:0}
.rsd-fact svg{color:var(--text-3)}
.rsd-fact span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsd-photo{position:relative;border-radius:var(--r-ctl);overflow:hidden;background:var(--surface-2);aspect-ratio:16/9}
.rsd-photo img{width:100%;height:100%;object-fit:cover}
.rsd-photo .badge{position:absolute;left:10px;bottom:10px;height:26px;padding:0 10px;background:rgba(255,255,255,.94);color:var(--brand);font-size:11px;box-shadow:0 2px 8px rgba(11,16,47,.12)}
.rsd-online{display:flex;align-items:center;gap:6px;padding:2px 0 6px;font-size:14px;line-height:20px;font-weight:700;color:var(--brand)}
.rsd-foot-label{margin-bottom:8px;font-size:12px;line-height:17px;font-weight:600;color:var(--text-2)}
.rsd-doors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rsd-door{
  position:relative;overflow:hidden;height:56px;padding:0 10px;display:flex;align-items:center;gap:8px;
  border:1px solid var(--brand-line);border-radius:var(--r-card);background:var(--surface);
  text-align:left;touch-action:none;user-select:none;-webkit-user-select:none;
  transition:border-color .15s,background .15s
}
.rsd-door .wash{position:absolute;left:0;top:0;height:100%;width:0;background:rgba(36,52,200,.10)}
.rsd-door .pbar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--brand)}
.rsd-door.holding{border-color:var(--brand)}
.rsd-door.holding .wash,.rsd-door.holding .pbar{width:100%;transition:width 1.5s linear}
.rsd-door .ico{
  position:relative;z-index:1;flex:0 0 auto;width:32px;height:32px;border-radius:var(--r-sm);
  background:var(--brand-weak);color:var(--brand);display:flex;align-items:center;justify-content:center
}
.rsd-door .t1{position:relative;z-index:1;font-size:13px;line-height:18px;font-weight:800;color:var(--ink)}
.rsd-door.done{background:var(--brand);border-color:var(--brand)}
.rsd-door.done .ico{background:rgba(255,255,255,.18);color:#fff}
.rsd-door.done .t1{color:#fff}
.rsd-door.done .wash,.rsd-door.done .pbar{display:none}
.rsd-door.nudge{animation:rsd-nudge .3s ease}
@keyframes rsd-nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
</style>
</head>
<body>
<main class="app" id="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left"><a class="nav-text" href="machines.html" title="返回设备列表" onclick="return appBack(event)">返回</a></span>
    <h1>机器详情</h1>
    <span class="nav-right"><button class="icon-btn" aria-label="更多"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button></span>
  </header>

  <div class="body">

    <section class="card">
      <div class="card-body">
        <div class="rsd-head">
          <div class="rsd-head-main">
            <div class="rsd-kicker">VM-1001</div>
            <div class="rsd-name">T1 · 2 号闸口 Pitt</div>
          </div>
          <span class="rsd-dist">32m</span>
        </div>
        <div class="rsd-facts">
          <div class="rsd-fact"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg><span>编号：VM-1001</span></div>
          <div class="rsd-fact"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg><span>曼谷机场 T1</span></div>
          <div class="rsd-fact"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5 9 4.8l-1 4.2 3 3 4.2-1 1.3 2.5-2 3.5c-6-.6-10.4-5-11-11l3-2Z"/></svg><span>0407 777 192</span></div>
        </div>
      </div>
    </section>

    <section class="stats mt-12" aria-label="补货统计">
      <div class="stat primary"><div class="stat-label">待补货</div><div class="stat-value">6<small>种商品</small></div></div>
      <div class="stat"><div class="stat-label">预计补货</div><div class="stat-value">42<small>件</small></div></div>
    </section>

    <section class="card mt-12">
      <div class="card-body">
        <div class="rsd-photo">
          <img src="assets/restock_machine.png" alt="VM-1001 机器实拍">
          <span class="badge"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13" r="3"/></svg>更新</span>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head bordered"><h2 class="card-title">设备状态</h2></div>
      <div class="card-body tight">
        <div class="rsd-online"><span class="dot ok"></span>在线</div>
        <div class="rows">
          <div class="row"><span class="row-k">柜门</span><span class="row-v">已关闭</span></div>
          <div class="row"><span class="row-k">上次补货</span><span class="row-v">2026-06-25 14:30</span></div>
        </div>
      </div>
    </section>

  </div>

  <footer class="footer">
    <div class="rsd-foot-label">补货中</div>
    <div class="rsd-doors">
      <button type="button" class="rsd-door" data-door="left" aria-label="长按 1.5 秒打开左门">
        <span class="wash"></span><span class="pbar"></span>
        <span class="ico"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5h7.5a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8"/><path d="M5.5 7 2.5 10l3 3"/><path d="M13.2 10h.01" stroke-width="2.2"/></svg></span>
        <span class="t1">左门</span>
      </button>
      <button type="button" class="rsd-door" data-door="right" aria-label="长按 1.5 秒打开右门">
        <span class="wash"></span><span class="pbar"></span>
        <span class="ico"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5H4.5a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1H12"/><path d="M14.5 7l3 3-3 3"/><path d="M6.8 10h.01" stroke-width="2.2"/></svg></span>
        <span class="t1">右门</span>
      </button>
    </div>
  </footer>

</main>
<script>
(function(){
  var HOLD = 1500;
  document.querySelectorAll('.rsd-door').forEach(function(btn){
    var door = btn.getAttribute('data-door'), timer = null, done = false;
    function start(e){
      if(e && e.cancelable) e.preventDefault();
      if(done || timer) return;
      btn.classList.add('holding');
      timer = setTimeout(function(){
        timer = null; done = true;
        btn.classList.remove('holding');
        btn.classList.add('done');
        setTimeout(function(){ location.href = 'restock-list.html?door=' + door; }, 280);
      }, HOLD);
    }
    function cancel(){
      if(done || !timer) return;
      clearTimeout(timer); timer = null;
      btn.classList.remove('holding');
      btn.classList.remove('nudge'); void btn.offsetWidth; btn.classList.add('nudge');
    }
    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointerleave', cancel);
    btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    btn.addEventListener('keydown', function(e){
      if((e.key === ' ' || e.key === 'Enter') && !e.repeat){ e.preventDefault(); start(); }
    });
    btn.addEventListener('keyup', function(e){
      if(e.key === ' ' || e.key === 'Enter') cancel();
    });
    window.addEventListener('pointerup', cancel);
    window.addEventListener('pointercancel', cancel);
  });
})();
</script>
<script src="app-ui.js"></script>
</body>
</html>
