<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>库存盘点</title>
<link rel="stylesheet" href="app-ui.css">
<style>
/* 库存盘点 · 页面前缀 iv- */
.iv-dev{font-size:11px;line-height:16px;font-weight:700;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.iv-mode{flex:0 0 auto;margin:12px 16px 10px}

/* 顶栏：右侧设备号 + 添加商品，标题绝对居中 */
.navbar{position:relative;grid-template-columns:44px 1fr auto}
.navbar h1{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:calc(100% - 210px)}
.iv-add{
  width:34px;height:34px;margin-left:7px;flex:0 0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand-weak);color:var(--brand)
}
.iv-add:active{background:var(--brand-line)}
.iv-add[hidden]{display:none}

/* 盘点新增商品 */
.iv-new{
  display:inline-block;margin-left:5px;height:17px;padding:0 6px;border-radius:999px;
  background:var(--brand-weak);color:var(--brand);font-size:10px;line-height:17px;font-weight:700;vertical-align:1px
}
.iv-row.flash{animation:ivflash 1.2s ease}
@keyframes ivflash{0%,100%{background:transparent}28%{background:var(--brand-weak)}}
.iv-add-note{margin:8px 2px 8px;font-size:11px;line-height:16px;color:var(--text-2)}
.add-circle.done{background:var(--surface-2);color:var(--text-3)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.iv-scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch}
.iv-card{overflow:hidden}
.iv-card .sec-title{padding:11px 14px 6px}

/* 库存行 */
.iv-row{
  display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:11px 14px;border-bottom:1px solid var(--line)
}
.iv-row:last-child{border-bottom:0}
.iv-row .thumb{width:44px;height:44px}
.iv-main{min-width:0;display:block}
.iv-name{display:block;font-size:15px;line-height:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv-meta{display:block;margin-top:2px;font-size:12px;line-height:17px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv-side{display:flex;align-items:center;gap:6px}

.iv-editor{
  display:flex;align-items:center;overflow:hidden;
  border:1px solid var(--line);border-radius:10px
}
.iv-editor button{
  width:28px;height:34px;display:flex;align-items:center;justify-content:center;
  background:var(--brand-weak);color:var(--brand);font-size:17px;font-weight:600
}
.iv-editor button:active{background:var(--brand-line)}
.iv-editor input{
  width:40px;height:34px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
  background:var(--surface);text-align:center;font-size:14px;font-weight:700;
  color:var(--ink);outline:0;font-variant-numeric:tabular-nums
}

.iv-diff{
  min-width:46px;height:24px;padding:0 8px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;font-variant-numeric:tabular-nums
}
/* 差异：增加=红，减少=绿（国内涨红跌绿惯例） */
.iv-diff.up{background:var(--danger-bg);color:var(--danger)}
.iv-diff.down{background:var(--ok-bg);color:var(--ok)}
.iv-diff.zero{background:var(--surface-2);color:var(--text-3)}
.iv-diff.sm{min-width:0;height:20px;padding:0 7px;font-size:11px;font-weight:700}

/* 记录 · 时间段筛选 */
.iv-range{margin:0 16px 8px}
.iv-range-seg button{height:32px;font-size:12px;font-weight:600}
.iv-range-meta{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 2px;font-size:11px;line-height:16px;color:var(--text-2);font-variant-numeric:tabular-nums
}
.iv-range-meta span:last-child{color:var(--text-3)}
.iv-range-err{display:none;margin-top:8px;font-size:11px;line-height:16px;font-weight:600;color:var(--danger)}
.iv-range-err.show{display:block}

/* 记录 */
.iv-rec{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.iv-rec:last-child{border-bottom:0}
.iv-rec-badge{
  width:40px;height:40px;flex:0 0 auto;border-radius:12px;
  display:flex;align-items:center;justify-content:center
}
.iv-rec-badge.restock{background:var(--brand-weak);color:var(--brand)}
.iv-rec-badge.count{background:var(--ok-bg);color:var(--ok)}
.iv-rec-main{flex:1;min-width:0}
.iv-rec-title{display:flex;align-items:center;gap:6px;font-size:15px;line-height:21px;font-weight:600}
.iv-rec-sub{display:block;margin-top:2px;font-size:12px;line-height:17px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv-rec-side{flex:0 0 auto;text-align:right}
.iv-rec-time{display:block;font-size:11px;line-height:16px;color:var(--text-3);font-variant-numeric:tabular-nums}
.iv-rec-tag{
  display:inline-block;margin-top:3px;height:20px;padding:0 8px;border-radius:999px;
  font-size:10px;line-height:20px;font-weight:700
}
.iv-rec-tag.restock{background:var(--brand-weak);color:var(--brand)}
.iv-rec-tag.count{background:var(--surface-2);color:var(--text-2)}
</style>
</head>
<body>
<main class="app" id="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left">
      <button class="icon-btn" aria-label="返回" onclick="appBack(event)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    </span>
    <h1 id="pageTitle">库存盘点</h1>
    <span class="nav-right"><span class="iv-dev" id="deviceLabel"></span><button class="iv-add" id="addBtn" type="button" aria-label="添加商品"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></span>
  </header>

  <div class="segmented iv-mode" id="mode"><button class="active" data-mode="count">盘点</button><button data-mode="record">记录</button></div>

  <div class="iv-range" id="rangeBar">
    <div class="segmented iv-range-seg" id="rangeSeg">
      <button class="active" data-range="7">近 7 天</button>
      <button data-range="1m">近 1 个月</button>
      <button data-range="3m">近 3 个月</button>
      <button data-range="custom">自定义</button>
    </div>
    <div class="iv-range-meta"><span id="rangeLabel"></span><span id="rangeCount"></span></div>
  </div>

  <div class="iv-scroll"><div class="card iv-card" id="listWrap"></div></div>

  <footer class="footer"><button class="btn btn-primary btn-block" id="submitBtn" disabled>保存盘点结果</button></footer>

  <!-- 自定义时间段 -->
  <div class="overlay" id="rangeOverlay" role="dialog" aria-modal="true" aria-labelledby="rangeTitle">
    <section class="sheet">
      <div class="handle"></div>
      <div class="sheet-head"><h2 id="rangeTitle">自定义时间段</h2><button class="close" id="rangeClose" aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="field">
        <label class="field-label" for="rangeStart">开始日期</label>
        <input class="input" type="date" id="rangeStart">
      </div>
      <div class="field">
        <label class="field-label" for="rangeEnd">结束日期</label>
        <input class="input" type="date" id="rangeEnd">
      </div>
      <p class="iv-range-err" id="rangeError"></p>
      <div class="sheet-btns"><button class="btn btn-ghost" id="rangeCancel">取消</button><button class="btn btn-primary" id="rangeApply">确定</button></div>
    </section>
  </div>

  <!-- 添加商品 -->
  <div class="overlay" id="addOverlay" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <section class="sheet">
      <div class="handle"></div>
      <div class="sheet-head"><h2 id="addTitle">添加商品</h2><button class="close" data-close="addOverlay" aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="searchInput" placeholder="商品名称或 69 码" autocomplete="off" aria-label="搜索商品">
        <button class="scan" id="scanBtn" aria-label="扫码添加"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg></button>
      </div>
      <p class="iv-add-note">加入后可在这里直接填实盘数量，账面按 0 计，差异自动标红。</p>
      <div class="results" id="searchResults"></div>
    </section>
  </div>

  <!-- 扫码（相机模拟） -->
  <div class="scn" id="scanOverlay" role="dialog" aria-modal="true" aria-label="扫码添加商品">
    <div class="scn-cam">
      <div class="scn-top">
        <button class="scn-icon" id="scanClose" aria-label="关闭扫描"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        <h2>扫码添加</h2>
        <button class="scn-icon" id="scanTorch" aria-label="补光灯"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"/></svg></button>
      </div>
      <div class="scn-center">
        <div class="scn-frame"><b></b><b></b><b></b><b></b><span class="scn-laser"></span></div>
        <p class="scn-tip">将商品条形码放入框内，自动识别</p>
      </div>
    </div>
    <div class="scn-demo">
      <div class="scn-demo-head"><b>演示条码</b><span>模拟器 · 点选即可扫码</span></div>
      <div id="scanCodes"></div>
    </div>
    <div class="scn-sheet" id="scanSheet"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</main>
<script>
(function(){
  const imagePath='jpgk-platform/mobile/src/static/replenishment/';
  const device=new URLSearchParams(location.search).get('device')||'VM-1001';
  document.getElementById('deviceLabel').textContent=device;
  // 库存：sys 系统账面值，cur 实盘编辑值；code 用于扫码/搜索匹配
  let stock=[
    {id:1,name:'可口可乐 330ml',code:'6901234500001',slot:'1 层 A1',sys:2,cur:2,max:10,img:imagePath+'product-1.png'},
    {id:2,name:'雪碧 330ml',code:'6901234500002',slot:'1 层 A2',sys:4,cur:4,max:10,img:imagePath+'product-2.png'},
    {id:3,name:'红牛 250ml',code:'6901234500003',slot:'2 层 B1',sys:0,cur:0,max:8,img:imagePath+'product-3.png'},
    {id:4,name:'矿泉水 550ml',code:'6901234500004',slot:'2 层 C2',sys:6,cur:6,max:15,img:imagePath+'product-4.png'},
    {id:5,name:'乐事薯片 原味',code:'6901234500005',slot:'3 层 A1',sys:5,cur:5,max:12,img:imagePath+'product-5.png'},
    {id:6,name:'巧克力 50g',code:'6901234500006',slot:'3 层 B2',sys:6,cur:6,max:10,img:imagePath+'product-6.png'}
  ];
  // 商品库（演示数据）：盘点时可搜索/扫码加入这些尚未在列表中的商品
  const CATALOG=[
    {code:'6901234500017',name:'可口可乐 无糖 330ml',slot:'4 层 C1',max:10,img:imagePath+'product-1.png'},
    {code:'6901234500024',name:'乌龙茶 500ml',slot:'4 层 C2',max:12,img:imagePath+'product-4.png'},
    {code:'6921168509256',name:'农夫山泉 550ml',slot:'4 层 A1',max:15,img:imagePath+'product-4.png'},
    {code:'6954767434674',name:'雪碧柠檬味汽水 600ml',slot:'4 层 A2',max:12,img:imagePath+'product-2.png'},
    {code:'6933266607185',name:'百事可乐 330ml',slot:'4 层 B1',max:12,img:imagePath+'product-1.png'}
  ];
  // 扫码结果的库状态：ok=已收录 / warn=档案待补 / bad=产品库未收录（盘点均允许加入）
  const SCAN_STATE={'6901234500017':['ok','已收录'],'6901234500024':['ok','已收录'],'6921168509256':['warn','档案待补'],'6954767434674':['ok','已收录'],'6933266607185':['bad','未收录']};
  // 记录：type = restock(补货) | count(盘点)；at 为时间戳，diff 为盘点差异（正=增加，负=减少）
  const pad=n=>('0'+n).slice(-2);
  function at(daysAgo,h,m){const d=new Date();d.setHours(h,m||0,0,0);d.setDate(d.getDate()-daysAgo);return d.getTime()}
  let records=[
    {type:'restock',title:'完成补货',sub:'补货 18 件 · 6 个商品',at:at(1,10,5)},
    {type:'count',title:'盘点完成',sub:'实盘 42 件 · 6 个商品',at:at(2,18,40),diff:3},
    {type:'restock',title:'完成补货',sub:'补货 12 件 · 4 个商品',at:at(5,9,15)},
    {type:'count',title:'盘点完成',sub:'实盘 38 件 · 6 个商品',at:at(7,17,22),diff:-2},
    {type:'count',title:'盘点完成',sub:'实盘 40 件 · 6 个商品',at:at(13,20,5),diff:0},
    {type:'count',title:'盘点完成',sub:'实盘 41 件 · 6 个商品',at:at(26,11,30),diff:1},
    {type:'restock',title:'完成补货',sub:'补货 9 件 · 3 个商品',at:at(34,15,10)},
    {type:'count',title:'盘点完成',sub:'实盘 36 件 · 6 个商品',at:at(72,9,50),diff:-4},
    {type:'count',title:'盘点完成',sub:'实盘 44 件 · 6 个商品',at:at(108,16,25),diff:2}
  ];
  let mode='count',toastTimer;
  // 时间段：7=近 7 天 / 1m=近 1 个月 / 3m=近 3 个月 / custom=自定义
  let rangeKey='7',customFrom=null,customTo=null;
  const listWrap=document.getElementById('listWrap');
  const $=id=>document.getElementById(id);
  function toast(text){const el=$('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
  function diffOf(item){return item.cur-item.sys}
  function diffClass(item){const d=diffOf(item);return d>0?'up':d<0?'down':'zero'}
  function diffText(item){const d=diffOf(item);return d>0?'+'+d:d<0?String(d):'0'}
  function anyChanged(){return stock.some(item=>item.cur!==item.sys)}
  function renderCount(){
    if(!stock.length){listWrap.innerHTML='<div class="empty"><p>暂无库存数据</p><span>点右上角 + 添加商品</span></div>';return}
    listWrap.innerHTML='<div class="sec-title">实盘数量（'+stock.length+' 个商品）</div>'+stock.map(item=>{
      const meta=item.isNew?item.slot+'<span class="iv-new">新增</span>':item.slot+' · 账面 '+item.sys;
      return '<div class="iv-row" id="row-'+item.id+'"><span class="thumb"><img src="'+item.img+'" alt="" onerror="this.style.display=\'none\'"></span><span class="iv-main"><span class="iv-name">'+item.name+'</span><span class="iv-meta">'+meta+'</span></span><span class="iv-side"><span class="iv-editor"><button data-dec="'+item.id+'" aria-label="减少">−</button><input data-input="'+item.id+'" type="text" inputmode="numeric" value="'+item.cur+'" aria-label="实盘数量"><button data-inc="'+item.id+'" aria-label="增加">+</button></span><span class="iv-diff '+diffClass(item)+'">'+diffText(item)+'</span></span></div>';
    }).join('');
  }
  /* ---------- 时间段筛选 ---------- */
  function monthsAgo(n){
    const d=new Date();d.setHours(0,0,0,0);
    const day=d.getDate();
    d.setDate(1);d.setMonth(d.getMonth()-n);
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    d.setDate(Math.min(day,last));
    return d;
  }
  function rangeBounds(){
    const to=new Date();to.setHours(23,59,59,999);
    let from;
    if(rangeKey==='7'){from=new Date();from.setHours(0,0,0,0);from.setDate(from.getDate()-6)}
    else if(rangeKey==='1m')from=monthsAgo(1);
    else if(rangeKey==='3m')from=monthsAgo(3);
    else {from=customFrom?new Date(customFrom):monthsAgo(1);if(customTo)to.setTime(customTo)}
    return {from:from.getTime(),to:to.getTime()};
  }
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function rangeText(b){
    const f=new Date(b.from),t=new Date(b.to),thisYear=new Date().getFullYear();
    const f2=d=>d.getFullYear()===thisYear?pad(d.getMonth()+1)+'-'+pad(d.getDate()):ymd(d);
    return f2(f)+' ~ '+f2(t);
  }
  function fmtTime(ts){
    const d=new Date(ts),now=new Date(),hm=pad(d.getHours())+':'+pad(d.getMinutes());
    const same=(a,c)=>a.getFullYear()===c.getFullYear()&&a.getMonth()===c.getMonth()&&a.getDate()===c.getDate();
    if(same(d,now))return '今天 '+hm;
    const y=new Date(now.getTime());y.setDate(y.getDate()-1);
    if(same(d,y))return '昨天 '+hm;
    if(d.getFullYear()===now.getFullYear())return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+hm;
    return ymd(d);
  }
  function syncRangeSeg(){
    document.querySelectorAll('#rangeSeg [data-range]').forEach(b=>b.classList.toggle('active',b.dataset.range===rangeKey));
  }

  const ICON_RESTOCK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>';
  const ICON_COUNT='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M6 7l1 13h10l1-13M9 7V4h6v3M10 11v5M14 11v5"/></svg>';

  function renderRecords(){
    const b=rangeBounds();
    const list=records.filter(r=>r.at>=b.from&&r.at<=b.to).sort((x,y)=>y.at-x.at);
    $('rangeLabel').textContent=rangeText(b);
    $('rangeCount').textContent='共 '+list.length+' 条';
    if(!list.length){
      listWrap.innerHTML='<div class="empty"><div class="empty-icon gray">'+ICON_COUNT+'</div><p>该时间段没有记录</p><span>换个时间范围再看看</span></div>';
      return;
    }
    listWrap.innerHTML=list.map(r=>{
      const isCount=r.type==='count';
      const label=isCount?'盘点':'补货';
      let chip='';
      if(isCount){
        const d=r.diff||0,cls=d>0?'up':d<0?'down':'zero',txt=d>0?'+'+d:String(d);
        chip='<span class="iv-diff sm '+cls+'">差异 '+txt+'</span>';
      }
      return '<div class="iv-rec"><span class="iv-rec-badge '+r.type+'">'+(isCount?ICON_COUNT:ICON_RESTOCK)+'</span>'
        +'<span class="iv-rec-main"><span class="iv-rec-title">'+r.title+chip+'</span><span class="iv-rec-sub">'+r.sub+'</span></span>'
        +'<span class="iv-rec-side"><span class="iv-rec-time">'+fmtTime(r.at)+'</span><span class="iv-rec-tag '+r.type+'">'+label+'</span></span></div>';
    }).join('');
  }
  function render(){
    const isCount=mode==='count';
    $('rangeBar').style.display=isCount?'none':'';
    $('submitBtn').style.display=isCount?'':'none';
    $('addBtn').hidden=!isCount;
    $('pageTitle').textContent=isCount?'库存盘点':'盘点记录';
    if(isCount)renderCount();else renderRecords();
    $('submitBtn').disabled=!anyChanged();
  }

  /* ---------- 添加商品：搜索 / 扫码 ---------- */
  const ICON_SEARCH='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
  const ICON_SCAN='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>';
  const ICON_PLUS_SM='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const ICON_CHECK_SM='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>';

  function findStock(code){return stock.find(x=>x.code===code)}
  function openOverlay(id){$(id).classList.add('open')}
  function closeOverlay(id){$(id).classList.remove('open')}
  function flashRow(id){
    setTimeout(()=>{
      const row=listWrap.querySelector('#row-'+id);
      if(!row)return;
      row.scrollIntoView({block:'center'});
      row.classList.add('flash');
      setTimeout(()=>row.classList.remove('flash'),1200);
    },40);
  }
  function addProduct(p){
    const exist=findStock(p.code);
    if(exist){closeOverlay('addOverlay');closeScan();flashRow(exist.id);toast(p.name+' 已在盘点列表中');return}
    const item={id:Date.now(),name:p.name,code:p.code,slot:p.slot||'未分配货道',sys:0,cur:1,max:p.max||10,img:p.img,isNew:true};
    stock.push(item);
    closeOverlay('addOverlay');closeScan();render();flashRow(item.id);
    toast('已加入 '+p.name+' · 实盘 1 件');
  }
  function renderSearch(){
    const q=$('searchInput').value.trim().toLowerCase();
    const list=CATALOG.filter(p=>!q||p.name.toLowerCase().includes(q)||p.code.includes(q));
    if(!list.length){
      $('searchResults').innerHTML='<div class="add-empty"><div class="empty-icon">'+ICON_SEARCH+'</div><p>没有匹配的商品</p><span>换个关键词，或扫码录入条形码</span><button class="btn-secondary" id="emptyScan">'+ICON_SCAN+'扫码添加</button></div>';
      $('emptyScan').addEventListener('click',openScan);
      return;
    }
    $('searchResults').innerHTML=list.map(p=>{
      const inList=!!findStock(p.code);
      return '<button class="result" data-code="'+p.code+'"><span class="thumb"><img src="'+p.img+'" alt="" onerror="this.style.display=\'none\'"></span>'
        +'<span><span class="result-name">'+p.name+'</span><span class="result-code">'+p.code+(inList?' · 已在盘点':'')+'</span></span>'
        +'<span class="add-circle'+(inList?' done':'')+'">'+(inList?ICON_CHECK_SM:ICON_PLUS_SM)+'</span></button>';
    }).join('');
  }
  /* 扫码：库状态 ok=已收录 / warn=档案待补 / bad=未收录（盘点都允许加入） */
  function scanTag(p){
    if(findStock(p.code))return ['ok','已在盘点'];
    return SCAN_STATE[p.code]||['warn','档案待补'];
  }
  function openScan(){
    $('scanSheet').classList.remove('show');
    $('scanSheet').innerHTML='';
    $('scanCodes').innerHTML=CATALOG.map(p=>{
      const t=scanTag(p);
      return '<button class="scn-code" data-code="'+p.code+'"><span class="scn-code-main"><span class="scn-code-name">'+p.name+'</span><span class="scn-code-num">'+p.code+'</span></span><span class="scn-tag '+t[0]+'">'+t[1]+'</span></button>';
    }).join('');
    openOverlay('scanOverlay');
  }
  function closeScan(){
    $('scanSheet').classList.remove('show');
    $('scanSheet').innerHTML='';
    $('scanOverlay').classList.remove('open');
  }
  function scanResult(code){
    const p=CATALOG.find(x=>x.code===code);
    if(!p)return;
    const inList=!!findStock(p.code),t=scanTag(p);
    let state,desc,btn;
    if(inList){
      state='<div class="scn-state ok"><span class="dot"></span>该商品已在盘点列表中</div>';
      desc='关闭扫码后为你定位到这一行，可直接修改实盘数量。';
      btn='<button class="btn-primary" id="scanDone">定位到该商品</button>';
    }else if(t[0]==='ok'){
      state='<div class="scn-state ok"><span class="dot"></span>产品库已收录 · 可直接盘点</div>';
      desc='加入后账面记为 0，实盘默认 1 件，可在列表里直接调整。';
      btn='<button class="btn-primary" id="scanAdd">加入盘点</button>';
    }else if(t[0]==='warn'){
      state='<div class="scn-state warn"><span class="dot"></span>产品档案待补 · 不影响盘点</div>';
      desc='该商品缺少图片或规格信息，仍可记录实盘数量，建议同步给管理员补档。';
      btn='<button class="btn-primary" id="scanAdd">加入盘点</button>';
    }else{
      state='<div class="scn-state bad"><span class="dot"></span>产品库未收录 · 可先盘点</div>';
      desc='产品库没有这条条码，加入后会生成一条待补档记录，管理员补齐后即可正常补货。';
      btn='<button class="btn-primary" id="scanAdd">仍要加入</button>';
    }
    $('scanSheet').innerHTML='<div class="handle"></div>'
      +'<div class="scn-prod"><span class="thumb"><img src="'+p.img+'" alt="" onerror="this.style.display=\'none\'"></span>'
      +'<div><div class="scn-prod-name">'+p.name+'</div><div class="scn-prod-code">'+p.code+' · '+p.slot+'</div></div></div>'
      +state+'<p class="scn-desc">'+desc+'</p><div class="scn-actions">'+btn+'</div>';
    $('scanSheet').classList.add('show');
    const add=$('scanAdd'),done=$('scanDone');
    if(add)add.addEventListener('click',()=>addProduct(p));
    if(done)done.addEventListener('click',()=>{closeScan();flashRow(findStock(p.code).id)});
  }

  $('addBtn').addEventListener('click',()=>{$('searchInput').value='';renderSearch();openOverlay('addOverlay')});
  $('searchInput').addEventListener('input',renderSearch);
  $('searchResults').addEventListener('click',event=>{
    const btn=event.target.closest('[data-code]');
    if(!btn)return;
    const p=CATALOG.find(x=>x.code===btn.dataset.code);
    if(p)addProduct(p);
  });
  $('scanBtn').addEventListener('click',openScan);
  $('scanClose').addEventListener('click',closeScan);
  $('scanTorch').addEventListener('click',()=>$('scanTorch').classList.toggle('on'));
  $('scanCodes').addEventListener('click',event=>{
    const btn=event.target.closest('[data-code]');
    if(btn)scanResult(btn.dataset.code);
  });
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeOverlay(b.dataset.close)));
  $('addOverlay').addEventListener('click',event=>{if(event.target===$('addOverlay'))closeOverlay('addOverlay')});

  $('mode').addEventListener('click',event=>{const b=event.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(el=>el.classList.toggle('active',el===b));render()});

  /* 时间段：切换即筛选；自定义先开弹层，确定后才生效 */
  $('rangeSeg').addEventListener('click',event=>{
    const b=event.target.closest('[data-range]');if(!b)return;
    if(b.dataset.range==='custom'){openRange();return}
    rangeKey=b.dataset.range;syncRangeSeg();renderRecords();
  });
  function openRange(){
    $('rangeError').classList.remove('show');
    const b=rangeBounds();
    $('rangeStart').value=ymd(new Date(b.from));
    $('rangeEnd').value=ymd(new Date(b.to));
    $('rangeStart').max=ymd(new Date());
    $('rangeEnd').max=ymd(new Date());
    $('rangeOverlay').classList.add('open');
  }
  function closeRange(){$('rangeOverlay').classList.remove('open')}
  function rangeError(msg){const e=$('rangeError');e.textContent=msg;e.classList.toggle('show',!!msg)}
  $('rangeClose').addEventListener('click',closeRange);
  $('rangeCancel').addEventListener('click',closeRange);
  $('rangeOverlay').addEventListener('click',event=>{if(event.target===$('rangeOverlay'))closeRange()});
  $('rangeApply').addEventListener('click',function(){
    const s=$('rangeStart').value,e=$('rangeEnd').value,today=ymd(new Date());
    if(!s||!e){rangeError('请选择开始和结束日期');return}
    if(s>e){rangeError('开始日期不能晚于结束日期');return}
    if(e>today){rangeError('结束日期不能晚于今天');return}
    customFrom=new Date(s+'T00:00:00').getTime();
    customTo=new Date(e+'T23:59:59.999').getTime();
    rangeKey='custom';syncRangeSeg();closeRange();renderRecords();
    toast('已筛选 '+s+' 至 '+e);
  });
  listWrap.addEventListener('click',event=>{
    const inc=event.target.closest('[data-inc]'),dec=event.target.closest('[data-dec]');
    if(!inc&&!dec)return;
    const id=Number((inc||dec).dataset[inc?'inc':'dec']),item=stock.find(x=>x.id===id);
    if(inc)item.cur=Math.min(item.max,item.cur+1);else item.cur=Math.max(0,item.cur-1);
    render();
  });
  listWrap.addEventListener('input',event=>{
    const input=event.target.closest('[data-input]');if(!input)return;
    const id=Number(input.dataset.input),item=stock.find(x=>x.id===id);
    const v=Math.max(0,Math.min(item.max,parseInt(input.value.replace(/\D/g,'')||'0',10)));
    item.cur=v;render();
  });
  $('submitBtn').addEventListener('click',function(){
    let diffTotal=0;stock.forEach(item=>{const d=diffOf(item);if(d!==0)diffTotal+=d});
    const total=stock.reduce((s,i)=>s+i.cur,0);
    records.unshift({type:'count',title:'盘点完成',sub:'实盘 '+total+' 件 · '+stock.length+' 个商品',at:Date.now(),diff:diffTotal});
    stock.forEach(item=>{item.sys=item.cur;item.isNew=false});
    toast('盘点已保存');
    render();
  });
  render();
})();
</script>
<script src="app-ui.js"></script>
</body>
</html>
