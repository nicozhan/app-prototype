<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>设备详情 · 单门开门柜</title>
<link rel="stylesheet" href="app-ui.css">
<style>
/* 单门开门柜 · 页面前缀 sd- */
.sd-device{padding:2px 0 10px}
.sd-device-name{font-size:19px;line-height:26px;font-weight:700;letter-spacing:-.4px}
.sd-device-id{margin-top:2px;font-size:12px;line-height:17px;color:var(--text-2);font-variant-numeric:tabular-nums}
.sd-tags{display:flex;gap:6px;margin-top:8px}
.sd-stats{margin-bottom:8px}

/* 柜体示意 */
.sd-cabinet{
  position:relative;height:184px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,var(--surface-2),var(--surface-3));
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.sd-cabinet-inner{
  position:absolute;inset:18px 30px;display:flex;border:2px solid var(--brand-line);
  border-radius:10px;background:var(--surface)
}
.sd-door{
  position:relative;flex:1;margin:6px;border:1px solid var(--brand-line);border-radius:8px;
  background:linear-gradient(180deg,var(--brand-weak),var(--brand-line));
  display:flex;align-items:center;justify-content:center;
  transform-origin:left center;transition:transform .4s ease,opacity .4s ease
}
.sd-door.sd-open{transform:perspective(600px) rotateY(-62deg);opacity:.55}
.sd-handle{
  position:absolute;right:10px;top:50%;width:5px;height:42px;border-radius:3px;
  background:var(--brand-line);transform:translateY(-50%)
}
.sd-lock{
  width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--brand);
  box-shadow:0 2px 8px rgba(36,52,200,.12);display:flex;align-items:center;justify-content:center
}
.sd-shelves{position:absolute;inset:18px 30px;display:none;flex-direction:column;gap:12px;padding:18px 22px}
.sd-cabinet.sd-show-shelves .sd-shelves{display:flex}
.sd-cabinet.sd-show-shelves .sd-door{opacity:0;pointer-events:none}
.sd-shelf{
  flex:1;border:1px solid var(--line);border-radius:6px;background:var(--surface);
  box-shadow:inset 0 2px 6px rgba(36,52,200,.04)
}
.sd-shelf-row{display:flex;gap:8px;padding:3px 6px;height:50%}
.sd-unit{flex:1;border-radius:4px;background:var(--brand-weak)}

/* 状态值 */
.sd-ok{color:var(--ok)}

/* 顶栏右上：盘点（文字按钮，标题保持绝对居中） */
.sd-nav{position:relative;grid-template-columns:44px minmax(0,1fr) auto}
.sd-nav h1{position:absolute;left:50%;transform:translateX(-50%);max-width:150px}
.sd-stock-btn{
  height:32px;padding:0 10px;display:inline-flex;align-items:center;gap:5px;
  border-radius:9px;background:var(--brand-weak);color:var(--brand);
  font-size:13px;line-height:18px;font-weight:600;white-space:nowrap
}
.sd-stock-btn:active{background:var(--brand-line)}
.sd-stock-btn svg{width:16px;height:16px}
</style>
</head>
<body>
<main class="app" id="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar sd-nav">
    <span class="nav-left">
      <button class="icon-btn" aria-label="返回" onclick="appBack(event)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    </span>
    <h1>设备详情</h1>
    <span class="nav-right">
      <button class="sd-stock-btn" id="inventoryBtn" type="button" aria-label="盘点">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
        <span>盘点</span>
      </button>
    </span>
  </header>

  <div class="body">
    <section class="sd-device">
      <div class="sd-device-name" data-device-name>曼谷机场 T1-A01</div>
      <div class="sd-device-id"><span data-device-id>VM-1001</span> · 单门开门柜</div>
      <div class="sd-tags"><span class="badge ok" data-conn-badge><span class="dot ok"></span>在线</span><span class="badge">单门开门柜</span></div>
    </section>

    <section class="stats sd-stats" aria-label="补货统计">
      <div class="stat primary"><div class="stat-label">待补商品</div><div class="stat-value">6</div></div>
      <div class="stat"><div class="stat-label">预计补货 / 件</div><div class="stat-value">42</div></div>
    </section>

    <section class="card" aria-label="柜体示意">
      <div class="card-head"><h2 class="card-title">柜体 · 单门</h2></div>
      <div class="card-body">
        <div class="sd-cabinet" id="cabinet">
          <div class="sd-cabinet-inner">
            <div class="sd-door" id="door">
              <span class="sd-handle"></span>
              <span class="sd-lock" id="lockIcon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
            </div>
          </div>
          <div class="sd-shelves"><div class="sd-shelf"><div class="sd-shelf-row"><span class="sd-unit"></span><span class="sd-unit"></span><span class="sd-unit"></span></div><div class="sd-shelf-row"><span class="sd-unit"></span><span class="sd-unit"></span><span class="sd-unit"></span></div></div><div class="sd-shelf"><div class="sd-shelf-row"><span class="sd-unit"></span><span class="sd-unit"></span><span class="sd-unit"></span></div><div class="sd-shelf-row"><span class="sd-unit"></span><span class="sd-unit"></span><span class="sd-unit"></span></div></div></div>
        </div>
      </div>
    </section>

    <section class="card" aria-label="设备状态">
      <div class="card-head"><h2 class="card-title">设备状态</h2></div>
      <div class="card-body">
        <div class="rows">
          <div class="row"><span class="row-k">在线状态</span><span class="row-v sd-ok" data-conn-value>在线</span></div>
          <div class="row"><span class="row-k">门状态</span><span class="row-v" id="doorState">已关闭</span></div>
          <div class="row"><span class="row-k">货架层数</span><span class="row-v">4 层</span></div>
          <div class="row"><span class="row-k">上次补货</span><span class="row-v">2026-11-18 10:00</span></div>
        </div>
      </div>
    </section>

    <section class="card" aria-label="远程操作">
      <div class="card-head"><h2 class="card-title">远程操作</h2></div>
      <div class="card-body">
        <div class="ops">
          <button class="btn btn-secondary" type="button" data-unlock aria-haspopup="dialog" aria-controls="unlockSheet">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
            <span data-unlock-label>开锁</span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <footer class="footer"><button class="btn btn-primary btn-block" id="restockBtn"><span>补货</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></footer>

  <div class="overlay" id="unlockSheet" role="dialog" aria-modal="true" aria-labelledby="unlockTitle">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-head">
        <h2 id="unlockTitle">远程开锁</h2>
        <button class="close" type="button" data-close aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <p class="sheet-note">确认后柜门可被打开，请确认设备周边安全后再继续。</p>
        <div class="rows">
          <div class="row"><span class="row-k">设备</span><span class="row-v">VM-1001 · 曼谷机场 T1-A01</span></div>
          <div class="row"><span class="row-k">门状态</span><span class="row-v">已关闭</span></div>
        </div>
        <div class="sheet-btns">
          <button class="btn btn-ghost" type="button" data-close>取消</button>
          <button class="btn btn-primary" type="button" data-unlock-confirm>确认开锁</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</main>
<script>
(function(){
  var qs=new URLSearchParams(location.search);
  var deviceId=qs.get('id')||'VM-1001';
  var deviceName=qs.get('name')||'曼谷机场 T1-A01';

  /* 右上「盘点」：进库存盘点页，带上当前设备 */
  document.getElementById('inventoryBtn').addEventListener('click',function(){
    location.href='inventory.html?device='+encodeURIComponent(deviceId);
  });
  document.getElementById('restockBtn').addEventListener('click',function(){
    location.href='cabinet-restock-c.html?id='+encodeURIComponent(deviceId)+'&name='+encodeURIComponent(deviceName);
  });
  document.addEventListener('DOMContentLoaded',function(){
    if(!window.appUnlock)return;
    var cabinet=document.getElementById('cabinet');
    appUnlock({
      buttons:'[data-unlock]',sheet:'unlockSheet',statusRow:'doorState',toast:'toast',
      onUnlock:function(){if(cabinet)cabinet.classList.add('sd-show-shelves')},
      onReset:function(){if(cabinet)cabinet.classList.remove('sd-show-shelves')}
    });
  });
})();
</script>
<script src="app-ui.js"></script>
</body>
</html>
