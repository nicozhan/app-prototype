<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>设备详情 · 单门开门柜</title>
<link rel="stylesheet" href="app-ui.css">
<style>
/* 单门开门柜 · 页面前缀 sd- */
.sd-device{padding:2px 0 10px}
.sd-device-name{font-size:19px;line-height:26px;font-weight:700;letter-spacing:-.4px}
.sd-device-id{margin-top:2px;font-size:12px;line-height:17px;color:var(--text-2);font-variant-numeric:tabular-nums}
.sd-tags{display:flex;gap:6px;margin-top:8px}
.sd-stats{margin-bottom:12px}

/* 柜体示意 */
.sd-cabinet{
  position:relative;height:184px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,var(--surface-2),var(--surface-3));
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.sd-cabinet-inner{
  position:absolute;inset:18px 30px;display:flex;border:2px solid var(--brand-line);
  border-radius:10px;background:var(--surface)
}
.sd-door{
  position:relative;flex:1;margin:6px;border:1px solid var(--brand-line);border-radius:8px;
  background:linear-gradient(180deg,var(--brand-weak),var(--brand-line));
  display:flex;align-items:center;justify-content:center;
  transform-origin:left center;transition:transform .4s ease,opacity .4s ease
}
.sd-door.sd-open{transform:perspective(600px) rotateY(-62deg);opacity:.55}
.sd-handle{
  position:absolute;right:10px;top:50%;width:5px;height:42px;border-radius:3px;
  background:var(--brand-line);transform:translateY(-50%)
}
.sd-lock{
  width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--brand);
  box-shadow:0 2px 8px rgba(36,52,200,.12);display:flex;align-items:center;justify-content:center
}
.sd-shelves{position:absolute;inset:18px 30px;display:none;flex-direction:column;gap:12px;padding:18px 22px}
.sd-cabinet.sd-show-shelves .sd-shelves{display:flex}
.sd-cabinet.sd-show-shelves .sd-door{opacity:0;pointer-events:none}
.sd-shelf{
  flex:1;border:1px solid var(--line);border-radius:6px;background:var(--surface);
  box-shadow:inset 0 2px 6px rgba(36,52,200,.04)
}
.sd-shelf-row{display:flex;gap:8px;padding:3px 6px;height:50%}
.sd-unit{flex:1;border-radius:4px;background:var(--brand-weak)}

/* 有实拍图时：柜体区改成 1:1 实拍 */
.sd-photo{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sd-cabinet.is-photo{height:auto;aspect-ratio:1/1;background:var(--surface-2)}
.sd-cabinet.is-photo .sd-photo{display:block}
.sd-cabinet.is-photo .sd-cabinet-inner,
.sd-cabinet.is-photo .sd-shelves{display:none}
.sd-open-tag{
  display:none;position:absolute;left:12px;bottom:12px;z-index:3;height:28px;padding:0 11px;
  align-items:center;gap:6px;border-radius:999px;background:rgba(255,255,255,.94);
  color:var(--ok);font-size:12px;line-height:18px;font-weight:700;
  box-shadow:0 2px 8px rgba(11,16,47,.14)
}
.sd-cabinet.is-photo.sd-show-shelves .sd-open-tag{display:inline-flex}
.sd-open-tag svg{width:14px;height:14px}

/* 照片可点击替换 */
.sd-cabinet{cursor:pointer}
.ph-btn{
  position:absolute;right:10px;bottom:10px;z-index:3;height:28px;padding:0 10px;
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  background:rgba(255,255,255,.94);color:var(--text);font-size:12px;line-height:18px;font-weight:700;
  box-shadow:0 2px 8px rgba(11,16,47,.14)
}
.ph-btn:active{background:#fff}
.ph-btn svg{width:14px;height:14px}
.ph-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-reset{margin-top:10px}

/* 状态值 */
.sd-ok{color:var(--ok)}

/* 顶栏右上：盘点（文字按钮，标题保持绝对居中） */
.sd-nav{position:relative;grid-template-columns:44px minmax(0,1fr) auto}
.sd-nav h1{position:absolute;left:50%;transform:translateX(-50%);max-width:150px}
.sd-stock-btn{
  height:32px;padding:0 10px;display:inline-flex;align-items:center;gap:5px;
  border-radius:9px;background:var(--brand-weak);color:var(--brand);
  font-size:13px;line-height:18px;font-weight:600;white-space:nowrap
}
.sd-stock-btn:active{background:var(--brand-line)}
.sd-stock-btn svg{width:16px;height:16px}
</style>
</head>
<body>
<main class="app" id="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar sd-nav">
    <span class="nav-left">
      <button class="icon-btn" aria-label="返回首页" onclick="appHome(event,'home')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    </span>
    <h1>设备详情</h1>
    <span class="nav-right">
      <button class="sd-stock-btn" id="inventoryBtn" type="button" aria-label="盘点">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
        <span>盘点</span>
      </button>
    </span>
  </header>

  <div class="body">
    <section class="sd-device">
      <div class="sd-device-name" data-device-name>曼谷机场 T1-A01</div>
      <div class="sd-device-id"><span data-device-id>VM-1001</span> · 单门开门柜</div>
      <div class="sd-tags"><span class="badge ok" data-conn-badge><span class="dot ok"></span>在线</span></div>
    </section>

    <section class="stats sd-stats" aria-label="商品与销量">
      <div class="stat"><div class="stat-label">商品 SKU 数</div><div class="stat-value">10<small>种</small></div></div>
      <div class="stat"><div class="stat-label">商品总量</div><div class="stat-value">50<small>件</small></div></div>
      <div class="stat"><div class="stat-label">上次补货量</div><div class="stat-value">32<small>件</small></div></div>
      <div class="stat"><div class="stat-label">最近售出量</div><div class="stat-value">31<small>件</small></div></div>
    </section>

    <section class="card" aria-label="柜体示意">
      <div class="card-head"><h2 class="card-title">柜体 · 单门</h2></div>
      <div class="card-body">
        <div class="sd-cabinet" id="cabinet">
          <img class="sd-photo" id="cabinetPhoto" alt="" width="800" height="800">
          <span class="sd-open-tag" id="openTag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 6"/></svg>
            已开锁
          </span>
          <button class="ph-btn" id="photoBtn" type="button" aria-haspopup="dialog" aria-controls="photoSheet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l.9-1.4h6.8L16.3 6h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.1"/></svg>
            <span id="photoBtnLabel">更换照片</span>
          </button>
          <div class="sd-cabinet-inner">
            <div class="sd-door" id="door">
              <span class="sd-handle"></span>
              <span class="sd-lock" id="lockIcon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
            </div>
          </div>
          <div class="sd-shelves"><div class="sd-shelf"><div class="sd-shelf-row"><span class="sd-unit"></span><span class="sd-unit"></span><span class="sd-unit"></span></div><div class="sd-shelf-row"><span class="sd-unit"></span><span class="sd-unit"></span><span class="sd-unit"></span></div></div><div class="sd-shelf"><div class="sd-shelf-row"><span class="sd-unit"></span><span class="sd-unit"></span><span class="sd-unit"></span></div><div class="sd-shelf-row"><span class="sd-unit"></span><span class="sd-unit"></span><span class="sd-unit"></span></div></div></div>
        </div>
      </div>
    </section>

    <section class="card" aria-label="设备状态">
      <div class="card-head"><h2 class="card-title">设备状态</h2></div>
      <div class="card-body">
        <div class="rows">
          <div class="row"><span class="row-k">在线状态</span><span class="row-v sd-ok" data-conn-value>在线</span></div>
          <div class="row"><span class="row-k">门状态</span><span class="row-v" id="doorState">已关闭</span></div>
          <div class="row"><span class="row-k">货架层数</span><span class="row-v">4 层</span></div>
          <div class="row"><span class="row-k">上次补货</span><span class="row-v">2026-11-18 10:00</span></div>
        </div>
      </div>
    </section>

    <section class="card" aria-label="远程操作">
      <div class="card-head"><h2 class="card-title">远程操作</h2></div>
      <div class="card-body">
        <div class="ops">
          <button class="btn btn-secondary" type="button" data-unlock aria-haspopup="dialog" aria-controls="unlockSheet">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
            <span data-unlock-label>开锁</span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <footer class="footer"><button class="btn btn-primary btn-block" id="restockBtn"><span>补货</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></footer>

  <div class="overlay" id="unlockSheet" role="dialog" aria-modal="true" aria-labelledby="unlockTitle">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-head">
        <h2 id="unlockTitle">远程开锁</h2>
        <button class="close" type="button" data-close aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <p class="sheet-note">确认后柜门可被打开，请确认设备周边安全后再继续。</p>
        <div class="rows">
          <div class="row"><span class="row-k">设备</span><span class="row-v">VM-1001 · 曼谷机场 T1-A01</span></div>
          <div class="row"><span class="row-k">门状态</span><span class="row-v">已关闭</span></div>
        </div>
        <div class="sheet-btns">
          <button class="btn btn-ghost" type="button" data-close>取消</button>
          <button class="btn btn-primary" type="button" data-unlock-confirm>确认开锁</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="photoSheet" role="dialog" aria-modal="true" aria-labelledby="photoTitle">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-head">
        <h2 id="photoTitle">柜体照片</h2>
        <button class="close" type="button" data-photo-close aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <p class="sheet-note">照片用于设备识别与远程巡检。建议正对柜体拍摄，光线均匀、柜体完整入画；支持 JPG / PNG，单张不超过 10MB。</p>
        <div class="ph-acts">
          <button class="btn btn-secondary" type="button" id="phCamera">拍照</button>
          <button class="btn btn-secondary" type="button" id="phAlbum">从相册选择</button>
        </div>
        <button class="btn btn-ghost btn-block ph-reset" type="button" id="phReset" hidden>恢复默认示意图</button>
      </div>
    </div>
  </div>
  <input type="file" id="phInput" accept="image/*" hidden>

  <div class="toast" id="toast" role="status"></div>
</main>
<script>
(function(){
  var qs=new URLSearchParams(location.search);
  var deviceId=qs.get('id')||'VM-1001';
  var deviceName=qs.get('name')||'曼谷机场 T1-A01';

  /* 柜体实拍：只有配了照片的设备走实拍，其余仍用柜体示意图 */
  var PHOTO={'VM-1001':'assets/device-vm-1001.jpg'};
  if(PHOTO[deviceId]){
    var cabinet=document.getElementById('cabinet');
    var photo=document.getElementById('cabinetPhoto');
    photo.src=PHOTO[deviceId];
    photo.alt=deviceName+' 柜体实拍';
    cabinet.classList.add('is-photo');
  }

  /* 右上「盘点」：进库存盘点页，带上当前设备 */
  document.getElementById('inventoryBtn').addEventListener('click',function(){
    location.href='inventory.html?device='+encodeURIComponent(deviceId);
  });
  document.getElementById('restockBtn').addEventListener('click',function(){
    location.href='cabinet-restock-c.html?id='+encodeURIComponent(deviceId)+'&name='+encodeURIComponent(deviceName);
  });
  document.addEventListener('DOMContentLoaded',function(){
    if(!window.appUnlock)return;
    var cabinet=document.getElementById('cabinet');
    appUnlock({
      buttons:'[data-unlock]',sheet:'unlockSheet',statusRow:'doorState',toast:'toast',
      onUnlock:function(){if(cabinet)cabinet.classList.add('sd-show-shelves')},
      onReset:function(){if(cabinet)cabinet.classList.remove('sd-show-shelves')}
    });
  });
})();
</script>
<script src="app-ui.js"></script>
<script>
/* 柜体照片：点击图片 / 右下角按钮 → 拍照或相册替换，按设备缓存在本地 */
(function(){
  var qs=new URLSearchParams(location.search);
  var deviceId=qs.get('id')||'VM-1001';
  var deviceName=qs.get('name')||'曼谷机场 T1-A01';
  var DEFAULTS={'VM-1001':'assets/device-vm-1001.jpg'};
  var fallback=DEFAULTS[deviceId]||'';
  var KEY='vs:device-photo:'+deviceId;

  var cabinet=document.getElementById('cabinet');
  var photo=document.getElementById('cabinetPhoto');
  var sheet=document.getElementById('photoSheet');
  var label=document.getElementById('photoBtnLabel');
  var resetBtn=document.getElementById('phReset');
  var input=document.getElementById('phInput');
  var toastEl=document.getElementById('toast');
  var toastTimer;

  function toast(text){
    if(!toastEl)return;
    toastEl.textContent=text;toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toastEl.classList.remove('show')},1800);
  }
  function stored(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
  function save(value){try{value?localStorage.setItem(KEY,value):localStorage.removeItem(KEY)}catch(e){}}

  function render(src){
    var show=src||fallback;
    if(show){
      photo.src=show;
      photo.alt=deviceName+' 柜体实拍';
      cabinet.classList.add('is-photo');
    }else{
      photo.removeAttribute('src');
      cabinet.classList.remove('is-photo');
    }
    label.textContent=show?'更换照片':'上传照片';
    resetBtn.textContent=fallback?'恢复默认实拍':'恢复默认示意图';
    resetBtn.hidden=!stored();
  }
  function openSheet(){sheet.classList.add('open')}
  function closeSheet(){sheet.classList.remove('open')}

  render(stored());

  cabinet.addEventListener('click',function(){openSheet()});
  sheet.querySelectorAll('[data-photo-close]').forEach(function(btn){btn.addEventListener('click',closeSheet)});
  sheet.addEventListener('click',function(event){if(event.target===sheet)closeSheet()});
  document.addEventListener('keydown',function(event){if(event.key==='Escape')closeSheet()});

  document.getElementById('phCamera').addEventListener('click',function(){
    input.setAttribute('capture','environment');input.click();
  });
  document.getElementById('phAlbum').addEventListener('click',function(){
    input.removeAttribute('capture');input.click();
  });

  input.addEventListener('change',function(){
    var file=input.files&&input.files[0];
    input.value='';
    if(!file)return;
    if(!/^image\//.test(file.type)){toast('请选择图片文件');return}
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        /* 压到长边 1200px 再存，避免本地缓存超限 */
        var max=1200,w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(Math.max(w,h)>max){var k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
        var canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        var data=canvas.toDataURL('image/jpeg',0.86);
        save(data);render(data);
        closeSheet();
        toast('柜体照片已更新');
      };
      img.onerror=function(){toast('图片读取失败，请重试')};
      img.src=reader.result;
    };
    reader.onerror=function(){toast('图片读取失败，请重试')};
    reader.readAsDataURL(file);
  });

  resetBtn.addEventListener('click',function(){
    save('');render('');closeSheet();
    toast(fallback?'已恢复默认实拍':'已恢复默认示意图');
  });
})();
</script>
</body>
</html>
