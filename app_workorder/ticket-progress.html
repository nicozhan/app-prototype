<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>记录处理进展 · VendSolution</title>
<link rel="stylesheet" href="../app-ui.css">
<style>
.tk-back{display:inline-flex;align-items:center;gap:2px;height:44px;font-size:13px;font-weight:600;
  color:var(--brand);white-space:nowrap}
.tk-sum-meta{font-size:11px;line-height:16px;color:var(--text-3);letter-spacing:.2px}
.tk-sum-title{margin-top:3px;font-size:15px;line-height:21px;font-weight:700;letter-spacing:-.1px}
.tk-hint{margin-top:5px;font-size:11px;line-height:16px;color:var(--text-3)}
.tk-sel{position:relative;display:flex;align-items:center;text-align:left}
.tk-sel .lbtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-sel .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.tk-sel.ph .lbtxt{color:var(--text-3)}
.tk-drop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;
  padding:5px;border:1px solid var(--line);border-radius:var(--r-ctl);
  background:var(--surface);box-shadow:0 10px 26px rgba(11,16,47,.12)}
.tk-drop span{display:block;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;
  color:var(--text-2);white-space:nowrap;cursor:pointer}
.tk-drop span.on{background:var(--brand-weak);color:var(--brand)}
.tk-photos{display:flex;gap:8px;flex-wrap:wrap}
.tk-ph{width:64px;height:64px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;font-size:10px;line-height:14px;font-weight:600;color:var(--text-2)}
.tk-ph.add{border-style:dashed;border-color:var(--brand-line);background:var(--surface);color:var(--brand)}
.tk-frow{display:flex;gap:8px}
.tk-frow .btn{flex:1}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left">
      <a class="tk-back" href="ticket-detail.html" onclick="return appBack(event)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回
      </a>
    </span>
    <h1>记录处理进展</h1>
    <span class="nav-right"></span>
  </header>

  <div class="body">

    <section class="card">
      <div class="card-body">
        <div class="tk-sum-meta">工单 WO-20261022-001</div>
        <div class="tk-sum-title">咖啡机无法出杯</div>
      </div>
    </section>

    <section class="card">
      <div class="card-body">

        <div class="field">
          <div class="field-label">处理阶段</div>
          <div class="select tk-sel" id="selStage">
            <span class="lbtxt">故障排查</span>
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>

        <div class="field">
          <div class="field-label">处理描述<span class="req">*</span></div>
          <textarea class="textarea">已检查电源与出货模块，发现出货电机连接异常……</textarea>
          <div class="tk-hint">每次保存都会追加一条新记录，不会覆盖历史内容</div>
        </div>

        <div class="field">
          <div class="field-label">故障原因<span style="font-weight:400;color:var(--text-3)">（选填）</span></div>
          <div class="select tk-sel ph" id="selReason">
            <span class="lbtxt">请选择故障原因</span>
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>

        <div class="field">
          <div class="field-label">现场照片</div>
          <div class="tk-photos">
            <span class="tk-ph">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>照片1</span>
            <span class="tk-ph">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>照片2</span>
            <span class="tk-ph add">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加</span>
          </div>
        </div>

        <div class="field">
          <div class="field-label">备注<span style="font-weight:400;color:var(--text-3)">（选填）</span></div>
          <input class="input" placeholder="补充说明（选填）">
        </div>

      </div>
    </section>

  </div>

  <footer class="footer">
    <div class="tk-frow">
      <a class="btn btn-ghost" href="ticket-detail.html">取消</a>
      <button class="btn btn-primary" id="saveBtn" type="button">保存记录</button>
    </div>
  </footer>

  <div class="toast" id="toast">处理记录已保存</div>

</main>

<script>
/* 通用下拉 */
function bindDrop(id, arr){
  var el = document.getElementById(id);
  var d = document.createElement('div');
  d.className = 'tk-drop'; d.style.display = 'none';
  d.innerHTML = arr.map(function(v){ return '<span data-v="' + v + '">' + v + '</span>'; }).join('');
  el.appendChild(d);
  el.addEventListener('click', function(e){
    e.stopPropagation();
    var s = e.target.closest('.tk-drop span');
    if(s){
      d.querySelectorAll('span').forEach(function(x){ x.classList.remove('on'); });
      s.classList.add('on');
      el.querySelector('.lbtxt').textContent = s.dataset.v;
      el.classList.remove('ph');
      d.style.display = 'none';
      return;
    }
    document.querySelectorAll('.tk-drop').forEach(function(x){ if(x !== d) x.style.display = 'none'; });
    d.style.display = (d.style.display === 'none') ? 'block' : 'none';
  });
}
bindDrop('selStage', ['故障诊断', '故障排查', '部件更换', '现场测试', '清洁保养']);
bindDrop('selReason', ['出货电机故障', '线路接触不良', '控制板异常', '缺料卡顿', '其他']);
document.addEventListener('click', function(){
  document.querySelectorAll('.tk-drop').forEach(function(x){ x.style.display = 'none'; });
});

/* 保存：追加记录，不改变工单状态 */
document.getElementById('saveBtn').addEventListener('click', function(){
  var t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1500);
  setTimeout(function(){ location.href = 'ticket-detail.html'; }, 800);
});
</script>
<script src="../app-ui.js"></script>
</body>
</html>
