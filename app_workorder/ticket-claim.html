<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>待认领工单 · VendSolution</title>
<link rel="stylesheet" href="../app-ui.css">
<style>
.tk-back{display:inline-flex;align-items:center;gap:2px;height:44px;font-size:13px;font-weight:600;
  color:var(--brand);white-space:nowrap}
.tk-frow{display:flex;gap:7px}
.tk-sel{flex:1;min-width:0;position:relative}
.tk-sel .lbtxt{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-ibtn{width:40px;flex:0 0 40px;padding:0;color:var(--brand)}
.tk-drop{position:absolute;left:0;top:calc(100% + 6px);z-index:20;min-width:100%;
  padding:5px;border:1px solid var(--line);border-radius:var(--r-ctl);
  background:var(--surface);box-shadow:0 10px 26px rgba(11,16,47,.12)}
.tk-drop span{display:block;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;
  color:var(--text-2);white-space:nowrap;cursor:pointer}
.tk-drop span.on{background:var(--brand-weak);color:var(--brand)}
.tk-filter{display:none;margin-top:10px}
.tk-filter.open{display:block}
.tk-acts{display:flex;gap:8px;padding-top:12px}
.tk-acts .btn{flex:1}
.tk-wait{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2)}
.tk-wait.hot{color:var(--warn)}
.tk-wait.over{color:var(--danger)}
.tk-dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);display:inline-block;flex:0 0 auto}
.tk-dot.warn{background:var(--warn)}
.tk-dot.danger{background:var(--danger)}
.tk-tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  padding:5px 4px calc(5px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--surface)}
.tk-tab{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10px;line-height:14px;font-weight:600;color:var(--text-3);border-radius:var(--r-sm)}
.tk-tab.on{color:var(--brand)}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left">
      <a class="tk-back" href="tickets.html" onclick="return appBack(event)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回
      </a>
    </span>
    <h1>待认领工单</h1>
    <span class="nav-right"></span>
  </header>

  <div class="body">

    <div class="tk-frow">
      <span class="filter-select tk-sel" id="selType" data-key="type">
        <span class="lbtxt">维修</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
      <span class="filter-select tk-sel" id="selPri" data-key="pri">
        <span class="lbtxt">优先级</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
      <button class="filter-select tk-ibtn" id="fltBtn" type="button" aria-label="筛选">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      </button>
    </div>

    <div class="tk-filter" id="tfilter">
      <div class="card">
        <div class="card-body">
          <div class="field-label">等待时长</div>
          <div class="chips" id="waitOpts">
            <button class="chip active" type="button" data-v="all">全部</button>
            <button class="chip" type="button" data-v="hot">30 分钟以上</button>
            <button class="chip" type="button" data-v="over">60 分钟以上</button>
          </div>
        </div>
      </div>
    </div>

    <div class="search mt-12">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="kw" placeholder="搜索标题 / 设备SN">
    </div>

    <div class="mt-12" id="tklist"></div>
  </div>

  <nav class="tk-tabbar">
    <a class="tk-tab" href="../home.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>工作台</a>
    <a class="tk-tab on" href="tickets.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>工单</a>
    <a class="tk-tab" href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>消息</a>
    <a class="tk-tab" href="../my.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>我的</a>
  </nav>

  <div class="toast" id="toast">认领成功</div>

</main>

<script>
var LIST = [
  { id:'WO-101', pri:'P1', lb:'P1 · 紧急', title:'咖啡机无法出杯',
    site:'上海 A 店', sn:'CF-001', wait:25, type:'维修' },
  { id:'WO-102', pri:'P2', lb:'P2 · 普通', title:'制冷温度异常',
    site:'北京 B 店', sn:'VM-003', wait:40, type:'维修' },
  { id:'WO-103', pri:'P1', lb:'P1 · 紧急', title:'支付模块无响应',
    site:'深圳科技园', sn:'VM-007', wait:68, type:'维修' }
];

var fType = 'all', fPri = 'all', fWait = 'all', kw = '';

function waitCls(w){ return w >= 60 ? 'over' : (w >= 30 ? 'hot' : ''); }

function render(){
  var list = LIST.filter(function(t){
    if(fType !== 'all' && t.type !== fType) return false;
    if(fPri !== 'all' && t.pri !== fPri) return false;
    if(fWait === 'hot' && t.wait < 30) return false;
    if(fWait === 'over' && t.wait < 60) return false;
    if(kw){
      var s = (t.title + ' ' + t.id + ' ' + t.sn).toLowerCase();
      if(s.indexOf(kw.toLowerCase()) === -1) return false;
    }
    return true;
  });
  var el = document.getElementById('tklist');
  if(!list.length){
    el.innerHTML = '<div class="card"><div class="empty">'
      + '<div class="empty-icon gray"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>'
      + '<p>暂无符合条件的待认领工单</p></div></div>';
    return;
  }
  el.innerHTML = list.map(function(t){
    var w = waitCls(t.wait);
    var dot = w === 'over' ? 'danger' : (w === 'hot' ? 'warn' : '');
    var pri = t.pri === 'P1' ? 'brand' : '';
    return '<div class="card">'
      +  '<div class="item no-thumb tall">'
      +    '<div class="item-body">'
      +      '<div class="item-name">' + t.title + '</div>'
      +      '<div class="item-sub">' + t.site + ' · ' + t.sn + ' · ' + t.id + '</div>'
      +      '<div class="item-meta">'
      +        '<span class="badge ' + pri + '">' + t.lb + '</span>'
      +        '<span class="tk-wait ' + w + '"><span class="tk-dot ' + dot + '"></span>等待 ' + t.wait + ' 分钟</span>'
      +      '</div>'
      +    '</div>'
      +    '<span class="badge brand">待认领</span>'
      +  '</div>'
      +  '<div class="card-foot tk-acts">'
      +    '<a class="btn btn-ghost btn-sm" href="ticket-detail.html">查看详情</a>'
      +    '<a class="btn btn-primary btn-sm claim" href="#" data-id="' + t.id + '">认领工单</a>'
      +  '</div>'
      + '</div>';
  }).join('');
}

/* 下拉选择 */
var TYPES = ['全部', '维修', '保养', '巡检'];
var PRIS  = ['全部', 'P1', 'P2'];
function buildDrop(el, arr, cb){
  var d = document.createElement('div');
  d.className = 'tk-drop'; d.style.display = 'none';
  d.innerHTML = arr.map(function(v){
    return '<span data-v="' + v + '">' + v + '</span>';
  }).join('');
  el.appendChild(d);
  el.addEventListener('click', function(e){
    e.stopPropagation();
    var span = e.target.closest('.tk-drop span');
    if(span){
      d.querySelectorAll('span').forEach(function(x){ x.classList.remove('on'); });
      span.classList.add('on');
      el.querySelector('.lbtxt').textContent = span.dataset.v === '全部' ? (el.dataset.key === 'type' ? '维修' : '优先级') : span.dataset.v;
      cb(span.dataset.v);
      d.style.display = 'none';
      return;
    }
    document.querySelectorAll('.tk-drop').forEach(function(x){ if(x !== d) x.style.display = 'none'; });
    d.style.display = (d.style.display === 'none') ? 'block' : 'none';
  });
}
buildDrop(document.getElementById('selType'), TYPES, function(v){ fType = (v === '全部' ? 'all' : v); render(); });
buildDrop(document.getElementById('selPri'), PRIS, function(v){ fPri = (v === '全部' ? 'all' : v); render(); });
document.addEventListener('click', function(){
  document.querySelectorAll('.tk-drop').forEach(function(x){ x.style.display = 'none'; });
});

/* 筛选面板 */
document.getElementById('fltBtn').addEventListener('click', function(){
  document.getElementById('tfilter').classList.toggle('open');
});
document.getElementById('waitOpts').addEventListener('click', function(e){
  var o = e.target.closest('.chip'); if(!o) return;
  this.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('active'); });
  o.classList.add('active');
  fWait = o.dataset.v; render();
});

/* 搜索 */
document.getElementById('kw').addEventListener('input', function(){
  kw = this.value.trim(); render();
});

/* 认领：直接认领，成功后进入详情；失败提示已被认领 */
document.getElementById('tklist').addEventListener('click', function(e){
  var b = e.target.closest('.claim'); if(!b) return;
  e.preventDefault();
  var t = document.getElementById('toast');
  t.textContent = '认领成功 · ' + b.dataset.id;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1400);
  setTimeout(function(){ location.href = 'ticket-detail.html'; }, 700);
});

render();
</script>
<script src="../app-ui.js"></script>
</body>
</html>
