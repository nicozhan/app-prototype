<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>工单 · VendSolution</title>
<link rel="stylesheet" href="../app-ui.css">
<style>
.tk-filter{display:none;margin-bottom:10px}
.tk-filter.open{display:block}
.tk-fg+.tk-fg{margin-top:11px}
.tk-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.tk-go{font-size:12px;line-height:16px;font-weight:600;color:var(--brand);white-space:nowrap}
.tk-sla{display:inline-flex;align-items:center;gap:5px;min-width:0}
.tk-sla span{overflow:hidden;text-overflow:ellipsis}
.tk-sla.warn{color:var(--warn)}
.tk-sla.danger{color:var(--danger)}
.tk-sla.ok{color:var(--text-2)}
.tk-dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);display:inline-block;flex:0 0 auto}
.tk-dot.ok{background:var(--ok)}
.tk-dot.warn{background:var(--warn)}
.tk-dot.danger{background:var(--danger)}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left"><button class="icon-btn" type="button" aria-label="返回常用" onclick="appHome(event,'common')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button></span>
    <h1><button class="mod-title" type="button" data-mod-toggle="#modMenu" aria-expanded="false"><span>工单</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button></h1>
    <span class="nav-right"><button class="nav-text" id="fltBtn" type="button" aria-expanded="false" aria-controls="tfilter"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>筛选</button></span>
    <nav class="mod-menu" id="modMenu" aria-label="模块切换">
      <a href="../products.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg><span>商品</span></a>
      <a href="../machines.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>设备</span></a>
      <a href="../alerts.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg><span>告警</span></a>
      <a href="tickets.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.2H7.4A2.4 2.4 0 0 0 5 6.6v11.8A2.4 2.4 0 0 0 7.4 20.8h9.2a2.4 2.4 0 0 0 2.4-2.4V6.6a2.4 2.4 0 0 0-2.4-2.4H15"/><path d="M9 3h6a1 1 0 0 1 1 1v1.8a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="m8.8 13.4 2.2 2.2 4.2-4.2"/></svg><span>工单</span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></a>
      <a href="../analytics.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3.6v15.8a1 1 0 0 0 1 1h15.4"/><path d="M8.4 16.6v-4.2M13 16.6V8.4M17.6 16.6v-6.4"/></svg><span>经营分析</span></a>
    </nav>
  </header>

  <div class="tabs" id="mainTabs">
    <button class="tab active" data-v="mine" type="button">我的工单<span class="count" id="cMine"></span></button>
    <button class="tab" data-v="claim" type="button">待认领<span class="count" id="cClaim"></span></button>
  </div>

  <div class="body">

    <div class="tk-filter" id="tfilter">
      <div class="card">
        <div class="card-body">
          <div class="tk-fg">
            <div class="field-label">优先级</div>
            <div class="chips" id="priOpts">
              <button class="chip active" type="button" data-v="all">全部</button>
              <button class="chip" type="button" data-v="P1">P1 紧急</button>
              <button class="chip" type="button" data-v="P2">P2 普通</button>
            </div>
          </div>
          <div class="tk-fg">
            <div class="field-label">SLA 状态</div>
            <div class="chips" id="slaOpts">
              <button class="chip active" type="button" data-v="all">全部</button>
              <button class="chip" type="button" data-v="warn">即将超时</button>
              <button class="chip" type="button" data-v="danger">已超时</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="chips" id="chips">
      <button class="chip active" type="button" data-v="all">全部</button>
      <button class="chip" type="button" data-v="doing">处理中</button>
      <button class="chip" type="button" data-v="feedback">待反馈</button>
      <button class="chip" type="button" data-v="review">待审核</button>
    </div>

    <div class="search mt-12">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="kw" placeholder="搜索工单标题 / 编号 / 设备SN">
    </div>

    <div class="mt-12" id="tklist"></div>
  </div>

</main>

<script>
var TICKETS = [
  { id:'WO-001', pri:'P1', st:'处理中', stKey:'doing',
    title:'咖啡机无法出杯', site:'上海 A 店', sn:'CF-001', mode:'mine',
    slaCls:'warn', slaText:'SLA 剩余 2 小时' },
  { id:'WO-002', pri:'P2', st:'等待反馈', stKey:'feedback',
    title:'设备通讯异常', site:'北京 B 店', sn:'VM-1002', mode:'mine',
    note:'等待原因：等待配件', noteCls:'warn' },
  { id:'WO-003', pri:'P1', st:'待审核', stKey:'review',
    title:'支付模块故障', site:'深圳科技园', sn:'VM-1003', mode:'mine',
    note:'完工已提交，等待审核', noteCls:'ok' },
  { id:'WO-004', pri:'P1', st:'处理中', stKey:'doing',
    title:'制冷系统停机', site:'广州天河店', sn:'CF-004', mode:'mine',
    slaCls:'danger', slaText:'SLA 已超时 35 分钟' },
  { id:'WO-005', pri:'P1', st:'待认领', stKey:'claim',
    title:'出杯口持续卡货', site:'上海 B 店', sn:'CF-005', mode:'claim',
    slaCls:'ok', slaText:'SLA 剩余 4 小时' },
  { id:'WO-006', pri:'P2', st:'待认领', stKey:'claim',
    title:'屏幕显示花屏', site:'杭州西湖店', sn:'VM-1006', mode:'claim',
    slaCls:'ok', slaText:'SLA 剩余 6 小时' }
];

var mainTab = 'mine', chip = 'all', priFilter = 'all', slaFilter = 'all', kw = '';

var SEV = { P1:{ cls:'brand', txt:'P1 · 紧急' }, P2:{ cls:'', txt:'P2 · 普通' } };
var STC = { doing:'brand', feedback:'warn', review:'', claim:'brand' };

function filtered(){
  return TICKETS.filter(function(t){
    if(t.mode !== mainTab) return false;
    if(mainTab === 'mine' && chip !== 'all' && t.stKey !== chip) return false;
    if(priFilter !== 'all' && t.pri !== priFilter) return false;
    if(slaFilter !== 'all' && t.slaCls !== slaFilter) return false;
    if(kw){
      var s = (t.title + ' ' + t.id + ' ' + t.sn + ' ' + t.site).toLowerCase();
      if(s.indexOf(kw.toLowerCase()) === -1) return false;
    }
    return true;
  });
}

function rowHtml(t){
  var sev = SEV[t.pri];
  var txt = t.note || t.slaText || '';
  var cls = t.note ? t.noteCls : t.slaCls;
  var dot = cls === 'warn' ? 'warn' : (cls === 'danger' ? 'danger' : (cls === 'ok' ? 'ok' : ''));
  var act = (t.mode === 'claim') ? '认领 →' : '查看 →';
  return '<a class="item no-thumb tall" href="ticket-detail.html">'
       +   '<span class="item-body">'
       +     '<span class="item-name">' + t.title + '</span>'
       +     '<span class="item-sub">' + t.site + ' · ' + t.sn + ' · ' + t.id + '</span>'
       +     '<span class="item-meta tk-sla ' + (cls || '') + '">'
       +       '<span class="badge ' + sev.cls + '">' + sev.txt + '</span>'
       +       '<span class="tk-dot ' + dot + '"></span><span>' + txt + '</span>'
       +     '</span>'
       +   '</span>'
       +   '<span class="tk-side">'
       +     '<span class="badge ' + STC[t.stKey] + '">' + t.st + '</span>'
       +     '<span class="tk-go">' + act + '</span>'
       +   '</span>'
       + '</a>';
}

function render(){
  var list = filtered();
  document.getElementById('cMine').textContent =
    TICKETS.filter(function(t){ return t.mode==='mine'; }).length;
  document.getElementById('cClaim').textContent =
    TICKETS.filter(function(t){ return t.mode==='claim'; }).length;
  document.getElementById('chips').style.display = (mainTab === 'mine') ? 'flex' : 'none';

  var el = document.getElementById('tklist');
  if(!list.length){
    el.innerHTML = '<div class="card"><div class="empty">'
      + '<div class="empty-icon gray"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h6v3a2 2 0 0 0 4 0V5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2v3a2 2 0 0 0 4 0z"/></svg></div>'
      + '<p>暂无符合条件的工单</p></div></div>';
    return;
  }
  el.innerHTML = '<div class="card"><div class="list">' + list.map(rowHtml).join('') + '</div></div>';
}

/* 主 Tab */
document.getElementById('mainTabs').addEventListener('click', function(e){
  var m = e.target.closest('.tab'); if(!m) return;
  this.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
  m.classList.add('active');
  mainTab = m.dataset.v; chip = 'all';
  this.parentNode.querySelectorAll('#chips .chip').forEach(function(x, i){
    x.classList.toggle('active', i === 0);
  });
  render();
});

/* 状态 chips */
document.getElementById('chips').addEventListener('click', function(e){
  var c = e.target.closest('.chip'); if(!c) return;
  this.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('active'); });
  c.classList.add('active');
  chip = c.dataset.v;
  render();
});

/* 筛选面板 */
document.getElementById('fltBtn').addEventListener('click', function(){
  document.getElementById('tfilter').classList.toggle('open');
});
document.getElementById('priOpts').addEventListener('click', function(e){
  var o = e.target.closest('.chip'); if(!o) return;
  this.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('active'); });
  o.classList.add('active');
  priFilter = o.dataset.v;
  render();
});
document.getElementById('slaOpts').addEventListener('click', function(e){
  var o = e.target.closest('.chip'); if(!o) return;
  this.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('active'); });
  o.classList.add('active');
  slaFilter = o.dataset.v;
  render();
});

/* 搜索 */
document.getElementById('kw').addEventListener('input', function(){
  kw = this.value.trim();
  render();
});

render();
</script>
<script src="../app-ui.js"></script>
</body>
</html>
