<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>转派工单 · VendSolution</title>
<link rel="stylesheet" href="../app-ui.css">
<style>
.tk-back{display:inline-flex;align-items:center;gap:2px;height:44px;font-size:13px;font-weight:600;
  color:var(--brand);white-space:nowrap}
.tk-sum-meta{font-size:11px;line-height:16px;color:var(--text-3);letter-spacing:.2px}
.tk-sum-title{margin-top:3px;font-size:15px;line-height:21px;font-weight:700;letter-spacing:-.1px}
.tk-org{font-size:14px;line-height:20px;font-weight:700}
.tk-org-sub{margin-top:2px;font-size:12px;line-height:17px;color:var(--text-2)}
.tk-hint{margin-top:6px;font-size:11px;line-height:16px;color:var(--text-3)}
.tk-sel{position:relative;display:flex;align-items:center;text-align:left}
.tk-sel .lbtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-sel.ph .lbtxt{color:var(--text-3)}
.tk-sel .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.tk-drop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;
  padding:5px;border:1px solid var(--line);border-radius:var(--r-ctl);
  background:var(--surface);box-shadow:0 10px 26px rgba(11,16,47,.12)}
.tk-drop span{display:block;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;
  color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tk-drop span.on{background:var(--brand-weak);color:var(--brand)}
.tk-rtext{display:block;min-width:0;flex:1}
.tk-rsub{display:block;margin-top:2px;font-size:11.5px;line-height:16px;font-weight:400;color:var(--text-2)}
.tk-frow{display:flex;gap:8px}
.tk-frow .btn{flex:1}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left">
      <a class="tk-back" href="ticket-detail.html" onclick="return appBack(event)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回
      </a>
    </span>
    <h1>转派工单</h1>
    <span class="nav-right"></span>
  </header>

  <div class="body">

    <section class="card">
      <div class="card-body">
        <div class="tk-sum-meta">WO-20261022-001</div>
        <div class="tk-sum-title">咖啡机无法出杯</div>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><div class="card-title">当前接收组织</div></div>
      <div class="card-body">
        <div class="tk-org">上海维修组</div>
        <div class="tk-org-sub">当前处理人：张三</div>
      </div>
    </section>

    <section class="card">
      <div class="card-body">

        <div class="field">
          <div class="field-label">目标接收组织<span class="req">*</span></div>
          <div class="select tk-sel ph" id="selOrg">
            <span class="lbtxt">选择组织</span>
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>

        <div class="field">
          <div class="field-label">目标处理人</div>
          <div class="select tk-sel ph" id="selUser">
            <span class="lbtxt">选择人员</span>
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="tk-hint">转派后将同步记录原组织与原处理人</div>
        </div>

        <div class="field">
          <div class="field-label">转派原因<span class="req">*</span></div>
          <textarea class="textarea" id="reason" style="min-height:70px">该设备需专业电控维修资质，转由深圳维修组处理。</textarea>
        </div>

        <div class="field">
          <div class="field-label">转派后</div>
          <div class="radios" id="modeGrp">
            <button class="radio active" type="button" data-v="assign">
              <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
              <span class="tk-rtext">直接分配给指定人员<span class="tk-rsub">目标处理人立即成为当前处理人</span></span>
            </button>
            <button class="radio" type="button" data-v="pool">
              <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
              <span class="tk-rtext">转入目标组织待认领池<span class="tk-rsub">由目标组织成员自行认领</span></span>
            </button>
          </div>
        </div>

      </div>
    </section>

  </div>

  <footer class="footer">
    <div class="tk-frow">
      <a class="btn btn-ghost" href="ticket-detail.html">取消</a>
      <button class="btn btn-primary" id="okBtn" type="button">确认转派</button>
    </div>
  </footer>

  <div class="toast" id="toast">转派成功</div>

</main>

<script>
function bindDrop(id, arr){
  var el = document.getElementById(id);
  var d = document.createElement('div');
  d.className = 'tk-drop'; d.style.display = 'none';
  d.innerHTML = arr.map(function(v){ return '<span data-v="' + v + '">' + v + '</span>'; }).join('');
  el.appendChild(d);
  el.addEventListener('click', function(e){
    e.stopPropagation();
    var s = e.target.closest('.tk-drop span');
    if(s){
      d.querySelectorAll('span').forEach(function(x){ x.classList.remove('on'); });
      s.classList.add('on');
      el.querySelector('.lbtxt').textContent = s.dataset.v;
      el.classList.remove('ph');
      d.style.display = 'none';
      return;
    }
    document.querySelectorAll('.tk-drop').forEach(function(x){ if(x !== d) x.style.display = 'none'; });
    d.style.display = (d.style.display === 'none') ? 'block' : 'none';
  });
  return el;
}
bindDrop('selOrg', ['深圳维修组', '上海维修组', '北京维修组', '广州维修组']);
bindDrop('selUser', ['王五（电控高级技师）', '李四（设备工程师）', '赵六（维修专员）']);
document.addEventListener('click', function(){
  document.querySelectorAll('.tk-drop').forEach(function(x){ x.style.display = 'none'; });
});

document.getElementById('modeGrp').addEventListener('click', function(e){
  var r = e.target.closest('.radio'); if(!r) return;
  this.querySelectorAll('.radio').forEach(function(x){ x.classList.remove('active'); });
  r.classList.add('active');
});

document.getElementById('okBtn').addEventListener('click', function(){
  var org = document.getElementById('selOrg').querySelector('.lbtxt').textContent;
  var t = document.getElementById('toast');
  if(org === '选择组织'){
    t.textContent = '请选择目标接收组织';
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1500);
    return;
  }
  if(!document.getElementById('reason').value.trim()){
    t.textContent = '请填写转派原因';
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1500);
    return;
  }
  t.textContent = '已转派至 ' + org;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1500);
  setTimeout(function(){ location.href = 'ticket-detail.html'; }, 900);
});
</script>
<script src="../app-ui.js"></script>
</body>
</html>
