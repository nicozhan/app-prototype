<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>提交完工 · VendSolution</title>
<link rel="stylesheet" href="../app-ui.css">
<style>
.tk-back{display:inline-flex;align-items:center;gap:2px;height:44px;font-size:13px;font-weight:600;
  color:var(--brand);white-space:nowrap}
.tk-sum-meta{font-size:11px;line-height:16px;color:var(--text-3);letter-spacing:.2px}
.tk-sum-title{margin-top:3px;font-size:15px;line-height:21px;font-weight:700;letter-spacing:-.1px}
.tk-hint{margin-top:6px;font-size:11px;line-height:16px;color:var(--text-3)}
.tk-note{display:none;align-items:flex-start;gap:8px;margin-top:11px;padding:10px 12px;
  border-radius:var(--r-ctl);background:var(--warn-bg);color:var(--warn);
  font-size:12px;line-height:17px}
.tk-note.on{display:flex}
.tk-note svg{margin-top:1px}
.tk-note b{font-weight:700}
.tk-photos{display:flex;gap:8px;flex-wrap:wrap}
.tk-ph{width:64px;height:64px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;font-size:10px;line-height:14px;font-weight:600;color:var(--text-2);text-align:center}
.tk-ph.add{border-style:dashed;border-color:var(--brand-line);background:var(--surface);color:var(--brand)}
.tk-frow{display:flex;gap:8px}
.tk-frow .btn{flex:1}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left">
      <a class="tk-back" href="ticket-detail.html" onclick="return appBack(event)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回
      </a>
    </span>
    <h1>提交完工</h1>
    <span class="nav-right"></span>
  </header>

  <div class="body">

    <section class="card">
      <div class="card-body">
        <div class="tk-sum-meta">WO-20261022-001</div>
        <div class="tk-sum-title">咖啡机无法出杯</div>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><div class="card-title">一、维修处理<span class="req">*</span></div></div>
      <div class="card-body">
        <textarea class="textarea" id="repr" style="min-height:76px">更换出货电机连接线，重新固定连接器。</textarea>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><div class="card-title">二、测试结果<span class="req">*</span></div></div>
      <div class="card-body">
        <div class="segmented" id="resGrp">
          <button class="active" type="button" data-v="pass">测试通过</button>
          <button type="button" data-v="partial">部分恢复</button>
          <button type="button" data-v="fail">测试失败</button>
        </div>

        <div class="tk-note" id="failNote">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <div><b>测试未通过</b><br>建议继续处理后再提交；如确需特殊完工，请在下方说明中填写原因。</div>
        </div>

        <div class="field mt-12">
          <div class="field-label">测试说明<span class="req">*</span></div>
          <input class="input" id="tnote" value="连续出杯测试 5 次，均正常">
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><div class="card-title">三、现场照片<span class="req">*</span></div></div>
      <div class="card-body">
        <div class="tk-photos" id="phs">
          <span class="tk-ph">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>维修后</span>
          <span class="tk-ph add">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加照片</span>
        </div>
        <div class="tk-hint">至少上传 1 张维修完成后的现场照片</div>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><div class="card-title">四、其他说明<span style="font-weight:400;color:var(--text-3);font-size:12px">（选填）</span></div></div>
      <div class="card-body">
        <input class="input" placeholder="补充说明（选填）">
      </div>
    </section>

  </div>

  <footer class="footer">
    <div class="tk-frow">
      <button class="btn btn-ghost" id="draftBtn" type="button">保存草稿</button>
      <button class="btn btn-primary" id="submitBtn" type="button">提交审核</button>
    </div>
  </footer>

  <div class="toast" id="toast">提交成功</div>

</main>

<script>
var toastEl = document.getElementById('toast');
function toast(msg, ms){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(function(){ toastEl.classList.remove('show'); }, ms || 1500);
}

/* 测试结果：选择「测试失败」时给出提示 */
document.getElementById('resGrp').addEventListener('click', function(e){
  var r = e.target.closest('button[data-v]'); if(!r) return;
  this.querySelectorAll('button').forEach(function(x){ x.classList.remove('active'); });
  r.classList.add('active');
  document.getElementById('failNote').classList.toggle('on', r.dataset.v === 'fail');
});

/* 保存草稿 */
document.getElementById('draftBtn').addEventListener('click', function(){
  toast('草稿已保存');
  setTimeout(function(){ location.href = 'ticket-detail.html'; }, 900);
});

/* 提交审核：必填校验 */
document.getElementById('submitBtn').addEventListener('click', function(){
  if(!document.getElementById('repr').value.trim()){ toast('请填写维修处理描述'); return; }
  if(!document.getElementById('tnote').value.trim()){ toast('请填写测试说明'); return; }
  if(document.querySelectorAll('#phs .tk-ph:not(.add)').length < 1){ toast('请上传现场照片'); return; }
  toast('已提交，等待管理员审核');
  setTimeout(function(){ location.href = 'ticket-detail.html'; }, 1000);
});
</script>
<script src="../app-ui.js"></script>
</body>
</html>
