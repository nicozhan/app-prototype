<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>提交完工 · VendSolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vend.css">
<style>
  .screen{ width:393px; max-width:100%; min-height:100dvh;
    padding-bottom:calc(96px + env(safe-area-inset-bottom)); }
  .failnote{ display:none; }
  .failnote.on{ display:flex; }
</style>
</head>
<body>
<div class="screen">

  <div class="dtop">
    <a class="back" href="ticket-detail.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回</a>
    <div class="title">提交完工</div>
    <span class="right"></span>
  </div>

  <!-- 工单摘要 -->
  <div class="sect" style="margin-top:9px;padding:10px 12px">
    <div style="font-size:11px;color:var(--gray);letter-spacing:.3px">WO-20261022-001</div>
    <div class="tktitle" style="font-size:14.5px;margin-top:3px">咖啡机无法出杯</div>
  </div>

  <!-- 一、维修处理 -->
  <div class="sect">
    <label class="flabel">一、维修处理<span class="req">*</span></label>
    <textarea class="ftarea" id="repr">更换出货电机连接线，重新固定连接器。</textarea>
  </div>

  <!-- 二、测试结果 -->
  <div class="sect">
    <label class="flabel">二、测试结果<span class="req">*</span></label>
    <div class="rgrp" id="resGrp">
      <span class="radio on" data-v="pass"><span class="dot"></span><b>测试通过</b></span>
      <span class="radio" data-v="partial"><span class="dot"></span><b>部分恢复</b></span>
      <span class="radio" data-v="fail"><span class="dot"></span><b>测试失败</b></span>
    </div>
    <div class="notice warn failnote" id="failNote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <div><b>测试未通过</b><br>建议继续处理后再提交；如确需特殊完工，请在下方说明中填写原因。</div>
    </div>
    <div class="field" style="margin-top:11px">
      <label class="flabel">测试说明<span class="req">*</span></label>
      <input class="finput" id="tnote" value="连续出杯测试 5 次，均正常">
    </div>
  </div>

  <!-- 三、现场照片 -->
  <div class="sect">
    <label class="flabel">三、现场照片<span class="req">*</span></label>
    <div class="photos" id="phs">
      <span class="photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>维修后</span>
      <span class="photo add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加照片</span>
    </div>
    <div class="fhint">至少上传 1 张维修完成后的现场照片</div>
  </div>

  <!-- 四、其他说明 -->
  <div class="sect">
    <label class="flabel">四、其他说明<span class="opt">（选填）</span></label>
    <input class="finput" placeholder="补充说明（选填）">
  </div>

  <!-- 底部操作 -->
  <div class="dobot">
    <div class="row2">
      <button class="abtn ghost" id="draftBtn">保存草稿</button>
      <button class="abtn" id="submitBtn">提交审核</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">提交成功</div>

<script>
var toastEl = document.getElementById('toast');
function toast(msg, ms){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  setTimeout(function(){ toastEl.classList.remove('on'); }, ms || 1500);
}

/* 测试结果：选择「测试失败」时给出提示 */
document.getElementById('resGrp').addEventListener('click', function(e){
  var r = e.target.closest('.radio'); if(!r) return;
  this.querySelectorAll('.radio').forEach(function(x){ x.classList.remove('on'); });
  r.classList.add('on');
  document.getElementById('failNote').classList.toggle('on', r.dataset.v === 'fail');
});

/* 保存草稿 */
document.getElementById('draftBtn').addEventListener('click', function(){
  toast('草稿已保存');
  setTimeout(function(){ location.href = 'ticket-detail.html'; }, 900);
});

/* 提交审核：必填校验 */
document.getElementById('submitBtn').addEventListener('click', function(){
  if(!document.getElementById('repr').value.trim()){ toast('请填写维修处理描述'); return; }
  if(!document.getElementById('tnote').value.trim()){ toast('请填写测试说明'); return; }
  if(document.querySelectorAll('#phs .photo:not(.add)').length < 1){ toast('请上传现场照片'); return; }
  toast('已提交，等待管理员审核');
  setTimeout(function(){ location.href = 'ticket-detail.html'; }, 1000);
});
</script>
</body>
</html>
