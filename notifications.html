<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>通知 · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
/* 通知列表 · 页面前缀 nt- */
.nt-back{
  display:inline-flex;align-items:center;gap:2px;height:44px;
  font-size:13px;font-weight:600;color:var(--brand);white-space:nowrap
}
.nt-back svg{width:17px;height:17px}

/* 未读汇总 */
.nt-sum-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nt-count{display:flex;align-items:baseline;gap:6px;min-width:0}
.nt-num{
  font-size:30px;line-height:36px;font-weight:800;letter-spacing:-1px;color:var(--ink);
  font-variant-numeric:tabular-nums
}
.nt-lbl{font-size:12px;line-height:17px;font-weight:600;color:var(--text-2)}
.nt-bell{
  width:36px;height:36px;flex:0 0 auto;border-radius:12px;background:var(--brand-weak);color:var(--brand);
  display:flex;align-items:center;justify-content:center
}

.nt-seg{margin-top:10px}

.nt-refresh{
  width:100%;padding:10px 0 2px;display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:12px;font-weight:600;color:var(--text-2)
}
.nt-refresh svg{width:13px;height:13px;color:var(--text-3)}

.nt-list{
  margin-top:8px;border:1px solid var(--line);border-radius:var(--r-card);
  background:var(--surface);overflow:hidden
}
.nt-list.is-empty{border:0;background:transparent}
.nt-list .empty-icon svg{width:22px;height:22px}

.nt-ic svg{width:20px;height:20px}
.nt-ic.p0{background:var(--danger-bg);color:var(--danger)}
.nt-ic.p1{background:var(--warn-bg);color:var(--warn)}
.nt-ic.p2{background:var(--brand-weak);color:var(--brand)}
.nt-item.read .nt-ic{background:var(--surface-2);color:var(--text-3)}

.nt-item{padding-top:13px;padding-bottom:13px}
.nt-item .item-name{letter-spacing:-.1px}
.nt-item.read .item-name{color:var(--text-2)}
.nt-sum{
  display:block;margin-top:3px;font-size:12px;line-height:17px;color:var(--text-2)
}
.nt-item.read .nt-sum{color:var(--text-3)}
.nt-time{color:var(--text-3);font-variant-numeric:tabular-nums}
.nt-view{margin-left:auto;font-size:12px;font-weight:700;color:var(--brand);white-space:nowrap}
.nt-item.read .nt-view{color:var(--text-2);font-weight:600}
.nt-dot{width:7px;height:7px;background:var(--brand)}

.nt-load{margin-top:12px;text-align:center;font-size:12px;line-height:17px;color:var(--text-3)}

/* 底部 Tab */
.nt-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.nt-tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;
  font-size:10px;line-height:14px;font-weight:600;color:var(--text-2)
}
.nt-tab svg{width:21px;height:21px}
.nt-tab.on{color:var(--brand);font-weight:700}
.nt-tab-ic{position:relative;display:flex}
.nt-badge{
  position:absolute;top:-4px;right:-8px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--brand);color:#fff;font-size:10px;font-weight:700;
  display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface)
}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left">
      <a class="nt-back" href="navigation.html" onclick="return appBack(event)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回
      </a>
    </span>
    <h1>通知</h1>
    <span class="nav-right"></span>
  </header>

  <div class="body" id="scrollBody">

    <!-- 未读数量 -->
    <section class="card">
      <div class="card-body">
        <div class="nt-sum-row">
          <div class="nt-count">
            <span class="nt-num" id="unreadBig">0</span>
            <span class="nt-lbl">条未读告警</span>
          </div>
          <span class="nt-bell">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </span>
        </div>
        <button class="btn btn-ghost btn-sm btn-block mt-12" id="markAll" type="button">全部标记为已读</button>
      </div>
    </section>

    <!-- 筛选：全部 / 未读 / 已读 -->
    <div class="segmented nt-seg" id="filters">
      <button class="active" type="button" data-v="all">全部</button>
      <button type="button" data-v="unread">未读</button>
      <button type="button" data-v="read">已读</button>
    </div>

    <!-- 刷新降级入口 -->
    <button class="nt-refresh" id="refresh" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      下拉刷新 · 点击刷新
    </button>

    <!-- 列表 / 空状态 -->
    <div class="nt-list" id="list"></div>

    <!-- 滚动加载提示 -->
    <div class="nt-load" id="loader" style="display:none">加载更多…</div>

  </div>

  <!-- 底部 Tab 栏 -->
  <footer class="footer">
    <nav class="nt-tabs">
      <a class="nt-tab" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>首页</span>
      </a>
      <a class="nt-tab" href="app_workorder/tickets.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v10H4z"/><path d="M4 11h16M9 7v10"/></svg>
        <span>工单/任务</span>
      </a>
      <a class="nt-tab on" href="notifications.html">
        <span class="nt-tab-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="nt-badge" id="tabBadge">0</span>
        </span>
        <span>通知</span>
      </a>
      <a class="nt-tab" href="my.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>我的</span>
      </a>
    </nav>
  </footer>

</main>

<script>
var WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';

/* ---------- Mock 数据 ---------- */
var BASE = new Date(2026, 9, 30, 9, 32, 0).getTime();
function pad(n){ return (n < 10 ? '0' : '') + n; }
function fmt(d){
  return (d.getDate() === 30 ? pad(d.getHours()) + ':' + pad(d.getMinutes())
        : pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()));
}
var SITES = ['Downtown Store','Central Mall','Airport Branch','Riverside Kiosk','Tech Park'];
var TITLES = {
  P0:['支付通道中断','主控板离线','制冷系统故障'],
  P1:['原料库存不足','出货电机卡顿','温区波动'],
  P2:['设备心跳延迟','料道余量偏低','日结同步延迟']
};
var SUMS = {
  P0:'关键服务异常，请尽快处理。',
  P1:'指标偏离正常区间，需关注。',
  P2:'轻微异常，可稍后处理。'
};

var DATA = [
  { id:'n1', title:'制冷系统故障', machine:'VS-1028', site:'Downtown Store', level:'P0',
    time:'09:32', created:BASE, summary:'设备发生严重故障，当前影响整机销售。', read:false },
  { id:'n2', title:'原料库存不足', machine:'VS-1025', site:'Central Mall', level:'P1',
    time:'09:15', created:BASE - 17*60*1000, summary:'Vanilla powder 库存低于预警阈值。', read:false },
  { id:'n3', title:'设备通信异常', machine:'VS-1012', site:'Airport Branch', level:'P2',
    time:'昨天', created:BASE - 12*3600*1000, summary:'设备暂时无法正常上报数据。', read:true }
];
var LVLS = ['P2','P1','P0','P1','P2'];
for (var i = 0; i < 20; i++){
  var lvl = LVLS[i % LVLS.length];
  var t = new Date(BASE - (i + 1) * 37 * 60 * 1000);
  DATA.push({
    id:'g' + (i + 1),
    title: TITLES[lvl][i % 3],
    machine:'VS-' + pad(1000 + i),
    site: SITES[i % SITES.length],
    level: lvl,
    time: fmt(t),
    created: t.getTime(),
    summary: SUMS[lvl],
    read: i < 3 ? false : true
  });
}
DATA.sort(function(a, b){ return b.created - a.created; });

/* ---------- 状态 ---------- */
var PAGE_SIZE = 20;
var filter = 'all';
var page = 1;
var listEl = document.getElementById('list');
var loaderEl = document.getElementById('loader');
var bodyEl = document.getElementById('scrollBody');
var LVL_BADGE = { P0:'danger', P1:'warn', P2:'brand' };
var emptyCopy = {
  all:    ['暂无告警通知', '当前没有符合条件的告警消息'],
  unread: ['暂无未读通知', '当前没有未读告警消息'],
  read:   ['暂无已读通知', '当前没有已读告警消息']
};

function filtered(){
  if (filter === 'unread') return DATA.filter(function(d){ return !d.read; });
  if (filter === 'read')   return DATA.filter(function(d){ return  d.read; });
  return DATA;
}

function unreadCount(){ return DATA.filter(function(d){ return !d.read; }).length; }

function updateCounts(){
  var c = unreadCount();
  document.getElementById('unreadBig').textContent = c;
  var b = document.getElementById('tabBadge');
  b.textContent = c;
  b.style.display = c > 0 ? 'flex' : 'none';
}

function itemHTML(d){
  var lv = d.level.toLowerCase();
  return '<a class="item nt-item' + (d.read ? ' read' : '') + '" href="notification-detail.html?id=' + d.id + '">'
       +   '<span class="item-icon nt-ic ' + lv + '">' + WARN + '</span>'
       +   '<span class="item-body">'
       +     '<span class="item-name">' + d.title + '</span>'
       +     '<span class="item-sub">Machine ' + d.machine + (d.site ? ' · ' + d.site : '') + '</span>'
       +     '<span class="nt-sum">' + d.summary + '</span>'
       +     '<span class="item-meta">'
       +       '<span class="badge ' + LVL_BADGE[d.level] + '">' + d.level + '</span>'
       +       '<span class="nt-time">' + d.time + '</span>'
       +       '<span class="nt-view">查看详情 →</span>'
       +       (d.read ? '' : '<span class="dot nt-dot"></span>')
       +     '</span>'
       +   '</span>'
       + '</a>';
}

function render(reset){
  var f = filtered();
  if (f.length === 0){
    listEl.className = 'nt-list is-empty';
    listEl.innerHTML = '<div class="empty">'
      + '<div class="empty-icon gray">' + WARN + '</div>'
      + '<p>' + emptyCopy[filter][0] + '</p>'
      + '<span>' + emptyCopy[filter][1] + '</span></div>';
    loaderEl.style.display = 'none';
    return;
  }
  listEl.className = 'nt-list';
  var slice = f.slice(0, page * PAGE_SIZE);
  if (reset) listEl.innerHTML = slice.map(itemHTML).join('');
  else listEl.innerHTML += slice.slice((page - 1) * PAGE_SIZE).map(itemHTML).join('');
  loaderEl.style.display = (page * PAGE_SIZE < f.length) ? 'block' : 'none';
}

/* 标记全部已读 */
document.getElementById('markAll').addEventListener('click', function(){
  DATA.forEach(function(d){ d.read = true; });
  updateCounts();
  render(true);
});

/* 筛选切换：重置分页游标 */
document.getElementById('filters').addEventListener('click', function(e){
  var m = e.target.closest('button'); if (!m) return;
  this.querySelectorAll('button').forEach(function(x){ x.classList.remove('active'); });
  m.classList.add('active');
  filter = m.dataset.v;
  page = 1;
  render(true);
});

/* 滚动到底加载下一页 */
bodyEl.addEventListener('scroll', function(){
  if ((bodyEl.scrollTop + bodyEl.clientHeight) >= (bodyEl.scrollHeight - 120)){
    var f = filtered();
    if (page * PAGE_SIZE < f.length){
      page++;
      render(false);
    }
  }
});

/* 刷新（点击降级入口 + 移动端下拉手势） */
function refresh(){
  page = 1;
  render(true);
}
document.getElementById('refresh').addEventListener('click', refresh);
var startY = null, pulling = false;
bodyEl.addEventListener('touchstart', function(e){ if (bodyEl.scrollTop <= 0) startY = e.touches[0].clientY; }, { passive:true });
bodyEl.addEventListener('touchmove', function(e){
  if (startY !== null && bodyEl.scrollTop <= 0 && (e.touches[0].clientY - startY) > 60) pulling = true;
}, { passive:true });
bodyEl.addEventListener('touchend', function(){ if (pulling) refresh(); startY = null; pulling = false; });

/* 初始化 */
updateCounts();
render(true);
</script>
<script src="app-ui.js"></script>
</body>
</html>
