    text-align:left;font-size:14px;font-weight:600

<main class="app">

  <header class="navbar">
    <span class="nav-left"><button class="icon-btn" type="button" aria-label="返回常用" onclick="appHome(event,'common')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button></span>
    <h1><button class="mod-title" type="button" data-mod-toggle="#modMenu" aria-expanded="false"><span>经营分析</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button></h1>
    <span class="nav-right"></span>
    <nav class="mod-menu" id="modMenu" aria-label="模块切换">
      <a href="products.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg><span>商品</span></a>
      <a href="machines.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>设备</span></a>

      <a href="app_workorder/tickets.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.2H7.4A2.4 2.4 0 0 0 5 6.6v11.8A2.4 2.4 0 0 0 7.4 20.8h9.2a2.4 2.4 0 0 0 2.4-2.4V6.6a2.4 2.4 0 0 0-2.4-2.4H15"/><path d="M9 3h6a1 1 0 0 1 1 1v1.8a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="m8.8 13.4 2.2 2.2 4.2-4.2"/></svg><span>工单</span></a>
      <a href="analytics.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3.6v15.8a1 1 0 0 0 1 1h15.4"/><path d="M8.4 16.6v-4.2M13 16.6V8.4M17.6 16.6v-6.4"/></svg><span>经营分析</span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></a>

  </header>

  <div class="body">

    <section class="card">
      <div class="card-head"><h2 class="card-title">统计范围</h2></div>
      <div class="card-body">
        <div class="select-wrap">
          <button class="select st-select" type="button">全部授权点位
            <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <div class="segmented mt-12" id="chips">
          <button class="active" type="button">今日</button>
          <button type="button">近7天</button>
          <button type="button">近30天</button>
          <button type="button">自定义</button>
        </div>
      </div>
    </section>

    <section class="card" id="analysis">
      <div class="card-head"><h2 class="card-title">经营分析</h2></div>
      <div class="list">
        <a class="item" href="material.html">
          <span class="item-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="item-body">
            <span class="item-name">点位原料销量统计</span>
            <span class="item-sub">查看各点位原料消耗情况</span>
          </span>
          <svg class="item-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
        <a class="item" href="site-product.html">
          <span class="item-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </span>
          <span class="item-body">
            <span class="item-name">点位商品销售统计</span>
            <span class="item-sub">查看每个点位的商品销售明细</span>
          </span>
          <svg class="item-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
      </div>
    </section>

  </div>

</main>
<script>
  // 周期与排行切换（单选高亮）
  document.querySelectorAll('#chips, .chips').forEach(function(g){
    g.addEventListener('click', function(e){
      var c = e.target.closest('.chip, .segmented button'); if(!c) return;
      g.querySelectorAll('.chip, button').forEach(function(x){ x.classList.remove('active'); });
      c.classList.add('active');
    });
  });
</script>
<script src="app-ui.js"></script>
</body>
</html>
