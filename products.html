<!DOCTYPE html>
<html lang="zh-CN">
<head>

<link rel="stylesheet" href="app-ui.css">
<style>
  /* 搜索 + 工具按钮 */
  .pl-tools{display:flex;align-items:center;gap:8px}
  .pl-tools .search{flex:1;min-width:0}
  .pl-tool{
    width:46px;height:46px;flex:0 0 auto;border:1px solid var(--line);border-radius:var(--r-ctl);
    background:var(--surface);color:var(--text-2);
    display:flex;align-items:center;justify-content:center
  }
  .pl-tool:active{background:var(--surface-2)}

  /* 商品行：长名称换行不截断 */
  .pl-thumb{width:44px;height:44px}
  .pl-item .item-name{white-space:normal;line-height:20px}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

    <span class="nav-right"><button class="icon-btn" type="button" aria-label="更多"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button></span>
    <nav class="mod-menu" id="modMenu" aria-label="模块切换">
      <a href="products.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg><span>商品</span><svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></a>
      <a href="machines.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>设备</span></a>
      <a href="alerts.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 4a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg><span>告警</span></a>
      <a href="app_workorder/tickets.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.2H7.4A2.4 2.4 0 0 0 5 6.6v11.8A2.4 2.4 0 0 0 7.4 20.8h9.2a2.4 2.4 0 0 0 2.4-2.4V6.6a2.4 2.4 0 0 0-2.4-2.4H15"/><path d="M9 3h6a1 1 0 0 1 1 1v1.8a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="m8.8 13.4 2.2 2.2 4.2-4.2"/></svg><span>工单</span></a>
      <a href="analytics.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3.6v15.8a1 1 0 0 0 1 1h15.4"/><path d="M8.4 16.6v-4.2M13 16.6V8.4M17.6 16.6v-6.4"/></svg><span>经营分析</span></a>
    </nav>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab active" type="button" data-f="all">全部</button>
    <button class="tab" type="button" data-f="active">已上架</button>
    <button class="tab" type="button" data-f="draft">草稿</button>
    <button class="tab" type="button" data-f="archived">已归档</button>
  </div>

  <div class="body">

    <div class="pl-tools">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input id="kw" type="search" placeholder="搜索商品" aria-label="搜索商品">
      </div>
      <button class="pl-tool" type="button" aria-label="排序">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10M11 9h7M11 13h4"/><path d="m3 17 3 3 3-3"/><path d="M6 18V4"/></svg>
      </button>
      <button class="pl-tool" type="button" aria-label="筛选">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
      </button>
    </div>

    <section class="card mt-12">
      <div class="list" id="list">

        <a class="item pl-item" href="product-detail.html" data-s="draft">
          <span class="thumb pl-thumb"><img src="assets/p_pepsi_copy.png" alt=""></span>
          <span class="item-body">
            <span class="item-name">Pepsi Zero Sugar Soda Wild Cherry &amp; Cream 12 fl oz, 12 Count Cans (Copy)</span>
            <span class="item-sub">SKU-001-COPY</span>
          </span>
          <span class="badge">草稿</span>
        </a>

        <a class="item pl-item" href="#" data-s="active">
          <span class="thumb pl-thumb"><img src="assets/p_nico.png" alt=""></span>
          <span class="item-body">
            <span class="item-name">nico card test</span>
            <span class="item-sub">4 个规格</span>
          </span>
          <span class="badge ok">已上架</span>
        </a>

        <a class="item pl-item" href="#" data-s="active">
          <span class="thumb pl-thumb"><img src="assets/p_pepsi.png" alt=""></span>
          <span class="item-body">
            <span class="item-name">Pepsi Zero Sugar Soda Wild Cherry &amp; Cream 12 fl oz, 12 Count Cans</span>
            <span class="item-sub">SKU-001</span>
          </span>
          <span class="badge ok">已上架</span>
        </a>

        <a class="item pl-item" href="#" data-s="active">
          <span class="thumb pl-thumb"><i>T</i></span>
          <span class="item-body">
            <span class="item-name">tshirt</span>
            <span class="item-sub">SKU-TSHIRT</span>
          </span>
          <span class="badge ok">已上架</span>
        </a>

      </div>
    </section>

  </div>

</main>
<script>
  var curTab = 'all', kw = document.getElementById('kw');

  function applyFilter(){
    var q = (kw.value || '').trim().toLowerCase();
    document.querySelectorAll('#list .item').forEach(function(r){
      var okTab = (curTab === 'all' || r.dataset.s === curTab);
      var okKw = !q || r.textContent.toLowerCase().indexOf(q) >= 0;
      r.style.display = (okTab && okKw) ? '' : 'none';
    });
  }

  document.getElementById('tabs').addEventListener('click', function(e){
    var tab = e.target.closest('.tab'); if(!tab) return;
    this.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
    tab.classList.add('active');
    curTab = tab.dataset.f;
    applyFilter();
  });
  kw.addEventListener('input', applyFilter);
</script>
<script src="app-ui.js"></script>
</body>
</html>
