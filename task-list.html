<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>任务 · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
/* 任务列表 · 页面前缀 tl-（只写布局，组件一律用 app-ui.css） */
.tl-body{padding:12px 16px 18px}
.tl-sec{display:flex;align-items:baseline;justify-content:space-between;padding:14px 2px 7px;font-size:12px;line-height:17px;font-weight:700;letter-spacing:.4px;color:var(--text-2)}
.tl-sec:first-child{padding-top:2px}
.tl-sec span{font-weight:600;letter-spacing:0;color:var(--text-3)}
.tl-time{color:var(--text-3);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left"><button class="icon-btn" type="button" aria-label="返回上一页" onclick="return taskBack(event)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button></span>
    <h1>任务</h1>
    <span class="nav-right"></span>
  </header>

  <div class="tabs" id="tlTabs" role="tablist">
    <button class="tab active" type="button" role="tab" data-v="ALL">全部<span class="count" id="cAll">0</span></button>
    <button class="tab" type="button" role="tab" data-v="REPLENISHMENT">补货<span class="count" id="cRep">0</span></button>
    <button class="tab" type="button" role="tab" data-v="MAINTENANCE">维修<span class="count" id="cMt">0</span></button>
  </div>

  <div class="body tl-body" id="tlBody"></div>

</main>
<script src="app-ui.js"></script>
<script>
(function(){
  var TASKS=[
    {uid:'t1',id:'RT20261125001',deviceType:'GRAB_GO',type:'REPLENISHMENT',status:'PENDING',device:'万事达测试机5.1_004',site:'万事达测试点位',summary:'补货 0 个 SKU / 0 件',time:'10:20',day:'今天',done:false},
    {uid:'t2',id:'RT20261125002',deviceType:'GRAB_GO',type:'REPLENISHMENT',status:'COMPLETED',device:'京品矩视开门柜设备',site:'京品矩视点位',summary:'补货 0 个 SKU / 0 件',time:'17:32',day:'今天',done:true},
    {uid:'t3',id:'RT20261125001',deviceType:'GRAB_GO',type:'REPLENISHMENT',status:'COMPLETED',device:'京品矩视开门柜设备',site:'京品矩视点位',summary:'补货 0 个 SKU / 0 件',time:'17:25',day:'今天',done:true},
    {uid:'t4',id:'RT20261124102',deviceType:'GRAB_GO',type:'REPLENISHMENT',status:'COMPLETED',device:'京品矩视开门柜设备',site:'京品矩视点位',summary:'补货 0 个 SKU / 0 件',time:'16:48',day:'昨天',done:true}
  ];
  var TYPE={REPLENISHMENT:'补货',MAINTENANCE:'维修'};
  var filter='ALL';

  /* 返回：在壳内回到进入任务前所在的 tab（首页 / 常用），单独打开时回首页 */
  window.taskBack=function(event){
    if(event&&event.preventDefault)event.preventDefault();
    try{
      if(window.self!==window.top){parent.postMessage({type:'app:taskback'},'*');return false}
    }catch(e){}
    location.href='navigation.html#home';
    return false;
  };

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}

  function itemHtml(t){
    var href='task-detail.html?uid='+encodeURIComponent(t.uid)+'&id='+encodeURIComponent(t.id)+'&deviceType='+encodeURIComponent(t.deviceType);
    var stateBadge=t.done
      ? '<span class="badge ok"><span class="dot ok"></span>已完成</span>'
      : '<span class="badge brand"><span class="dot warn"></span>待处理</span>';
    return '<a class="item no-thumb" href="'+href+'">'
      +  '<span class="item-body">'
      +    '<span class="item-name">'+esc(t.device)+'</span>'
      +    '<span class="item-sub">'+esc(t.id)+' · '+esc(t.site)+'</span>'
      +    '<span class="item-meta"><span class="badge">'+TYPE[t.type]+'</span><span>'+esc(t.summary.replace(/^补货\s*/,''))+'</span><span class="tl-time">· '+esc(t.time)+'</span></span>'
      +  '</span>'
      +  stateBadge
      + '</a>';
  }

  function render(){
    document.getElementById('cAll').textContent=TASKS.length;
    document.getElementById('cRep').textContent=TASKS.filter(function(t){return t.type==='REPLENISHMENT'}).length;
    document.getElementById('cMt').textContent=TASKS.filter(function(t){return t.type==='MAINTENANCE'}).length;

    var list=TASKS.filter(function(t){return filter==='ALL'||t.type===filter});
    var body=document.getElementById('tlBody');
    if(!list.length){
      body.innerHTML='<div class="card"><div class="empty">'
        + '<div class="empty-icon gray"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11h6M9 15h4"/><rect x="5" y="3.5" width="14" height="17" rx="2.5"/></svg></div>'
        + '<p>该分类下暂无任务</p><span>切换「全部」查看已派发的补货任务</span></div></div>';
      return;
    }
    var groups={};
    list.forEach(function(t){(groups[t.day]=groups[t.day]||[]).push(t)});
    body.innerHTML=Object.keys(groups).map(function(day){
      var rows=groups[day];
      return '<div class="tl-sec">'+day+'<span>'+rows.length+' 条记录</span></div>'
        + '<div class="card"><div class="list">'+rows.map(itemHtml).join('')+'</div></div>';
    }).join('');
  }

  document.getElementById('tlTabs').addEventListener('click',function(event){
    var btn=event.target.closest('[data-v]');
    if(!btn)return;
    filter=btn.dataset.v;
    Array.prototype.forEach.call(this.querySelectorAll('[data-v]'),function(b){
      b.classList.toggle('active',b===btn);
      b.setAttribute('aria-selected',b===btn?'true':'false');
    });
    render();
  });

  render();
})();
</script>
</body>
</html>
