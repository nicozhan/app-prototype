<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>设备 · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
/* 设备列表 · 页面前缀 ms- */
.ms-top{position:relative;flex:0 0 auto}
.ms-title{display:inline-flex;align-items:center;justify-content:center;gap:3px;max-width:100%}
.ms-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-title svg{width:14px;height:14px;color:var(--text-3)}

.ms-menu{
  position:absolute;left:12px;right:12px;top:52px;z-index:40;padding:6px;display:none;
  border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);
  box-shadow:0 16px 36px rgba(11,16,47,.16)
}
.ms-menu.open{display:block}
.ms-menu a{
  min-height:48px;padding:0 10px;display:flex;align-items:center;gap:10px;
  border-radius:var(--r-sm);font-size:14px;font-weight:600;color:var(--ink)
}
.ms-menu a:active{background:var(--surface-2)}
.ms-menu a svg:first-child{width:19px;height:19px;color:var(--text-2)}
.ms-menu a.active{background:var(--brand-weak);color:var(--brand)}
.ms-menu a.active svg:first-child{color:var(--brand)}
.ms-menu .tick{margin-left:auto;width:16px;height:16px;color:var(--brand)}

.ms-searchrow{display:flex;align-items:center;gap:8px}
.ms-searchrow .search{flex:1;min-width:0;height:44px}
.ms-ph{font-size:14px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-tool{
  width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--text-2)
}
.ms-tool:active{background:var(--surface-2)}
.ms-tool svg{width:19px;height:19px}

.ms-filterrow{margin-top:10px;display:flex;align-items:center;gap:8px}
.ms-seg{flex:1;min-width:0}
.ms-mini{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--text-2);padding:0 2px}

.ms-list{margin-top:10px}
.ms-tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.ms-loc{display:flex;align-items:center;gap:4px}
.ms-loc svg{width:12px;height:12px;color:var(--text-3)}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <div class="ms-top">
    <header class="navbar">
      <span class="nav-left">
        <button class="icon-btn" type="button" aria-label="新增">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </span>
      <h1>
        <button class="ms-title" id="navToggle" type="button" aria-expanded="false">
          <span>设备</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </h1>
      <span class="nav-right">
        <button class="icon-btn" type="button" aria-label="更多">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </span>
    </header>

    <nav class="ms-menu" id="navMenu">
      <a href="products.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>商品</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>订单</a>
      <a href="machines.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>设备
        <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></a>
      <a href="stats.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>经营统计</a>
    </nav>
  </div>

  <div class="body">

    <div class="ms-searchrow">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <span class="ms-ph">搜索设备</span>
      </div>
      <button class="ms-tool" type="button" aria-label="排序">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10M11 9h7M11 13h4"/><path d="m3 17 3 3 3-3"/><path d="M6 18V4"/></svg>
      </button>
      <button class="ms-tool" type="button" aria-label="筛选">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
      </button>
    </div>

    <div class="ms-filterrow">
      <div class="segmented ms-seg" id="tabs">
        <button class="active" type="button" data-f="all">全部</button>
        <button type="button" data-f="active">已激活</button>
        <button type="button" data-f="inactive">未激活</button>
      </div>
      <span class="ms-mini">筛选</span>
    </div>

    <section class="card ms-list">
      <div class="list" id="mlist">

        <a class="item" href="#" data-s="active">
          <span class="item-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
          <span class="item-body">
            <span class="item-name">万事达WSD923xxw</span>
            <span class="item-sub">现调机 · Fuji F300</span>
            <span class="item-meta"><span class="ms-loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>悉尼机场 T1-A01</span></span>
            <span class="ms-tags"><span class="badge danger">缺货 1</span><span class="badge warn">低库存 1</span></span>
          </span>
          <span class="badge ok">已激活</span>
        </a>

        <a class="item" href="#" data-s="active">
          <span class="item-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
          <span class="item-body">
            <span class="item-name">泰信-矩视开门柜1</span>
            <span class="item-sub">开门柜 · TX-G200</span>
            <span class="item-meta"><span class="ms-loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>曼谷机场 B12</span></span>
            <span class="ms-tags"><span class="badge danger">缺货 1</span></span>
          </span>
          <span class="badge ok">已激活</span>
        </a>

        <a class="item" href="#" data-s="inactive">
          <span class="item-icon gray"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
          <span class="item-body">
            <span class="item-name">北京首都 T3 综合柜</span>
            <span class="item-sub">综合柜 · Crane 678</span>
            <span class="item-meta"><span class="ms-loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>北京首都 T3-D22</span></span>
          </span>
          <span class="badge">未激活</span>
        </a>

      </div>
    </section>

  </div>

</main>

<script>
(function(){
  var t = document.getElementById('navToggle'), m = document.getElementById('navMenu');
  function closeMenu(){ m.classList.remove('open'); t.setAttribute('aria-expanded','false'); }
  t.addEventListener('click', function(e){
    e.stopPropagation();
    var open = m.classList.toggle('open');
    t.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', closeMenu);
  m.addEventListener('click', function(e){ e.stopPropagation(); });
  window.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeMenu(); });

  document.getElementById('tabs').addEventListener('click', function(e){
    var tab = e.target.closest('button[data-f]'); if(!tab) return;
    Array.prototype.forEach.call(this.querySelectorAll('button[data-f]'), function(x){ x.classList.remove('active'); });
    tab.classList.add('active');
    var f = tab.dataset.f;
    Array.prototype.forEach.call(document.querySelectorAll('#mlist .item'), function(r){
      r.style.display = (f === 'all' || r.dataset.s === f) ? '' : 'none';
    });
  });
})();
</script>
<script src="app-ui.js"></script>
</body>
</html>
