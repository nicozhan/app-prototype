      <a href="machines.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>设备
        <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></a>

    </div>
  </div>

  <div class="searchrow">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>搜索设备</div>
    <button class="toolbtn" aria-label="排序"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10M11 9h7M11 13h4"/><path d="m3 17 3 3 3-3"/><path d="M6 18V4"/></svg></button>
    <button class="toolbtn" aria-label="筛选"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg></button>
  </div>

  <div class="tabs" id="tabs">
    <span class="tab on" data-f="all">全部</span>
    <span class="tab" data-f="active">已激活</span>
    <span class="tab" data-f="inactive">未激活</span>
    <span class="spacer"></span>
    <span class="mini">筛选</span>
  </div>

  <div class="list" id="list">
    <a class="row" href="#" data-s="active">
      <span class="thumbicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
      <div class="body">
        <div class="name">万事达WSD923xxw</div>
        <div class="sub">现调机 · Fuji F300</div>
        <div class="meta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          悉尼机场 T1-A01
          <span class="badge b-red">缺货 1</span>
          <span class="badge b-orange">低库存 1</span>
        </div>
      </div>
      <span class="badge b-green status">已激活</span>
    </a>
    <a class="row" href="#" data-s="active">
      <span class="thumbicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
      <div class="body">
        <div class="name">泰信-矩视开门柜1</div>
        <div class="sub">开门柜 · TX-G200</div>
        <div class="meta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          曼谷机场 B12
          <span class="badge b-red">缺货 1</span>
        </div>
      </div>
      <span class="badge b-green status">已激活</span>
    </a>
    <a class="row" href="#" data-s="inactive">
      <span class="thumbicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
      <div class="body">
        <div class="name">北京首都 T3 综合柜</div>
        <div class="sub">综合柜 · Crane 678</div>
        <div class="meta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          北京首都 T3-D22
        </div>
      </div>
      <span class="badge b-gray status">未激活</span>
    </a>
  </div>
</div>
<script>
  var t = document.getElementById('navToggle'), m = document.getElementById('navMenu');
  t.addEventListener('click', function(e){ e.stopPropagation(); m.classList.toggle('open'); });
  document.addEventListener('click', function(){ m.classList.remove('open'); });
  document.getElementById('tabs').addEventListener('click', function(e){
    var tab = e.target.closest('.tab'); if(!tab) return;
    this.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); });
    tab.classList.add('on');
    var f = tab.dataset.f;
    document.querySelectorAll('#list .row').forEach(function(r){
      r.style.display = (f==='all' || r.dataset.s===f) ? '' : 'none';
    });
  });
</script>
</body>
</html>
