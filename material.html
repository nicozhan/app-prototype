<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>点位原料统计 · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
  .ml-filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .ml-flt{
    display:block;text-align:left;padding:8px 10px;border:1px solid var(--line);
    border-radius:var(--r-ctl);background:var(--surface)
  }
  .ml-flt:active{background:var(--surface-2)}
  .ml-flb{display:block;font-size:10px;line-height:14px;font-weight:600;color:var(--text-3)}
  .ml-flv{
    margin-top:1px;display:flex;align-items:center;justify-content:space-between;gap:2px;
    font-size:13px;line-height:19px;font-weight:600;white-space:nowrap
  }
  .ml-flv svg{color:var(--text-3);flex:0 0 auto}

  /* 概览 KPI */
  .ml-kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 14px}
  .ml-kpi{padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
  .ml-kpi .k{font-size:11px;line-height:15px;font-weight:600;color:var(--text-2)}
  .ml-kpi .v{
    margin-top:1px;font-size:19px;line-height:25px;font-weight:800;letter-spacing:-.4px;
    font-variant-numeric:tabular-nums
  }
  .ml-kpi .v small{margin-left:2px;font-size:11px;font-weight:600;letter-spacing:0;color:var(--text-2)}

  /* 明细表 */
  .ml-tbl{padding:0 14px 8px}
  .ml-th,.ml-tr{display:grid;grid-template-columns:minmax(0,1fr) 64px 56px;gap:8px;align-items:center}
  .ml-th{
    padding:2px 0 7px;border-bottom:1px solid var(--line);
    font-size:11px;line-height:16px;font-weight:600;color:var(--text-3)
  }
  .ml-th span:nth-child(2),.ml-th span:nth-child(3){text-align:right}
  .ml-tr{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:19px;font-weight:600}
  .ml-tr:last-child{border-bottom:0}
  .ml-tr span:nth-child(2){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .ml-tr span:nth-child(3){text-align:right;font-weight:400;color:var(--text-2)}

  /* 趋势柱状 */
  .ml-count{font-size:11px;line-height:16px;color:var(--text-2);white-space:nowrap}
  .ml-mini{height:30px;padding:0 9px;font-size:12px;border-radius:10px;gap:3px}
  .ml-chart{padding:18px 14px 12px}
  .ml-plot{
    display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end;
    height:84px;border-bottom:1px solid var(--line)
  }
  .ml-col{display:flex;justify-content:center;align-items:flex-end;height:100%}
  .ml-bar{width:100%;max-width:22px;border-radius:6px 6px 0 0;background:var(--brand)}
  .ml-days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:7px}
  .ml-day{
    text-align:center;font-size:10px;line-height:14px;color:var(--text-3);font-weight:600;
    font-variant-numeric:tabular-nums;white-space:nowrap
  }
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <div class="nav-left">
      <a class="icon-btn" href="stats.html" aria-label="返回" onclick="return appBack(event)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
    </div>
    <h1>点位原料统计</h1>
    <span></span>
  </header>

  <div class="body">

    <div class="ml-filters">
      <button class="ml-flt" type="button">
        <span class="ml-flb">时间</span>
        <span class="ml-flv">近7天
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </button>
      <button class="ml-flt" type="button">
        <span class="ml-flb">点位</span>
        <span class="ml-flv">选择点位
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </button>
      <button class="ml-flt" type="button">
        <span class="ml-flb">原料</span>
        <span class="ml-flv">全部原料
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </button>
    </div>

    <section class="card mt-12">
      <div class="card-head bordered">
        <h2 class="card-title">原料消耗概览</h2>
        <span class="ml-count">近7天</span>
      </div>
      <div class="ml-kpis">
        <div class="ml-kpi"><div class="k">咖啡豆</div><div class="v">18.6<small>kg</small></div></div>
        <div class="ml-kpi"><div class="k">牛奶</div><div class="v">32.4<small>L</small></div></div>
        <div class="ml-kpi"><div class="k">糖浆</div><div class="v">4.8<small>L</small></div></div>
      </div>
    </section>

    <section class="card mt-12">
      <div class="card-head bordered">
        <h2 class="card-title">原料消耗明细</h2>
        <span class="ml-count">共 4 种原料</span>
      </div>
      <div class="ml-tbl">
        <div class="ml-th"><span>原料名称</span><span>消耗量</span><span>计量单位</span></div>
        <div class="ml-tr"><span>咖啡豆</span><span>18.6</span><span>kg</span></div>
        <div class="ml-tr"><span>牛奶</span><span>32.4</span><span>L</span></div>
        <div class="ml-tr"><span>糖浆</span><span>4.8</span><span>L</span></div>
        <div class="ml-tr"><span>巧克力酱</span><span>2.3</span><span>kg</span></div>
      </div>
    </section>

    <section class="card mt-12">
      <div class="card-head bordered">
        <h2 class="card-title">消耗趋势</h2>
        <button class="filter-select ml-mini" type="button">按日
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>

      <div class="ml-chart" aria-label="消耗趋势图">
        <div class="ml-plot">
          <div class="ml-col"><span class="ml-bar" style="height:19px"></span></div>
          <div class="ml-col"><span class="ml-bar" style="height:46px"></span></div>
          <div class="ml-col"><span class="ml-bar" style="height:25px"></span></div>
          <div class="ml-col"><span class="ml-bar" style="height:73px"></span></div>
          <div class="ml-col"><span class="ml-bar" style="height:59px"></span></div>
          <div class="ml-col"><span class="ml-bar" style="height:84px"></span></div>
          <div class="ml-col"><span class="ml-bar" style="height:65px"></span></div>
        </div>
        <div class="ml-days">
          <span class="ml-day">10-12</span>
          <span class="ml-day">10-13</span>
          <span class="ml-day">10-14</span>
          <span class="ml-day">10-15</span>
          <span class="ml-day">10-16</span>
          <span class="ml-day">10-17</span>
          <span class="ml-day">10-18</span>
        </div>
      </div>

    </section>

  </div>

  <footer class="footer">
    <a class="btn btn-ghost btn-block" href="#">查看商品配方消耗明细 →</a>
  </footer>

</main>
<script src="app-ui.js"></script>
</body>
</html>
