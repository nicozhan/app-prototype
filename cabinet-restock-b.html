<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>补货方案 B · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
.rsb-device{padding:4px 2px 0}
.rsb-device-name{font-size:21px;line-height:28px;font-weight:800;letter-spacing:-.5px}
.rsb-device-id{margin-top:2px;font-size:12px;line-height:17px;color:var(--text-2);font-variant-numeric:tabular-nums}
.rsb-summary{display:flex;align-items:flex-end;margin-top:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.rsb-metric{flex:1;display:flex;align-items:baseline;gap:7px;min-width:0}
.rsb-metric+.rsb-metric{padding-left:18px;border-left:1px solid var(--line)}
.rsb-metric strong{font-size:29px;line-height:34px;font-weight:800;letter-spacing:-.9px;font-variant-numeric:tabular-nums}
.rsb-metric span{font-size:12px;line-height:17px;color:var(--text-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsb-controls{display:flex;gap:8px;margin:12px 0 4px}
.rsb-controls .segmented{flex:1;min-width:0}
.rsb-group{margin-top:2px}
.rsb-add{width:30px;height:30px;border-radius:50%;background:var(--brand-weak);color:var(--brand);display:flex;align-items:center;justify-content:center;justify-self:end}
.rsb-results{margin-top:8px}
.rsb-product{display:flex;align-items:center;gap:12px;padding:2px 0 12px}
.rsb-product-name{font-size:15px;line-height:21px;font-weight:600}
.rsb-product-meta{margin-top:2px;font-size:12px;line-height:17px;color:var(--text-2)}
.rsb-label{margin:2px 0 8px;font-size:13px;line-height:18px;font-weight:600}
.rsb-stepper{height:52px;display:grid;grid-template-columns:52px 1fr 52px;overflow:hidden;border:1px solid var(--brand-line);border-radius:var(--r-ctl);background:var(--brand-weak)}
.rsb-stepper button{display:flex;align-items:center;justify-content:center;color:var(--brand)}
.rsb-stepper button:active{background:var(--brand-line)}
.rsb-stepper input{width:100%;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--surface);text-align:center;font-size:21px;font-weight:800;color:var(--ink);outline:0;font-variant-numeric:tabular-nums}
.rsb-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.rsb-confirm{display:none;margin-bottom:12px;padding:11px 12px;border-radius:var(--r-ctl);background:var(--danger-bg)}
.rsb-confirm.show{display:block}
.rsb-confirm p{font-size:11px;line-height:17px;color:var(--danger)}
.rsb-confirm-actions{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<main class="app" id="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left"><button class="icon-btn" aria-label="返回" onclick="appBack(event)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button></span>
    <h1>补货</h1>
    <span class="nav-right"><button class="icon-btn accent" id="addBtn" aria-label="添加商品"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></span>
  </header>

  <div class="body">

    <section class="rsb-device">
      <div class="rsb-device-name">曼谷机场 T1-A01</div>
      <div class="rsb-device-id">VM-1001</div>
    </section>

    <section class="rsb-summary" aria-label="补货统计">
      <div class="rsb-metric"><strong id="skuCount">6</strong><span>待补商品</span></div>
      <div class="rsb-metric"><strong id="unitCount">42</strong><span>预计补货 / 件</span></div>
    </section>

    <div class="rsb-controls">
      <div class="segmented" id="segments">
        <button class="active" data-status="need">待补 <span id="needCount">6</span></button>
        <button data-status="all">全部 <span id="allCount">8</span></button>
      </div>
      <button class="filter-select" id="layerBtn"><span id="layerLabel">全部层</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg></button>
    </div>

    <div id="list"></div>

  </div>

  <footer class="footer">
    <button class="btn btn-primary btn-block" id="completeBtn">完成补货<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </footer>

  <!-- 补货数量 -->
  <div class="overlay" id="editOverlay" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <section class="sheet">
      <div class="handle"></div>
      <div class="sheet-head"><h2 id="editTitle">补货数量</h2><button class="close" data-close="editOverlay" aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="rsb-product">
        <span class="thumb lg"><i id="editInitial"></i><img id="editImage" alt="" onerror="this.style.display='none'"></span>
        <div>
          <div class="rsb-product-name" id="editName"></div>
          <div class="rsb-product-meta" id="editSlot"></div>
        </div>
      </div>
      <div class="rows">
        <div class="row"><span class="row-k">当前库存</span><span class="row-v" id="editStock"></span></div>
      </div>
      <div class="rsb-label mt-12">本次补货</div>
      <div class="rsb-stepper">
        <button id="minus" aria-label="减少"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <input id="qtyInput" type="text" inputmode="numeric" value="0" aria-label="本次补货数量">
        <button id="plus" aria-label="增加"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="rsb-quick">
        <button class="btn btn-secondary btn-sm" id="fillBtn">补满</button>
        <button class="btn btn-danger-weak btn-sm" id="removeBtn">下架</button>
      </div>
      <div class="rsb-confirm" id="removeConfirm">
        <p>下架后该商品从当前货道移除，补货列表不再显示，库存记录一并清除。</p>
        <div class="rsb-confirm-actions"><button class="btn btn-ghost btn-xs" id="cancelRemove">取消</button><button class="btn btn-danger btn-xs" id="confirmRemove">确认下架</button></div>
      </div>
      <button class="btn btn-primary btn-block" id="confirmBtn" disabled>确认</button>
    </section>
  </div>

  <!-- 添加商品 -->
  <div class="overlay" id="addOverlay" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <section class="sheet">
      <div class="handle"></div>
      <div class="sheet-head"><h2 id="addTitle">添加商品</h2><button class="close" data-close="addOverlay" aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="searchInput" placeholder="商品名称或 69 码" autocomplete="off" aria-label="搜索商品">
        <button class="scan" id="scanBtn" aria-label="扫码"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M7 12h10"/></svg></button>
      </div>
      <div class="rsb-results" id="searchResults"></div>
    </section>
  </div>

  <!-- 选择层 -->
  <div class="overlay" id="layerOverlay" role="dialog" aria-modal="true" aria-labelledby="layerTitle">
    <section class="sheet">
      <div class="handle"></div>
      <div class="sheet-head"><h2 id="layerTitle">选择层</h2><button class="close" data-close="layerOverlay" aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="radios" id="layerOptions"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<script>
(function(){
  const imagePath='jpgk-platform/mobile/src/static/replenishment/';
  const items=[
    {id:1,name:'可口可乐 330ml',layer:1,slot:'A1',base:2,cur:2,max:10,img:imagePath+'product-1.png'},
    {id:2,name:'雪碧 330ml',layer:1,slot:'A2',base:4,cur:4,max:10,img:imagePath+'product-2.png'},
    {id:3,name:'红牛 250ml',layer:2,slot:'B1',base:0,cur:0,max:8,img:imagePath+'product-3.png'},
    {id:4,name:'矿泉水 550ml',layer:2,slot:'C2',base:6,cur:6,max:15,img:imagePath+'product-4.png'},
    {id:5,name:'乐事薯片 原味',layer:3,slot:'A1',base:5,cur:5,max:12,img:imagePath+'product-5.png'},
    {id:6,name:'巧克力 50g',layer:3,slot:'B2',base:6,cur:6,max:10,img:imagePath+'product-6.png'},
    {id:7,name:'益达口香糖 薄荷',layer:4,slot:'A1',base:10,cur:10,max:10,img:imagePath+'product-2.png'},
    {id:8,name:'能量棒',layer:4,slot:'B2',base:8,cur:8,max:8,img:imagePath+'product-5.png'}
  ];
  const extras=[
    {id:101,name:'可口可乐 无糖 330ml',code:'6901234500017',layer:4,slot:'C1',base:0,cur:0,max:10,img:imagePath+'product-1.png'},
    {id:102,name:'乌龙茶 500ml',code:'6901234500024',layer:4,slot:'C2',base:0,cur:0,max:12,img:imagePath+'product-4.png'}
  ];
  const CHECK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>';
  let statusFilter='need',layerFilter=0,selected=null,qty=0,toastTimer;
  const list=document.getElementById('list');
  const remaining=item=>Math.max(0,item.max-item.cur);
  const initial=item=>{const s=item.name.replace(/[^0-9A-Za-z\u4e00-\u9fa5]/g,'');return s.charAt(0)||'·'};

  function updateStats(){
    const needed=items.filter(item=>remaining(item)>0);
    document.getElementById('skuCount').textContent=needed.length;
    document.getElementById('unitCount').textContent=needed.reduce((sum,item)=>sum+remaining(item),0);
    document.getElementById('needCount').textContent=needed.length;
    document.getElementById('allCount').textContent=items.length;
  }
  function row(item){
    const left=remaining(item);
    return '<button class="item" data-id="'+item.id+'" aria-label="编辑 '+item.name+' 补货数量">'
      +'<span class="thumb"><i>'+initial(item)+'</i><img src="'+item.img+'" alt="" onerror="this.style.display=\'none\'"></span>'
      +'<span class="item-body"><span class="item-name">'+item.name+'</span>'
      +'<span class="item-meta"><span class="k">'+item.layer+'层 '+item.slot+'</span><span>·</span><span>'+item.cur+'/'+item.max+'</span>'
      +(item.cur===0?'<span class="badge danger">缺货</span>':'')+'</span></span>'
      +(left>0?'<span class="qty">+'+left+'</span>':'<span class="qty done">'+CHECK+'</span>')
      +'</button>';
  }
  function render(){
    updateStats();
    const visible=items.filter(item=>(!layerFilter||item.layer===layerFilter)&&(statusFilter==='all'||remaining(item)>0));
    if(!visible.length){
      list.innerHTML='<div class="empty"><div class="empty-icon">'+CHECK+'</div><p>已补齐</p></div>';
      return;
    }
    if(statusFilter==='all'&&!layerFilter){
      list.innerHTML=[1,2,3,4].map(layer=>{
        const group=visible.filter(item=>item.layer===layer);
        return group.length?'<section class="rsb-group"><div class="sec-title">'+layer+' 层</div>'+group.map(row).join('')+'</section>':'';
      }).join('');
      return;
    }
    list.innerHTML=visible.map(row).join('');
  }
  function renderLayers(){
    const labels=['全部层','1 层','2 层','3 层','4 层'];
    document.getElementById('layerOptions').innerHTML=labels.map((label,index)=>{
      return '<button class="radio '+(layerFilter===index?'active':'')+'" data-layer="'+index+'"><span class="mark"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></span><span>'+label+'</span></button>';
    }).join('');
  }
  function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
  function openOverlay(id){document.getElementById(id).classList.add('open')}
  function closeOverlay(id){document.getElementById(id).classList.remove('open')}

  function setQty(value){
    const cap=selected?remaining(selected):0;
    qty=Math.max(0,Math.min(cap,Math.floor(Number(value)||0)));
    document.getElementById('qtyInput').value=String(qty);
    document.getElementById('confirmBtn').disabled=qty===0;
  }
  function openEdit(id){
    selected=items.find(item=>item.id===id);if(!selected)return;
    document.getElementById('editName').textContent=selected.name;
    document.getElementById('editSlot').textContent=selected.layer+'层 · '+selected.slot;
    document.getElementById('editStock').textContent=selected.cur+' / '+selected.max;
    document.getElementById('editInitial').textContent=initial(selected);
    const img=document.getElementById('editImage');img.style.display='';img.src=selected.img;
    document.getElementById('removeConfirm').classList.remove('show');
    setQty(0);
    openOverlay('editOverlay');
  }
  function apply(action){
    if(!selected)return;
    if(action==='remove')selected.cur=selected.base;
    else if(action==='fill')selected.cur=selected.max;
    else selected.cur=Math.min(selected.max,selected.cur+qty);
    closeOverlay('editOverlay');render();
    toast(action==='remove'?'已下架':action==='fill'?'已补满':'已确认补货');
  }
  function renderSearch(){
    const query=document.getElementById('searchInput').value.trim().toLowerCase();
    const found=extras.filter(item=>!items.some(x=>x.id===item.id)&&(!query||item.name.toLowerCase().includes(query)||item.code.includes(query)));
    document.getElementById('searchResults').innerHTML=found.length
      ? found.map(item=>'<button class="item" data-add="'+item.id+'">'
          +'<span class="thumb"><i>'+initial(item)+'</i><img src="'+item.img+'" alt="" onerror="this.style.display=\'none\'"></span>'
          +'<span class="item-body"><span class="item-name">'+item.name+'</span><span class="item-sub">'+item.code+'</span></span>'
          +'<span class="rsb-add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>').join('')
      : '<div class="empty"><div class="empty-icon gray"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></div><p>未找到商品</p></div>';
  }

  list.addEventListener('click',event=>{const target=event.target.closest('[data-id]');if(target)openEdit(Number(target.dataset.id))});
  document.getElementById('segments').addEventListener('click',event=>{
    const button=event.target.closest('[data-status]');if(!button)return;
    statusFilter=button.dataset.status;
    document.querySelectorAll('[data-status]').forEach(el=>el.classList.toggle('active',el===button));
    render();
  });
  document.getElementById('layerBtn').addEventListener('click',()=>{renderLayers();openOverlay('layerOverlay')});
  document.getElementById('layerOptions').addEventListener('click',event=>{
    const button=event.target.closest('[data-layer]');if(!button)return;
    layerFilter=Number(button.dataset.layer);
    document.getElementById('layerLabel').textContent=layerFilter?layerFilter+' 层':'全部层';
    closeOverlay('layerOverlay');render();
  });
  document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>closeOverlay(button.dataset.close)));
  document.querySelectorAll('.overlay').forEach(overlay=>overlay.addEventListener('click',event=>{if(event.target===overlay)closeOverlay(overlay.id)}));

  document.getElementById('minus').addEventListener('click',()=>setQty(qty-1));
  document.getElementById('plus').addEventListener('click',()=>setQty(qty+1));
  document.getElementById('qtyInput').addEventListener('input',event=>setQty(event.target.value.replace(/\D/g,'')));
  document.getElementById('fillBtn').addEventListener('click',()=>{
    if(!selected)return;
    setQty(remaining(selected));
    toast('已填入补货量 '+remaining(selected));
  });
  document.getElementById('removeBtn').addEventListener('click',()=>document.getElementById('removeConfirm').classList.add('show'));
  document.getElementById('cancelRemove').addEventListener('click',()=>document.getElementById('removeConfirm').classList.remove('show'));
  document.getElementById('confirmRemove').addEventListener('click',()=>apply('remove'));
  document.getElementById('confirmBtn').addEventListener('click',()=>{if(qty>0)apply('confirm')});

  document.getElementById('addBtn').addEventListener('click',()=>{renderSearch();openOverlay('addOverlay')});
  document.getElementById('searchInput').addEventListener('input',renderSearch);
  document.getElementById('searchResults').addEventListener('click',event=>{
    const button=event.target.closest('[data-add]');if(!button)return;
    const item=extras.find(x=>x.id===Number(button.dataset.add));
    items.push(item);statusFilter='all';
    document.querySelectorAll('[data-status]').forEach(el=>el.classList.toggle('active',el.dataset.status==='all'));
    closeOverlay('addOverlay');render();toast('已添加 '+item.name);
  });
  document.getElementById('scanBtn').addEventListener('click',()=>toast('打开相机扫码'));
  document.getElementById('completeBtn').addEventListener('click',()=>toast('进入补货拍照'));
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape')document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open'));
  });
  render();
})();
</script>
<script src="app-ui.js"></script>
</body>
</html>
