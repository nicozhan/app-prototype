<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VendSolution · 报表与分析</title>
<style>
  :root{
    /* ===== Phase 1 · P2 Design Token（唯一取值来源，禁止另取数值） ===== */
    --ds-bg:#F1F1F1; --ds-surface:#FFFFFF; --ds-surface-2:#F7F7F7; --ds-surface-sel:#EEF2FF;
    --ds-border:#E3E3E3; --ds-border-input:#8A8A8A; --ds-border-hover:#616161;
    --ds-text:#303030; --ds-text-2:#616161; --ds-text-3:#8A8A8A; --ds-text-disabled:#B5B5B5;
    --ds-brand:#3b5bdb; --ds-brand-hover:#2f4ab8; --ds-brand-bg:#EEF2FF; --ds-brand-border:#C7D2FE;
    --ds-focus:0 0 0 2px #fff,0 0 0 4px rgba(59,91,219,.4);
    --ds-success-bg:#E8F5F0; --ds-success-text:#014B40; --ds-success:#047B5D;
    --ds-info-bg:#EEF2FF; --ds-info-text:#3b5bdb; --ds-info:#3b5bdb;
    --ds-caution-bg:#FFF4D6; --ds-caution-text:#B87700;
    --ds-warning-bg:#FFEDD5; --ds-warning-text:#9A5B00;
    --ds-critical-bg:#FEE8EB; --ds-critical-text:#8E0B21; --ds-critical:#C70A24;
    --ds-neutral-bg:#F1F1F1; --ds-neutral-text:#616161; --ds-neutral-dot:#8A8A8A;
    --r-xs:4px; --r-sm:8px; --r-lg:12px; --r-pill:999px;
    --sh-card:0 1px 0 rgba(26,26,26,.05);
    --sh-pop:0 4px 16px rgba(26,26,26,.14);
    --sh-modal:0 20px 60px rgba(0,0,0,.28);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    /* ===== 兼容别名：原有类名统一指向规范 token（左侧菜单配色随主色更新） ===== */
    --bg:var(--ds-bg); --surface:var(--ds-surface); --surface-2:var(--ds-surface-2);
    --border:var(--ds-border); --border-strong:var(--ds-border-input);
    --text:var(--ds-text); --text-2:var(--ds-text-2); --text-3:var(--ds-text-3);
    --accent:var(--ds-brand); --accent-hover:var(--ds-brand-hover);
    --accent-weak:var(--ds-brand-bg); --accent-line:var(--ds-brand-border);
    --ok:var(--ds-success); --warn:var(--ds-caution-text); --danger:var(--ds-critical);
    --radius:var(--r-lg); --radius-sm:var(--r-sm);
    --nav-w:212px; --rail-w:48px; --sub-w:196px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font);
    background:var(--bg);color:var(--text);font-size:14px;line-height:22px;-webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:none;box-shadow:var(--ds-focus)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .app{display:grid;grid-template-columns:var(--nav-w) var(--sub-w) minmax(0,1fr);min-height:100vh}
  body.nav-rail{--nav-w:var(--rail-w)}
  body.sub-collapsed{--sub-w:0px}
  /* 商品页：取消右侧二级菜单，子项放到一级菜单下伸缩显示（Shopify 风格） */
  body.catalog-inline .app{grid-template-columns:var(--nav-w) minmax(0,1fr)}
  body.catalog-inline .subnav{display:none}
  .nav-children{display:none;flex-direction:column;margin:1px 0 5px;padding:2px 0 2px 20px}
  body.catalog-inline .nav-children{display:flex}
  .nav-child{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:6px 10px;border:0;background:none;border-radius:var(--radius-sm);color:var(--text-2);cursor:pointer;font-family:inherit;font-size:12.5px;line-height:18px}
  .nav-child:hover{background:var(--surface-2);color:var(--text)}
  .nav-child.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
  .nav-child .nc-dot{width:5px;height:5px;border-radius:50%;background:var(--text-3);flex:0 0 auto}
  .nav-child.active .nc-dot{background:var(--accent)}
  .nav-caret{margin-left:auto;font-size:11px;color:var(--text-3);transition:transform .15s}
  .nav-item.catalog-open .nav-caret{transform:rotate(90deg)}
  body.catalog-inline.nav-rail{--nav-w:212px}
  body.catalog-inline .nav{overflow-y:auto;padding:14px 10px}
  body.catalog-inline .brand{justify-content:flex-start;padding:0 8px 14px}
  body.catalog-inline .brand .logo{width:22px;height:22px}
  body.catalog-inline .brand-name{display:inline}
  body.catalog-inline .nav-sec{height:auto;line-height:normal;font-size:11px;padding:16px 10px 6px;margin:0}
  body.catalog-inline .nav-sec:before{display:none}
  body.catalog-inline .nav-item{justify-content:flex-start;height:auto;padding:8px 10px;margin:0 0 1px;border-left:0;border-radius:var(--radius-sm)}
  body.catalog-inline .nav-item .nav-label,body.catalog-inline .nav-item .dot{display:inline}
  body.catalog-inline .nav-item .ic{width:17px;height:17px}
  body.catalog-inline .nav-item[data-tip]:hover:after{display:none}
  body.catalog-inline .rail-toggle{display:none}
  body.catalog-inline .nav-collapse{display:grid}
  body.catalog-inline .nav-children{padding-left:20px}
  body.catalog-inline .nav-child{justify-content:flex-start;padding:6px 10px;font-size:12.5px;text-align:left}
  body.catalog-inline .nav-child .nc-dot{display:block}

  /* 一级菜单 */
  .nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:0 8px 14px;border-bottom:1px solid var(--border)}
  .brand .logo{width:22px;height:22px;border-radius:5px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;flex:0 0 auto}
  .nav-sec{font-size:11px;color:var(--text-3);letter-spacing:.04em;padding:16px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:var(--radius-sm);color:var(--text-2);cursor:pointer;font-family:inherit;font-size:13px;margin-bottom:1px}
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
  .nav-item .ic{width:17px;height:17px;flex:0 0 auto;color:var(--text-2)}
  .nav-item:hover .ic,.nav-item.active .ic{color:var(--accent)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);flex:0 0 auto}
  .nav-item.active .dot{background:var(--accent)}
  .icon-btn{width:26px;height:26px;display:none;place-items:center;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);color:var(--text-2);font-size:15px;line-height:1;cursor:pointer;font-family:inherit;flex:0 0 auto}
  .icon-btn:hover{background:var(--accent-weak);border-color:var(--accent-line);color:var(--accent)}
  .brand .nav-collapse{margin-left:auto}

  /* 二级菜单 */
  .subnav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:16px 0 14px;min-width:0}
  .subnav-hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text);padding:0 12px 4px 16px}
  .subnav-hd .sub-collapse{margin-left:auto}
  .subnav-sub{font-size:11px;color:var(--text-3);padding:0 16px 12px}
  .sub-item{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 8px 1px;padding:7px 9px;border-radius:var(--radius-sm);color:var(--text-2);cursor:pointer;font-size:12.5px;border-left:2px solid transparent}
  .sub-item:hover{background:var(--surface-2);color:var(--text)}
  .sub-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600;border-left-color:var(--accent)}
  .pri{font-size:10px;letter-spacing:.04em;padding:1px 6px;border-radius:3px;border:1px solid transparent;font-weight:600;white-space:nowrap}
  .pri.p0{background:var(--ds-success-bg);color:var(--ok);border-color:var(--ds-success-bg)}
  .pri.p1{background:var(--ds-warning-bg);color:var(--warn);border-color:var(--ds-warning-bg)}
  .pri.p2{background:var(--surface-2);color:var(--text-3);border-color:var(--border-strong)}
  .sub-foot{margin-top:14px;padding:12px 16px 0;border-top:1px solid var(--border);color:var(--text-3);font-size:11px;line-height:1.75}

  /* 图标轨 / 可收起二级面板 */
  @media (min-width:901px){
    body.nav-rail .nav{overflow:visible;padding:12px 6px}
    body.nav-rail .brand{justify-content:center;padding:0 0 12px}
    body.nav-rail .brand .logo{width:28px;height:28px}
    body.nav-rail .brand-name{display:none}
    body.nav-rail .rail-toggle{display:grid;width:30px;margin:4px auto 8px}
    body:not(.nav-rail) .nav-collapse{display:grid}
    body.nav-rail .nav-sec{height:auto;line-height:0;font-size:0;padding:8px 4px 4px;margin:2px 4px 4px}
    body.nav-rail .nav-sec:before{content:"";display:block;border-top:1px solid var(--border)}
    body.nav-rail .nav-item{justify-content:center;height:40px;padding:0;margin:0 0 4px;border-left:3px solid transparent;border-radius:0 var(--r-sm) var(--r-sm) 0;position:relative}
    body.nav-rail .nav-item .nav-label,body.nav-rail .nav-item .dot{display:none}
    body.nav-rail .nav-item .ic{width:19px;height:19px}
    body.nav-rail .nav-item.active{background:var(--accent-weak);border-left-color:var(--accent)}
    body.nav-rail .nav-item[data-tip]:hover:after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--ds-text);color:var(--ds-surface);font-size:12px;line-height:18px;padding:3px 9px;border-radius:6px;box-shadow:var(--sh-pop,0 4px 12px rgba(0,0,0,.15));z-index:60;pointer-events:none}
    body:not(.sub-collapsed) .sub-collapse{display:grid}
    body.sub-collapsed .subnav{visibility:hidden;overflow:hidden;padding:0;border-right:0}
    .sub-expand{display:none}
    body.sub-collapsed .sub-expand{display:grid}
  }
  .crumbs-wrap{display:flex;align-items:center;gap:8px;min-width:0}
  .crumbs-wrap .crumbs{min-width:0}

  /* 主区 */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{height:54px;flex:0 0 54px;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:14px}
  .crumbs{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumbs b{color:var(--text);font-weight:600}
  .top-right{display:none;align-items:center;gap:14px;color:var(--text-2);font-size:12px;flex:0 0 auto}
  .role-sel{border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:5px 8px;background:var(--surface);font-family:inherit;font-size:12px;color:var(--text);cursor:pointer}
  .tog{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-2)}
  .tog input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px}
  .content{flex:1;padding:24px;max-width:1520px;width:100%}
  /* 现制商品：按 Phase-1 规范重建，文案与截图一致 */
  .oldui-eyebrow{font-size:10px;letter-spacing:.1em;color:var(--text-3);font-weight:600}
  .oldui-sel{height:36px;border:1px solid var(--ds-border-input);border-radius:var(--r-sm);padding:0 11px;font-family:inherit;font-size:13px;color:var(--ds-text);background:var(--ds-surface);cursor:pointer;max-width:150px}
  .oldui-drag{margin-left:auto;color:var(--text-3);letter-spacing:-1px;font-size:12px}
  /* 现制商品：过滤/刷新/清除/列设置图标按页面密度收紧 */
  .oldui-page .fbar-ops{gap:4px}
  .oldui-page .btn.ico{width:24px;height:24px;border-radius:5px}
  .oldui-page .btn.ico svg{width:13px;height:13px}
  .lnk.danger{color:var(--ds-critical-text)}
  .page{animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* 页头 */
  .page-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:12px;flex-wrap:wrap}
  .page-hd .ttl{display:flex;align-items:center;gap:9px}
  .page-hd h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .page-hd p{color:var(--text-2);font-size:12.5px;margin-top:4px;max-width:720px}
  .hd-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--ds-border-input);background:var(--ds-surface);box-shadow:var(--sh-card);cursor:pointer;font-family:inherit;font-size:13px;line-height:20px;font-weight:600;color:var(--ds-text);white-space:nowrap;flex:0 0 auto;transition:background .12s,border-color .12s}
  .btn.ico{width:28px;height:28px;padding:0;border-radius:var(--r-sm)}
  .btn.active{background:var(--accent-weak);border-color:var(--accent-line);color:var(--accent)}
  .btn:hover{background:var(--ds-surface-2);border-color:var(--ds-border-hover);color:var(--ds-text)}
  .btn.accent{background:var(--ds-brand);color:#fff;border-color:var(--ds-brand)}
  .btn.accent:hover{background:var(--ds-brand-hover);border-color:var(--ds-brand-hover);color:#fff}
  .btn.danger{background:var(--ds-critical);color:#fff;border-color:var(--ds-critical)}
  .btn.danger:hover{background:#A7081C;border-color:#A7081C;color:#fff}
  .btn.sm{height:32px;padding:0 11px;font-size:12.5px}
  .btn.lg{height:40px;padding:0 18px;font-size:14px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.loading{pointer-events:none;opacity:.8}

  /* 顶部 Tab */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
  .tab{padding:9px 13px;font-size:12.5px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  /* 本地化和语言：hub 顶部 tab（子页标题由 tab 承载，隐藏重复标题与 P0） */
  .loc-hub-hd{margin-bottom:14px}
  .loc-hub .page-hd{padding-top:2px}
  .loc-hub .page-hd .ttl{display:none}

  /* 筛选条 */
  .filterbar{display:flex;align-items:center;gap:9px 12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;margin-bottom:14px;position:relative}
  .fitem{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
  .fitem select{height:36px;border:1px solid var(--ds-border-input);border-radius:var(--r-sm);padding:0 11px;font-family:inherit;font-size:13px;color:var(--ds-text);background:var(--ds-surface);cursor:pointer;max-width:190px}
  .fitem select:hover{border-color:var(--ds-border-hover)}
  .fitem select:focus{outline:none;border-color:var(--ds-brand);box-shadow:var(--ds-focus)}
  .fitem.lock select{background:var(--ds-surface-2);color:var(--ds-text-disabled);cursor:not-allowed;border-color:var(--ds-border)}
  .fbar-spacer{flex:1}
  .fbar-ops{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
  .fbar-meta{font-size:11px;color:var(--text-3)}

  /* 标注 */
  .note{position:absolute;top:9px;right:10px;font-size:10px;letter-spacing:.06em;color:var(--text-3);background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:3px;padding:1px 6px;text-transform:uppercase;pointer-events:none;white-space:nowrap}
  body.no-note .note{display:none}
  body:not(.no-note) .filterbar{padding-right:112px}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
  .kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
  .kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
  /* Root 平台总览 P0 */
  .rseg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:4px;margin-bottom:14px;max-width:640px}
  .rseg-i{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:5px;cursor:pointer;color:var(--text-2);font-size:13px;border:0;background:none;font-family:inherit;white-space:nowrap}
  .rseg-i:hover{color:var(--text)}
  .rseg-i b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .rseg-i small{font-size:11px;color:var(--text-3)}
  .rseg-i.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.07)}
  .rseg-i.on small{color:var(--accent)}
  .rgrid{display:grid;grid-template-columns:1.85fr minmax(0,1fr);gap:14px;margin-bottom:14px}
  .rgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .rgrid3{display:grid;grid-template-columns:1.2fr minmax(0,1fr);gap:14px}
  .rcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;min-width:0}
  .rcard-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;min-height:24px}
  .rcard-hd .t{font-size:13px;font-weight:600}
  .rcard-hd .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .rcard-hd .s{font-size:11px;color:var(--text-3)}
  .rk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
  .rk{padding:3px 17px;border-right:1px solid var(--border)}
  .rk:first-child{padding-left:0}
  .rk:last-child{border-right:0;padding-right:0}
  .rk .l{font-size:12px;color:var(--text-2);margin-bottom:8px}
  .rk .v{font-size:25px;font-weight:600;line-height:1.2;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
  .rk .d{font-size:11px;color:var(--text-3);margin-top:7px}
  .rk .d.up{color:var(--ok)}
  .rk5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;margin-bottom:14px}
  .rprod{display:flex;align-items:center;gap:28px;min-height:76px}
  .rprod-total{flex:0 0 auto}
  .rprod-total .v{font-size:28px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
  .rprod-total .l{font-size:11px;color:var(--text-3);margin-top:3px}
  .rprod-list{flex:1;border-left:1px solid var(--border);padding-left:20px;display:flex;flex-direction:column;gap:7px}
  .rprod-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--text-2)}
  .rprod-row b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .rprod-row i{display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--accent);margin-right:7px}
  .rprod-row:nth-child(2) i{background:var(--ds-brand)}
  .rprod-row:nth-child(3) i{background:var(--ds-brand-border)}
  .rtrend svg{width:100%;min-height:180px}
  .rlegend{display:flex;align-items:center;justify-content:center;gap:20px;font-size:11px;color:var(--text-2);margin-top:6px}
  .rlegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
  .rgrid2.rtrend{align-items:stretch}
  .rtrend .rcard{display:flex;flex-direction:column}
  .rtrend .rcard-hd{margin-bottom:8px}
  .rgrid3 .tbl-panel{min-width:0}
  .rgrid3 .tbl-hd{padding-right:16px}
  .rgrid3 th,.rgrid3 td{padding:9px 10px;font-size:11.5px}
  .rgrid3 .tbl-ft{padding:10px 12px}
  .ranalysis{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:0 16px 16px;min-width:0}
  .ranalysis .tabs{margin:0 -16px 14px;padding:0 16px}
  .rlist{display:flex;flex-direction:column;gap:10px}
  .rbar{display:grid;grid-template-columns:70px minmax(36px,1fr) 48px;gap:8px;align-items:center;font-size:11px}
  .rbar .nm{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rbar .tr{display:block;height:8px;background:var(--ds-surface-2);border-radius:2px;overflow:hidden}
  .rbar .fl{display:block;height:100%;background:var(--accent);border-radius:2px;min-width:2px}
  .rbar .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .rbar.bad .fl{background:var(--ds-critical)}
  .rdonut{display:flex;align-items:center;gap:12px;padding:1px 0 12px}
  .rdonut svg{width:122px;flex:0 0 122px}
  .rdonut-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .rdonut-r{display:flex;justify-content:space-between;gap:8px;font-size:11px}
  .rdonut-r .n{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rdonut-r i{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:5px}
  .rdonut-r b{font-weight:600;font-variant-numeric:tabular-nums}
  .rtable-title{font-size:12px;font-weight:600;margin:14px 0 8px}
  .rscale{font-size:11px;color:var(--text-3);margin-top:10px}
  .ph-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tbl-hd .tn{color:var(--text-3);font-weight:400;font-size:11.5px;margin-left:8px}
  body.no-note .tbl-hd{padding-right:16px}
  .root-tbl .tbl-hd{padding-right:16px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;position:relative}
  .kpi-l{color:var(--text-2);font-size:12px;margin-bottom:6px}
  .kpi-v{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.25;font-variant-numeric:tabular-nums}
  .kpi-v .cu{font-size:11px;font-weight:400;color:var(--text-3);margin-left:5px;letter-spacing:0}
  .kpi-d{margin-top:6px;font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .kpi-d b{font-weight:600}
  .kpi-d b.good{color:var(--ok)}
  .kpi-d b.bad{color:var(--danger)}
  .kpi-d b.flat{color:var(--text-3);font-weight:400}

  /* 币种分组 */
  .cur-strip{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 15px;margin-bottom:12px;position:relative}
  .cur-h{font-size:12px;font-weight:600;margin-bottom:4px}
  .cur-sub{font-size:11px;color:var(--text-3);margin-bottom:10px}
  .cur-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .cur-cell{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;background:var(--surface-2)}
  .cur-cell .c{font-size:11px;color:var(--text-2)}
  .cur-cell .v{font-size:16px;font-weight:600;margin:2px 0 3px;font-variant-numeric:tabular-nums}
  .cur-cell .s{font-size:11px;color:var(--text-3);line-height:1.6}

  /* 卡片 / 图表 */
  .charts{display:grid;grid-template-columns:1.6fr minmax(0,1fr);gap:12px;margin-bottom:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;min-width:0;display:flex;flex-direction:column}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;padding-right:96px}
  .card-h h3{font-size:13px;font-weight:600}
  .card-h .sub{color:var(--text-3);font-size:11.5px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--ds-border);border-radius:var(--r-pill);background:var(--ds-surface);font-size:11.5px;color:var(--ds-text);cursor:pointer;font-family:inherit}
  .chip:hover{border-color:var(--ds-border-hover);color:var(--ds-text)}
  .chip.on{background:var(--ds-brand-bg);border-color:var(--ds-brand-border);color:var(--ds-brand);font-weight:600}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:8px;font-size:11.5px;color:var(--text-2)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .lbl{font-size:10px;fill:var(--ds-text-3);font-family:inherit}
  .grid-l{stroke:var(--ds-border);stroke-width:1}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex:1;min-height:180px}
  .donut-wrap svg{width:142px;flex:0 0 142px}
  .donut-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .dl-row{display:flex;align-items:center;gap:8px;font-size:12px}
  .dl-row i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .dl-row .nm{color:var(--text-2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dl-row .vl{font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}
  .bars{display:flex;flex-direction:column;gap:12px;flex:1;min-height:180px;justify-content:center}
  .bar-row{display:grid;grid-template-columns:100px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:12px}
  .bar-row .nm{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{display:block;height:8px;background:var(--ds-surface-2);border-radius:99px;overflow:hidden}
  .bar-fill{display:block;height:100%;background:var(--accent);border-radius:99px}
  .bar-row .vl{text-align:right;font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}

  /* 表格 */
  .tbl-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);position:relative}
  .tbl-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);padding-right:120px;flex-wrap:wrap}
  .tbl-hd .t{font-weight:600;font-size:13px}
  .tbl-hd .a{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .tbl-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border-bottom:1px solid var(--border);padding:8px 12px;text-align:left;white-space:nowrap}
  th{height:38px;color:var(--ds-text-2);font-size:12px;font-weight:600;background:var(--ds-surface-2)}
  td{height:52px}
  tbody tr.selected,tbody tr.selrow{background:var(--ds-surface-sel)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td .strong{font-weight:600}
  td .muted{color:var(--text-3)}
  .badge{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:var(--r-sm);font-size:12px;line-height:1;font-weight:600;white-space:nowrap;border:1px solid transparent}
  .badge.success,.badge.ok{background:var(--ds-success-bg);color:var(--ds-success-text)}
  .badge.info{background:var(--ds-info-bg);color:var(--ds-info-text)}
  .badge.caution,.badge.warn{background:var(--ds-caution-bg);color:var(--ds-caution-text)}
  .badge.warning{background:var(--ds-warning-bg);color:var(--ds-warning-text)}
  .badge.critical,.badge.danger{background:var(--ds-critical-bg);color:var(--ds-critical-text)}
  .badge.neutral,.badge.muted{background:var(--ds-neutral-bg);color:var(--ds-neutral-text)}
  .thumb{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600;flex:0 0 auto}
  .thumb-cell{display:flex;align-items:center;gap:8px}
  .lnk{color:var(--accent);cursor:pointer;border-bottom:1px dashed var(--accent-line)}
  .lnk:hover{color:var(--ds-brand-hover)}
  .tbl-ft{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;color:var(--ds-text-2);font-size:12.5px;border-top:1px solid var(--border);gap:12px;flex-wrap:wrap}
  .pager{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ds-text-2)}
  .pg{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border:1px solid var(--ds-border);background:var(--ds-surface);border-radius:var(--r-sm);font-family:inherit;font-size:12.5px;color:var(--ds-text);cursor:pointer}
  .pg:hover:not(:disabled){border-color:var(--ds-border-hover);background:var(--ds-surface-2)}
  .pg:disabled{opacity:.4;cursor:not-allowed}
  .pg.cur{background:var(--ds-brand);border-color:var(--ds-brand);color:#fff;font-weight:600}

  /* 商品 / 机器 页面（极简） */
  .cell-stack{display:flex;flex-direction:column;gap:1px}
  .cell-stack .sub{font-size:11px;color:var(--text-3)}
  .oldui-namecell{display:flex;align-items:center;gap:10px}
  .oldui-namecell .oldui-thumb{width:36px;height:36px;flex:0 0 36px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);object-fit:cover;display:block}
  /* 预包装商品库 */
  .pre-search{position:relative;display:inline-flex;align-items:center;width:340px;max-width:100%}
  .pre-search .ps-ico{position:absolute;left:11px;display:inline-flex;color:var(--text-3);pointer-events:none}
  .pre-search input{height:36px;border:1px solid var(--ds-border-input);border-radius:var(--r-sm);padding:0 11px 0 34px;font-family:inherit;font-size:13px;width:100%;background:var(--ds-surface);color:var(--ds-text)}
  .lnk.pre-clear{border-bottom:0;white-space:nowrap}
  .pre-more{color:var(--text-3);letter-spacing:1px}
  .pre-page .page-hd .ttl{display:block}
  .pre-page .page-hd .oldui-eyebrow{display:block;margin-bottom:3px}
  .pre-clear{background:transparent;border:0;padding:0;color:var(--accent);font-size:12.5px;cursor:pointer;font-family:inherit}
  .row-actions{display:flex;gap:12px;align-items:center}
  .row-actions .lnk{border-bottom:0}
  .row-actions .lnk.danger{color:var(--danger)}

  /* 口径提示 */
  .callouts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .callout{display:flex;gap:9px;padding:10px 12px;border-radius:var(--radius-sm);font-size:11.5px;line-height:1.7}
  .callout.info{background:var(--ds-brand-bg);border:1px solid var(--ds-brand-border);color:var(--ds-text-2)}
  .callout.warn{background:#fff8ed;border:1px solid var(--ds-warning-bg);color:var(--ds-warning-text)}
  .callout .ico{font-weight:700;flex:0 0 auto}
  .callout b{font-weight:600}

  /* P1 / P2 */
  .locked{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:12px}
  .locked-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .locked-hd h3{font-size:15px;font-weight:600}
  .locked p{color:var(--text-2);font-size:12.5px;max-width:760px;line-height:1.8}
  .locked .req-t{margin-top:16px;font-size:12px;font-weight:600}
  .builder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
  .bcol{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px}
  .bcol h4{font-size:12.5px;font-weight:600;margin-bottom:4px}
  .bcol .bs{font-size:11px;color:var(--text-3);margin-bottom:10px}
  .bopt{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--text-2);padding:4px 0;cursor:pointer;line-height:1.5}
  .bopt input{margin-top:3px;accent-color:var(--accent);flex:0 0 auto}
  .bopt.na{opacity:.5;cursor:not-allowed}
  .bopt .lk{font-size:10px;color:var(--text-3);margin-left:4px}
  .bpreview{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
  .bpreview h4{font-size:12.5px;font-weight:600;margin-bottom:8px}
  .bpline{font-size:12px;color:var(--text-2);padding:3px 0}
  .bpline b{color:var(--text);font-weight:600}

  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);opacity:0;background:var(--ds-text);color:#fff;padding:9px 16px;border-radius:6px;font-size:12.5px;pointer-events:none;transition:opacity .18s,transform .18s;z-index:99;max-width:80vw}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:1240px){
    :root{--sub-w:174px}
    .charts{grid-template-columns:1fr}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
    .cur-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .callouts{grid-template-columns:1fr}
    .rgrid,.rgrid2,.rgrid3{grid-template-columns:1fr}
    .rk5{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 0}
    .rk5 .rk:nth-child(3){border-right:0}
  }
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .nav{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:10px}
    .nav .brand,.nav-sec{display:none}
    .nav-item{width:auto;white-space:nowrap;margin:0}
    .subnav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}
    #subItems{display:flex;gap:2px;overflow-x:auto}
    .subnav-hd,.subnav-sub,.sub-foot{display:none}
    .sub-item{margin:0;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;border-radius:4px;flex:0 0 auto}
    .sub-item.active{border-bottom-color:var(--accent)}
    .content{padding:16px}
    .builder{grid-template-columns:1fr}
    .rgrid,.rgrid2,.rgrid3{grid-template-columns:1fr}
    .rseg{max-width:none}
    .rseg-i{padding:8px 10px}
    .hd-act{width:100%}
  }
  @media (max-width:560px){
    .kpis{grid-template-columns:1fr!important}
    .cur-grid{grid-template-columns:1fr}
    .rk-grid,.rk5{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 0}
    .rk:nth-child(2n){border-right:0}
    .rk:nth-child(3){padding-left:0}
    .rk .v{font-size:22px}
    .rprod{flex-direction:column;align-items:stretch;gap:16px}
    .rprod-list{border-left:0;border-top:1px solid var(--border);padding:14px 0 0}
    .rdonut{flex-wrap:wrap}
  }

  /* 关联矩阵 */
  .matrix-note{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px;font-size:12px;color:var(--text-2)}
  .matrix-note b{font-weight:600;color:var(--text)}
  .mx-lnk{color:var(--accent);cursor:pointer;border-bottom:1px dashed var(--accent-line);font-weight:600}
  .mx-lnk:hover{color:var(--ds-brand-hover)}
  .matrix th{white-space:normal}
  .matrix th .mu{display:block;font-size:10px;color:var(--text-3);font-weight:400;margin-top:1px}
  .matrix td.vv{text-align:right;font-variant-numeric:tabular-nums}
  .matrix td.zero{color:var(--text-3)}
  .matrix td.sum{background:var(--surface-2);font-weight:600}

  /* 下钻弹层 */
  .mx-mask{position:fixed;inset:0;background:rgba(26,26,26,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px}
  .mx{background:var(--ds-surface);border-radius:var(--r-lg);max-width:620px;width:100%;max-height:82vh;overflow:auto;box-shadow:var(--sh-modal);animation:mxin .16s ease}
  .mx.w480{max-width:480px}.mx.w620{max-width:620px}.mx.w820{max-width:820px}
  @keyframes mxin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .mx-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
  .mx-hd h3{font-size:15px;font-weight:600}
  .mx-hd .mx-sub{font-size:12px;color:var(--text-3);margin-top:3px}
  .mx-x{cursor:pointer;color:var(--text-3);font-size:20px;line-height:1;padding:2px 8px;border:none;background:none;font-family:inherit}
  .mx-x:hover{color:var(--text)}
  .mx-bd{padding:16px 20px 20px}
  .mx-sec{margin-bottom:18px}
  .mx-sec:last-child{margin-bottom:0}
  .mx-sec h4{font-size:11px;color:var(--text-3);margin-bottom:8px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .mx-kpis{display:flex;gap:10px;flex-wrap:wrap}
  .mx-kpi{border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:var(--surface-2);min-width:118px}
  .mx-kpi .l{font-size:11px;color:var(--text-2)}
  .mx-kpi .v{font-size:16px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .mx-kpi .s{font-size:10.5px;color:var(--text-3);margin-top:1px}

  /* 本地化中心 */
  .loc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .loc-ov{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
  .loc-ov .l{font-size:12px;color:var(--text-2);margin-bottom:9px}
  .loc-ov .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
  .loc-ov .d{font-size:11px;color:var(--text-3);margin-top:7px}
  .loc-ov .v.ok{color:var(--ok)} .loc-ov .v.warn{color:var(--warn)} .loc-ov .v.muted{color:var(--text-2)}
  .loc-default{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--accent-weak);border:1px solid var(--accent-line);border-radius:var(--radius);padding:14px 18px;margin-bottom:14px}
  .loc-default .lbl{font-size:12px;color:var(--text-2)}
  .loc-default .val{font-size:15px;font-weight:600;margin-top:3px}
  .loc-default .val small{font-weight:400;color:var(--text-3);font-size:12px;margin-left:6px}
  .switch{position:relative;width:38px;height:21px;flex:0 0 auto;display:inline-block;vertical-align:middle}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch i{position:absolute;inset:0;background:var(--border-strong);border-radius:99px;transition:.15s}
  .switch i:before{content:'';position:absolute;width:17px;height:17px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked + i{background:var(--accent)}
  .switch input:checked + i:before{transform:translateX(17px)}
  .switch input:disabled + i{background:var(--accent);opacity:.45}
  .radio-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);display:inline-grid;place-items:center;cursor:pointer}
  .radio-dot.on{border-color:var(--accent)}
  .radio-dot.on:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .radio-dot.dis{opacity:.4;cursor:not-allowed}
  .locale-tag{display:inline-block;font-size:10.5px;color:var(--text-3);background:var(--surface-2);border:1px solid var(--border);border-radius:3px;padding:0 5px;margin-left:6px;font-variant-numeric:tabular-nums}
  .missing{color:var(--text-3);font-style:italic}
  .fallback{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--warn);background:var(--ds-warning-bg);border:1px solid var(--ds-warning-bg);border-radius:3px;padding:0 5px;margin-left:6px;white-space:nowrap}

  /* 抽屉 */
  .mask{position:fixed;inset:0;background:rgba(26,26,26,.45);z-index:60;display:none}
  .mask.on{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:720px;max-width:100vw;background:var(--ds-surface);z-index:61;box-shadow:var(--sh-modal);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
  .drawer.w480{width:480px}.drawer.w960{width:960px}
  .drawer.on{transform:none}
  .drawer-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
  .drawer-hd h3{font-size:14px;font-weight:600}
  .drawer-bd{flex:1;overflow-y:auto;padding:18px}
  .drawer-ft{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border)}
  .drawer-x{border:0;background:none;font-size:18px;color:var(--text-3);cursor:pointer;line-height:1}

  /* 机器 · 设备详情抽屉（iframe 载入本地页面 machine-detail.html，头部 / 七个 Tab / 底栏均由页面自身提供） */
  body.mdr-open{overflow:hidden}
  .mdr-mask{position:fixed;inset:0;background:rgba(26,26,26,.42);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s ease}
  .mdr-mask.on{opacity:1;pointer-events:auto}
  .mdr{position:fixed;top:0;right:0;height:100vh;width:1000px;max-width:100vw;background:#F1F1F1;z-index:81;display:flex;flex-direction:column;box-shadow:var(--sh-modal);transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1)}
  .mdr.on{transform:none}
  .mdr-frame{flex:1;width:100%;min-height:0;border:0;display:block;background:#F1F1F1}
  tr.mrow{cursor:pointer}
  tr.mrow:hover td{background:var(--ds-surface-2)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
  .field .src{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 11px;font-size:13px;color:var(--text-2)}
  .field input,.field textarea{width:100%;border:1px solid var(--ds-border-input);border-radius:var(--r-sm);padding:8px 11px;font-family:inherit;font-size:13px;line-height:20px;color:var(--ds-text);background:var(--ds-surface)}
  .field input:hover,.field textarea:hover{border-color:var(--ds-border-hover)}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--ds-brand);box-shadow:var(--ds-focus)}
  .field input:disabled,.field textarea:disabled{background:var(--ds-surface-2);color:var(--ds-text-disabled);cursor:not-allowed}
  .field input.is-error,.field textarea.is-error{border-color:var(--ds-critical)}
  .field .err{font-size:12px;color:var(--ds-critical-text);margin-top:5px}
  /* AI 服务配置 */
  .ai-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  .ai-grid .card-h{padding-right:0}
  .ai-grid .field select{width:100%;height:38px;border:1px solid var(--ds-border-input);border-radius:var(--r-sm);padding:0 11px;font-family:inherit;font-size:13px;color:var(--ds-text);background:var(--ds-surface);cursor:pointer}
  .ai-grid .field input[type="range"]{height:24px}
  @media(max-width:980px){.ai-grid{grid-template-columns:1fr}}
  /* 机器模板：分步表单与料仓配置 */
  .mtpl-steps{display:flex;align-items:center;gap:10px;padding:2px 0 15px;border-bottom:1px solid var(--border);margin-bottom:16px}
  .mtpl-step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3);white-space:nowrap}
  .mtpl-step .n{width:22px;height:22px;flex:0 0 22px;border-radius:999px;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text-2);background:var(--surface)}
  .mtpl-step.on{color:var(--ds-brand);font-weight:600}
  .mtpl-step.on .n{background:var(--ds-brand);border-color:var(--ds-brand);color:#fff}
  .mtpl-step.done{color:var(--text-2)}
  .mtpl-step.done .n{background:var(--ds-brand-soft,#eef2ff);border-color:var(--ds-brand);color:var(--ds-brand)}
  .mtpl-line{width:28px;height:1px;background:var(--border-strong)}
  .mtpl-ctx{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;font-size:12px;color:var(--text-2);margin-bottom:12px}
  .mtpl-modal .field select{width:100%;height:36px;border:1px solid var(--ds-border-input);border-radius:var(--r-sm);padding:0 11px;font-family:inherit;font-size:13px;color:var(--ds-text);background:var(--ds-surface)}
  .mtpl-modal .mx-ft{position:sticky;bottom:-1px;background:var(--ds-surface);z-index:2}
  .mtpl-modal .field select:focus{outline:none;border-color:var(--ds-brand);box-shadow:var(--ds-focus)}
  .mtpl-bin th,.mtpl-bin td{padding:6px 8px}
  .mtpl-bin input,.mtpl-bin select{width:100%;height:32px;border:1px solid var(--ds-border-input);border-radius:var(--r-sm);padding:0 7px;font-family:inherit;font-size:12px;color:var(--ds-text);background:var(--ds-surface)}
  .mtpl-bin input:focus,.mtpl-bin select:focus{outline:none;border-color:var(--ds-brand);box-shadow:var(--ds-focus)}
  .mtpl-bin td.num input{text-align:center}
  .mtpl-measure{display:flex;align-items:center;gap:5px;justify-content:center}
  .mtpl-measure select{width:74px;flex:0 0 74px}
  .mtpl-measure input{width:66px;flex:0 0 66px}
  .mtpl-measure .off{flex:1;font-size:12px;color:var(--text-3)}
  .mtpl-bin .rowmove{display:flex;gap:4px;justify-content:center}
  .mtpl-bin .rowmove .btn{padding:1px 6px;font-size:11px}
  .kv-list{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
  .kv{display:flex;justify-content:space-between;gap:14px;font-size:12.5px}
  .kv .k{color:var(--text-3)} .kv .v{font-weight:600;text-align:right}

  /* 商品本地化 */
  .loc-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;position:relative}
  .loc-block .blk-h{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-3);text-transform:uppercase;margin-bottom:12px}
  .loc-row{display:grid;grid-template-columns:190px 1fr 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
  .loc-row:last-child{border-bottom:0}
  .loc-row .lab{font-size:12.5px}
  .loc-row .lab small{display:block;color:var(--text-3);font-size:11px;margin-top:1px}
  .loc-row .src{font-size:12.5px;color:var(--text-2);background:var(--surface-2);border-radius:var(--radius-sm);padding:5px 9px}
  .loc-row .tgt input{border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:5px 9px;font-family:inherit;font-size:12.5px;width:100%;background:var(--surface)}
  .loc-row .tgt input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
  .loc-row .tgt .missing-in{color:var(--text-3);font-style:italic}
  .loc-completion{display:flex;align-items:center;gap:12px}
  .loc-bar{height:8px;flex:1;background:var(--surface-2);border-radius:99px;overflow:hidden}
  .loc-bar i{display:block;height:100%;background:var(--ok)}

  /* 主数据本地化表 */
  .loc-master-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
  .loc-master-grid .lc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
  .loc-master-grid .lc .t{font-size:11px;color:var(--text-3)} .loc-master-grid .lc .v{font-size:14px;font-weight:600;margin-top:2px}

  /* 终端预览 */
  .term-wrap{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}
  .phone{width:320px;border:8px solid #1f2937;border-radius:30px;background:#0f172a;padding:14px 12px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
  .phone-bar{display:flex;align-items:center;justify-content:space-between;color:#cbd5e1;font-size:11px;margin-bottom:10px}
  .phone-screen{background:#fff;border-radius:16px;min-height:430px;padding:12px;overflow:hidden}
  .phone-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
  .phone-lang{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
  .phone-lang button{border:1px solid var(--border-strong);background:var(--surface);border-radius:99px;font-size:11px;padding:3px 9px;cursor:pointer;font-family:inherit;color:var(--text-2)}
  .phone-lang button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .phone-lang button.off{opacity:.4;cursor:not-allowed;text-decoration:line-through}
  .p-card{border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:8px}
  .p-card .pn{font-size:13px;font-weight:600}
  .p-card .pd{font-size:11px;color:var(--text-2);margin-top:3px;line-height:1.5}
  .p-card .pt{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .p-card .pt span{font-size:10.5px;background:var(--surface-2);border-radius:4px;padding:1px 6px;color:var(--text-2)}
  .term-side .callouts{grid-template-columns:1fr}
  .term-side .legend{display:flex;gap:14px;margin:10px 0 4px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2)}
  .term-side .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .term-note{font-size:11.5px;color:var(--text-2);line-height:1.7;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-top:12px}
  @media(max-width:1100px){
    .loc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .loc-master-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .term-wrap{grid-template-columns:1fr}
    .loc-row{grid-template-columns:140px 1fr}
    .loc-row .tgt{grid-column:1 / -1}
  }

  /* 标签管理 */
  .tagcell{display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:pointer;max-width:220px}
  .tagpill{display:inline-flex;align-items:center;gap:3px;font-size:11px;background:var(--accent-weak);color:var(--accent);border:1px solid var(--accent-line);border-radius:99px;padding:1px 8px;white-space:nowrap;line-height:1.7}
  .tagpill em{font-style:normal;font-size:10px;opacity:.85}
  .tagpill.off{background:var(--surface-2);color:var(--text-3);border-color:var(--border-strong)}
  .tagpill.more{background:var(--surface-2);color:var(--text-2);border-color:var(--border);cursor:pointer}
  .row-more{position:relative;display:inline-block}
  .row-more summary{list-style:none;cursor:pointer;color:var(--text-2);padding:0 3px;font-size:14px;user-select:none}
  .row-more summary::-webkit-details-marker{display:none}
  .more-menu{position:absolute;right:0;top:130%;z-index:30;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:0 10px 28px rgba(0,0,0,.14);min-width:130px;padding:4px}
  .more-menu .mi{padding:7px 10px;font-size:12px;color:var(--text-2);cursor:pointer;border-radius:var(--radius-sm);white-space:nowrap}
  .more-menu .mi:hover{background:var(--surface-2);color:var(--text)}
  .more-menu .mi.danger{color:var(--danger)}
  .more-menu .mi.danger:hover{background:var(--ds-critical-bg)}
  .bulkbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--ds-brand-bg);border:1px solid var(--ds-brand-border);border-radius:var(--r-sm);margin-bottom:12px;font-size:12.5px;color:var(--ds-brand);font-weight:600}
  .bulkbar .sp{flex:1}
  .bulkbar b{color:var(--ds-brand)}
  .bulkbar .btn{height:32px;padding:0 11px}
  .tag-filter{position:relative;display:inline-block}
  .tag-filter>summary{list-style:none;cursor:pointer;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:5px 9px;font-size:12px;color:var(--text-2);background:var(--surface);white-space:nowrap}
  .tag-filter>summary::-webkit-details-marker{display:none}
  .tag-filter .tf-body{position:absolute;left:0;top:124%;z-index:30;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:0 10px 28px rgba(0,0,0,.14);padding:8px 10px;min-width:150px;max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:2px}
  .tag-filter .tf-body .bopt{font-size:12px;padding:3px 0}
  .ot-list{display:flex;flex-direction:column;gap:3px;max-height:300px;overflow:auto;margin-bottom:6px}
  .ot-new{margin:6px 0}
  .mx-ft{background:var(--surface)}
  /* 标签设置页（分组 + 标签 两栏） */
  .set-page{display:grid;grid-template-columns:320px 1fr;gap:0;align-items:stretch;min-height:calc(100vh - 168px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .set-left{background:var(--surface-2,var(--ds-surface-2));border-right:1px solid var(--border);padding:16px;overflow:auto}
  .set-left-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .set-left-hd h3{font-size:15px;margin:0;line-height:1.4}
  .set-sec{margin-bottom:18px}
  .set-sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .set-sec-hd b{font-size:13px}
  .set-q{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:5px 8px;font-family:inherit;font-size:12px;margin-bottom:6px;box-sizing:border-box}
  .set-sec-list{display:flex;flex-direction:column;gap:4px;max-height:230px;overflow:auto}
  .set-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:var(--surface);transition:background .12s,border-color .12s}
  .set-item:hover{border-color:var(--border-strong)}
  .set-item.on{background:var(--ds-brand-bg);border-color:var(--ds-brand)}
  .set-item .si-badge{font-size:10px;flex:0 0 auto;display:inline-flex;align-items:center}
  .set-item .si-badge .badge{height:20px;padding:0 7px;font-size:11px;gap:4px}
  .set-item .si-name{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .set-item .si-name.inline-edit{overflow:visible}
  .set-item .si-name.inline-edit input{width:100%;font-family:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--ds-brand);border-radius:var(--radius-sm);box-sizing:border-box}
  .set-item .lnk{font-size:11px;flex:0 0 auto}
  .set-item .si-cnt{font-size:11px;color:var(--text-3);flex:0 0 auto}
  .set-item .row-more{flex:0 0 auto}
  .set-left-ft{margin-top:8px;padding-top:12px;border-top:1px solid var(--border)}
  .set-right{display:flex;flex-direction:column;min-width:0;position:relative}
  .set-right .page-hd{padding:16px 18px 0}
  .set-right .tbl-panel{border:none;border-radius:0;margin:0}
  .set-bar{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--surface);border-top:1px solid var(--border-strong);box-shadow:0 -4px 14px rgba(0,0,0,.06);z-index:20}
  .set-bar .sp{flex:1}
  .set-bar.bulk-inline{position:relative;bottom:auto;margin:0 0 12px;border:1px solid var(--accent-line);border-radius:var(--r-sm);background:var(--accent-weak);box-shadow:none;z-index:1}
  .set-bar.bulk-inline b{color:var(--accent)}
  .set-pop{position:absolute;right:18px;bottom:calc(100% + 8px);width:268px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:0 14px 34px rgba(0,0,0,.18);z-index:40;overflow:hidden}
  .set-bar.bulk-inline .set-pop{bottom:auto;top:calc(100% + 8px)}
  .set-bar.bulk-inline .set-pop .set-pop-ft{position:sticky;bottom:0;background:var(--surface)}
  .set-pop-hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
  .set-pop-q{margin-left:auto;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:4px 8px;font-family:inherit;font-size:12px;width:120px;box-sizing:border-box}
  .set-pop-list{display:flex;flex-direction:column;gap:2px;padding:8px 10px;max-height:240px;overflow:auto}
  .set-pop-ft{display:flex;justify-content:flex-end;gap:8px;padding:8px 12px;border-top:1px solid var(--border)}
  .btn.xs{height:28px;font-size:11px;padding:0 9px}
  /* 翻译与适配 */
  .tr-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .tr-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
  .tr-stat .n{font-size:24px;font-weight:600;line-height:1.2;color:var(--text-1)}
  .tr-stat .l{font-size:12px;color:var(--text-3);margin-top:4px}
  .tr-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:start}
  .tr-tree{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px}
  .tr-tree-g{font-size:12px;font-weight:600;color:var(--text-2);padding:8px 10px 6px;display:flex;justify-content:space-between;cursor:pointer}
  .tr-tree-i{padding:8px 10px;border-radius:var(--r-sm);font-size:12.5px;color:var(--text-2);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .tr-tree-i:hover{background:var(--surface-2)}
  .tr-tree-i.on{background:var(--ds-brand-soft,#eef2ff);color:var(--ds-brand);font-weight:600}
  .tr-progress{display:flex;align-items:center;gap:8px}
  .tr-bar{width:90px;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:block}
  .tr-bar i{display:block;height:100%;background:var(--ds-brand);border-radius:999px}
  .tr-sec{margin:18px 0 10px;font-size:13px;font-weight:600;border-left:3px solid var(--ds-brand);padding-left:9px}
  .tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .tr-col-h{font-size:12px;color:var(--text-3);margin-bottom:8px}
  .tr-field{margin-bottom:14px}
  .tr-label{font-size:12px;color:var(--text-2);margin-bottom:6px}
  .tr-src{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;font-size:13px;line-height:20px;min-height:38px;white-space:pre-wrap;color:var(--text-1)}
  .tr-ta{width:100%;min-height:38px;border:1px solid var(--ds-border-input);border-radius:var(--r-sm);padding:8px 11px;font-family:inherit;font-size:13px;line-height:20px;resize:vertical;color:var(--ds-text);background:var(--ds-surface)}
  .tr-ta:focus{outline:none;border-color:var(--ds-brand);box-shadow:var(--ds-focus)}
  .tr-row{display:flex;align-items:center;gap:8px;margin-top:6px}
  .tr-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;justify-content:flex-end;gap:8px;margin-top:18px;z-index:3}
  .tr-subgroup{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px}
  .tr-subgroup .h{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:12.5px;font-weight:600;margin-bottom:8px}
  .tr-alert{display:flex;align-items:center;gap:8px;background:var(--ds-warning-bg,#fff7ed);border:1px solid var(--ds-warning-border,#fed7aa);color:var(--ds-warning-text,#9a3412);border-radius:var(--r-sm);padding:9px 12px;font-size:12.5px;margin-bottom:12px}

  /* 本地化中心 · 多语言内容对照（Phase 1 · P2 规范） */
  .mx2-page .page-hd h2{font-size:20px;line-height:28px}
  .mx2-page .page-hd p{font-size:12.5px;line-height:18px}
  .mx2-wrap{display:grid;grid-template-columns:222px minmax(0,1fr);gap:16px;align-items:start}
  .mx2-tree{background:var(--ds-surface);border:1px solid var(--ds-border);border-radius:var(--r-lg);box-shadow:var(--sh-card);overflow:hidden}
  .mx2-tree-hd{display:flex;justify-content:space-between;align-items:center;height:38px;padding:0 16px;background:var(--ds-surface-2);border-bottom:1px solid var(--ds-border);font-size:12px;line-height:16px;font-weight:600;color:var(--ds-text-2)}
  .mx2-tree-hd span:last-child{font-weight:400;color:var(--ds-text-3)}
  .mx2-cat{display:flex;align-items:center;gap:8px;padding:12px 12px 4px;font-size:13px;line-height:20px;font-weight:600;color:var(--ds-text);cursor:pointer;user-select:none;border-top:1px solid var(--ds-border)}
  .mx2-cat:first-of-type{border-top:0}
  .mx2-cat:hover,.mx2-grp:hover{color:var(--ds-brand)}
  .mx2-cat .arw,.mx2-grp .arw{width:12px;font-size:12px;line-height:16px;color:var(--ds-text-3);flex:0 0 auto}
  .mx2-grp{display:flex;align-items:center;gap:8px;padding:8px 12px 4px 24px;font-size:12.5px;line-height:18px;font-weight:600;color:var(--ds-text-2);cursor:pointer;user-select:none}
  .mx2-leaf{display:flex;justify-content:space-between;align-items:center;margin:2px 8px;padding:6px 12px 6px 36px;border-radius:var(--r-sm);font-size:12.5px;line-height:18px;color:var(--ds-text-2);cursor:pointer}
  .mx2-leaf:hover{background:var(--ds-surface-2);color:var(--ds-text)}
  .mx2-leaf.on{background:var(--ds-brand-bg);color:var(--ds-brand);font-weight:600}
  .mx2-leaf .ct{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-pill);background:var(--ds-surface-2);font-size:12px;font-weight:400;line-height:16px;color:var(--ds-text-3)}
  .mx2-leaf.on .ct{background:var(--ds-surface);color:var(--ds-brand)}
  .mx2-panel{min-width:0;box-shadow:var(--sh-card)}

<script>
/* ============================================================
   0. 工具
   ============================================================ */
const CN = ['#2563eb','#60a5fa','#a5b4fc','#cbd5e1','#94a3b8','#dbe2ea','#b0b7c3'];
const esc = s => String(s === undefined || s === null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}
const seq = (base, amp, weekend, mod) => Array.from({length:30},(_,i)=>
  Math.round(base + Math.sin(i/2.2)*amp + (i%7>=5 ? weekend : 0) + ((i*7)%mod)));
const seqF = (base, amp, weekend) => Array.from({length:30},(_,i)=>
  +(base + Math.sin(i/2.2)*amp + (i%7>=5 ? weekend : 0) + ((i*3)%5)/10).toFixed(2));

/* ============================================================
   1. 图表（无依赖 SVG）
   ============================================================ */
function lineChart(c){
  const W=720,H=196,PL=48,PR=8,PT=10,PB=24;
  const data=c.data, prev=c.prev||null;
  const lo=c.min===undefined?0:c.min;
  let hi=Math.max.apply(null, prev?data.concat(prev):data);
  hi = c.ymax!==undefined ? c.ymax : hi + ((hi-lo)||1)*0.18;
  if(hi===lo) hi=lo+1;
  const ticks=c.ticks||4;
  const x=i=>PL+(W-PL-PR)*i/Math.max(1,data.length-1);
  const y=v=>PT+(H-PT-PB)*(1-(v-lo)/(hi-lo));
  let g='';
  for(let t=0;t<=ticks;t++){
    const v=lo+(hi-lo)*t/ticks, yy=y(v);
    g+='<line class="grid-l" x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+yy.toFixed(1)+'"/>';
    g+='<text class="lbl" x="'+(PL-8)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end">'+(c.yfmt?c.yfmt(v):Math.round(v))+'</text>';
  }
  const pts=data.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const area='M'+x(0).toFixed(1)+','+y(lo).toFixed(1)+' L'+pts.split(' ').join(' L')+
    ' L'+x(data.length-1).toFixed(1)+','+y(lo).toFixed(1)+' Z';
  const prevLine=prev?'<polyline fill="none" stroke="#c7cbd1" stroke-width="1.5" stroke-dasharray="4 3" points="'+
    prev.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')+'"/>':'';
  const xs=[0,Math.round((data.length-1)/4),Math.round((data.length-1)/2),Math.round((data.length-1)*3/4),data.length-1];
  let xtext='';
  (c.xlabels||[]).forEach((lb,k)=>{
    if(lb!==undefined&&xs[k]!==undefined) xtext+='<text class="lbl" x="'+x(xs[k]).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(lb)+'</text>';
  });
  const gid='g'+Math.random().toString(36).slice(2,7);
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#2563eb" stop-opacity="0.16"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/></linearGradient></defs>'+
    g+prevLine+'<path d="'+area+'" fill="url(#'+gid+')"/>'+
    '<polyline fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts+'"/>'+
    '<circle cx="'+x(data.length-1).toFixed(1)+'" cy="'+y(data[data.length-1]).toFixed(1)+'" r="3.2" fill="#2563eb" stroke="#fff" stroke-width="2"/>'+
    xtext+'</svg>';
}
function donutChart(c){
  const R=52,SW=15,CX=64,CY=64,C0=2*Math.PI*R;
  const total=c.items.reduce((s,i)=>s+i.v,0)||1;
  let off=0,segs='';
  c.items.forEach((it,i)=>{
    const len=C0*it.v/total;
    const dash=Math.max(len-1.5,0);
    segs+='<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="'+CN[i%CN.length]+'" stroke-width="'+SW+
      '" stroke-dasharray="'+dash.toFixed(2)+' '+(C0-dash).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+
      '" transform="rotate(-90 '+CX+' '+CY+')"/>';
    off+=len;
  });
  return '<div class="donut-wrap"><svg viewBox="0 0 128 128">'+segs+
    '<text x="64" y="58" text-anchor="middle" style="font-size:11px;fill:#a1a1aa">'+esc(c.centerLabel||'')+'</text>'+
    '<text x="64" y="75" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#18181b">'+esc(c.center||'')+'</text></svg>'+
    '<div class="donut-legend">'+c.items.map((it,i)=>
      '<div class="dl-row"><i style="background:'+CN[i%CN.length]+'"></i><span class="nm">'+esc(it.k)+'</span><span class="vl">'+it.v+(c.pct===false?'':'%')+'</span></div>'
    ).join('')+'</div></div>';
}
function barChart(c){
  const max=Math.max.apply(null,c.items.map(i=>i.v))||1;
  return '<div class="bars">'+c.items.map((it,i)=>
    '<div class="bar-row"><span class="nm" title="'+esc(it.k)+'">'+esc(it.k)+'</span>'+
    '<span class="bar-track"><span class="bar-fill" style="width:'+(it.v/max*100).toFixed(1)+'%;opacity:'+(c.flat?'1':(1-i*0.11).toFixed(2))+'"></span></span>'+
    '<span class="vl">'+(c.fmt?c.fmt(it.v):it.v)+'</span></div>').join('')+'</div>';
}

function kpiHTML(k){

  const delta=flat?'<b class="flat">—</b>':'<b class="'+(k.good?'good':'bad')+'">'+(down?'↓':'↑')+' '+esc(raw)+'</b>';
  return '<div class="kpi"><span class="note">KPI</span><div class="kpi-l">'+esc(k.l)+'</div>'+
    '<div class="kpi-v">'+esc(k.v)+(k.cu?'<span class="cu">'+esc(k.cu)+'</span>':'')+'</div>'+
    '<div class="kpi-d">'+delta+(k.s?'<span>'+esc(k.s)+'</span>':'')+'</div></div>';

function chartHTML(c){
  let body='',chips='';
  if(c.type==='trend'){
    const m=c.metrics.find(x=>x.k===state.trend)||c.metrics[0];
    chips='<div class="chips">'+c.metrics.map(x=>
      '<button class="chip'+(x.k===m.k?' on':'')+'" data-trend="'+x.k+'">'+esc(x.name)+'</button>').join('')+'</div>';
    body=lineChart(Object.assign({},m,{xlabels:XL,legend:['本期','上一周期']}));
  } else if(c.type==='line') body=lineChart(c);
  else if(c.type==='donut') body=donutChart(c);
  else body=barChart(c);
  const legend=(c.legend||c.type==='trend')?'<div class="legend"><span><i style="background:#2563eb"></i>本期</span><span><i style="background:#c7cbd1"></i>上一周期</span></div>':'';
  return '<div class="card"><span class="note">'+esc(c.tag||'CHART')+'</span>'+

    chips+body+legend+'</div>';

function cellHTML(c,v,i){
  if(c.type==='rank') return '<td class="num muted">'+(i+1)+'</td>';
  if(c.type==='thumb'&&v&&v.name) return '<td><div class="thumb-cell"><span class="thumb" style="background:'+esc(v.color||'#2563eb')+'">'+esc(v.name.charAt(0))+'</span><span class="strong">'+esc(v.name)+'</span></div></td>';
  if(c.type==='badge'&&Array.isArray(v)) return '<td><span class="badge '+v[1]+'">'+esc(v[0])+'</span></td>';
  if(c.type==='link') return '<td><span class="lnk strong" data-drill="'+esc(c.drill||'')+'">'+esc(v)+'</span></td>';
  if(v==='—'||v==='暂无数据') return '<td'+(c.n?' class="num muted"':' class="muted"')+'>'+esc(v)+'</td>';
  return '<td'+(c.n?' class="num"':'')+'>'+esc(v)+'</td>';

function tableHTML(t){
  let rows=t.rows.slice();
  if(t.sortable&&state.sort){
    const key=state.sort;
    rows.sort((a,b)=>{
      const va=a[key],vb=b[key];
      const na=parseFloat(String(va).replace(/[^\d.-]/g,''))||0;
      const nb=parseFloat(String(vb).replace(/[^\d.-]/g,''))||0;
      return nb-na;
    });

  const head='<tr>'+t.cols.map(c=>'<th'+(c.n?' class="num"':'')+'>'+esc(c.t)+'</th>').join('')+'</tr>';
  const body=rows.map((r,i)=>'<tr>'+t.cols.map(c=>cellHTML(c,r[c.k],i)).join('')+'</tr>').join('');
  const chips=t.sortable?'<div class="chips">'+t.sortable.map(s=>
    '<button class="chip'+(state.sort===s.k?' on':'')+'" data-sort="'+s.k+'">'+esc(s.t)+'</button>').join('')+'</div>':'';
  return '<div class="tbl-panel"><span class="note">'+esc(t.tag||'TABLE')+'</span>'+
    '<div class="tbl-hd"><span class="t">'+esc(t.title)+'</span><span class="a">'+chips+
      (t.noExport?'<button class="btn" disabled>暂无明细可导出</button>':'<button class="btn" data-act="export">导出当前筛选明细</button>')+
      '</span></div>'+

    '<div class="tbl-ft"><span>'+esc(t.foot||'')+'</span><span>导出口径与页面一致 · 含时区与筛选条件</span></div></div>';

function normTag(s){ return String(s||'').trim().toLowerCase(); }

function objTagsOf(type,objId){ return TAGS.filter(t=>t.t===type && (TAG_BIND[t.id]||[]).indexOf(objId)>=0); }
function enabledTagsOf(type){ return TAGS.filter(t=>t.t===type && t.status==='ACTIVE'); }
function dupTagName(type,name,exceptId){ const n=normTag(name); return TAGS.some(t=>t.t===type && t.id!==exceptId && normTag(t.name)===n); }
function objRow(type,objId){
  if(type==='PACKAGED_PRODUCT') return PREPACK_ROWS.find(x=>x.id===objId);
  if(type==='MADE_TO_ORDER_PRODUCT') return FRESHMADE_ROWS.find(x=>x.id===objId);
  if(type==='MACHINE') return MACHINE_LIST_ROWS.find(x=>x.id===objId);
  if(type==='TENANT') return TENANT_LIST.find(x=>x.id===objId);
  if(type==='POINT') return POINT_LIST.find(x=>x.id===objId);
  return null;
}
function objRowsOf(type){
  return type==='MACHINE'?MACHINE_LIST_ROWS:
    type==='PACKAGED_PRODUCT'?PREPACK_ROWS:
    type==='MADE_TO_ORDER_PRODUCT'?FRESHMADE_ROWS:
    type==='TENANT'?TENANT_LIST:POINT_LIST;
}
function objName(type,objId){ const o=objRow(type,objId); return o?(o.name||o.code||objId):objId; }
function tagSourceLabel(){ if(state.sec==='catalog'){ return state.mod==='prepack'?{crumb:'商品 / 预包装商品',label:'预包装商品'}:{crumb:'商品 / 现制商品',label:'现制商品'}; } return {crumb:'机器 / 机器列表',label:'机器列表'}; }

function tagCellHTML(type,objId){
  const tags=objTagsOf(type,objId);
  if(!tags.length) return '<span class="muted">—</span>';
  const shown=tags.slice(0,2).map(t=>'<span class="tagpill'+(t.status==='INACTIVE'?' off':'')+'">'+esc(t.name)+(t.status==='INACTIVE'?' <em>停用</em>':'')+'</span>').join('');
  const more=tags.length>2?'<span class="tagpill more">+'+ (tags.length-2)+'</span>':'';
  return '<div class="tagcell">'+shown+more+'</div>';
}
function tagListFilterHTML(type){
  const enabled=enabledTagsOf(type);
  const filt=TAG.objFilter[type]||{};
  const sel=Object.keys(filt).filter(k=>filt[k]);

  const items= enabled.length? enabled.map(t=>'<label class="bopt"><input type="checkbox" data-tagfilter="'+t.id+'"'+(filt[t.id]?' checked':'')+'><span>'+esc(t.name)+'</span></label>').join('')

    Array.from({length:pages},(_,i)=>i+1).map(n=>'<button class="pg'+(n===cur?' cur':'')+'" data-'+attr+'="'+n+'">'+n+'</button>').join('')+
    '<button class="pg" data-'+attr+'="'+(cur+1)+'"'+(cur>=pages?' disabled':'')+' aria-label="下一页">›</button></span>';
}

  const head='<tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr>';

  if(kind==='enable'){ ids.forEach(id=>{const t=TAGS.find(x=>x.id===id); if(t){t.status='ACTIVE'; t.updated=todayStr();}}); toast('已启用 '+ids.length+' 个标签'); TAG.sel={}; rerender(); return; }

function objTagSave(){

function objTagApply(){

function objTagRemove(){

window.addEventListener('message', function(e){
  var d=e.data;
  if(!d||typeof d!=='object') return;
  if(d.type==='mdr-close'){ closeMdr(); }
  else if(d.type==='mdr-toast'&&typeof toast==='function'&&d.text){ toast(String(d.text)); }
});
function closeMdr(){
  var host=document.getElementById('mdrHost');
  MDR.id=null;
  if(!host){ document.body.classList.remove('mdr-open'); return; }
  host.dataset.open='0';
  var mask=host.querySelector('.mdr-mask'), pane=host.querySelector('.mdr');
  if(mask)mask.classList.remove('on');
  if(pane)pane.classList.remove('on');
  setTimeout(function(){
    if(host.isConnected && host.dataset.open!=='1'){
      host.innerHTML='';
      document.body.classList.remove('mdr-open');
    }
  },280);
}

/* ------------------------------------------------------------
   机器模板：第一步基本信息（名称 / 类型 / 品牌 / 型号）
             第二步按所选型号配置料仓（料仓类型取自该型号已关联的组件 / 容积 / 排序）
   ------------------------------------------------------------ */
const MTPL_TYPES=['开门柜','售卖机','咖啡机'];
/* 料仓类型 = 该型号已关联的组件，选项数量与型号组件数一致 */
function mtplCompsOf(modelId){
  return DC_LINK.filter(l=>l[0]===modelId).map(l=>dcCompOf(l[1])).filter(Boolean);
}
function mtplCompOptions(modelId,sel){
  const list=mtplCompsOf(modelId);
  if(!list.length) return '<option value="">该型号暂无适配组件</option>';
  return list.map(c=>
    '<option value="'+c.id+'"'+(sel===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('');
}
function mtplBinLabel(b){ const c=dcCompOf((b&&(b.comp||b.type))||''); return c?c.name:'—'; }

  {id:'T-1001',name:'WSD 咖啡标准模板',type:'咖啡机',brand:'B-WSD',model:'M-WSD1008',updated:'2026-11-20',
    bins:[{id:'b1',comp:'C-MIXL',measure:'计量',volume:'2',sort:1},{id:'b2',comp:'C-MIXR',measure:'计量',volume:'2',sort:2},{id:'b3',comp:'C-BEAN',measure:'不计量',volume:'',sort:3}]},

    bins:[{id:'b6',comp:'C-PUMP',measure:'计量',volume:'8',sort:1},{id:'b7',comp:'C-GRIND',measure:'计量',volume:'6',sort:2}]},

function mtplNewId(){ return 'T-'+Date.now()+'-'+Math.floor(Math.random()*1000); }
function mtplFocus(sel){
  rerender(); const el=document.querySelector(sel);
  if(el){ el.focus(); try{el.setSelectionRange(el.value.length,el.value.length);}catch(err){} }
}
function mtplFilteredRows(){
  let list=MACHINE_TPL.slice();
  if(MTPL.q){ const q=MTPL.q.toLowerCase(); list=list.filter(t=>t.name.toLowerCase().indexOf(q)>=0); }
  if(MTPL.type) list=list.filter(t=>t.type===MTPL.type);
  if(MTPL.brand) list=list.filter(t=>t.brand===MTPL.brand);
  return list;
}
function mtplModelOptions(brand,sel){
  const list=DC_MODEL.filter(m=>!brand||m.brand===brand);
  if(!list.length) return '<option value="">该品牌暂无型号</option>';
  return '<option value="">请选择型号</option>'+list.map(m=>
    '<option value="'+m.id+'"'+(sel===m.id?' selected':'')+'>'+esc(m.name)+'</option>').join('');

function mtplOpenEdit(id,step){
  const t=id==='NEW'?null:MACHINE_TPL.find(x=>x.id===id);
  MTPL.edit=t?{id:t.id,name:t.name,type:t.type,brand:t.brand,model:t.model,
    bins:t.bins.map((b,i)=>({id:b.id,comp:b.comp||b.type||'',measure:b.measure||'计量',volume:b.volume,sort:b.sort}))}
    :{id:'NEW',name:'',type:'',brand:DC_BRAND[0]?DC_BRAND[0].id:'',model:'',bins:[]};
  MTPL.step=step||1; MTPL.confirm=null; MTPL.view=null; rerender();
  if(MTPL.step===1){ const inp=document.querySelector('[data-mtplname]'); if(inp) inp.focus(); }
}
function mtplSave(){
  const e=MTPL.edit; if(!e) return;
  if(!e.name.trim()){ MTPL.step=1; rerender(); toast('请填写模板名称'); return; }
  if(!e.brand||!e.model){ MTPL.step=1; rerender(); toast('请选择品牌与型号'); return; }
  mtplReindex();
  const today='2026-11-21', bins=e.bins.map(b=>({id:b.id,comp:b.comp||b.type||'',measure:b.measure||'计量',
    volume:(b.measure||'计量')==='不计量'?'':b.volume,sort:b.sort}));
  if(e.id==='NEW'){
    MACHINE_TPL.unshift({id:mtplNewId(),name:e.name.trim(),type:e.type,brand:e.brand,model:e.model,updated:today,bins:bins});
  }else{
    const t=MACHINE_TPL.find(x=>x.id===e.id);
    if(t){ t.name=e.name.trim(); t.type=e.type; t.brand=e.brand; t.model=e.model; t.updated=today; t.bins=bins; }
  }
  MTPL.edit=null; MTPL.step=1; MTPL.page=1; rerender(); toast('机器模板已保存');
}
function mtplAutoBins(){
  const e=MTPL.edit; if(!e||!e.model) return;
  const comps=mtplCompsOf(e.model);
  if(!comps.length){ toast('该型号暂无适配组件，请先在「品牌型号与组件」中关联组件'); return; }
  let added=0;
  comps.forEach(c=>{
    if(!e.bins.some(b=>(b.comp||b.type||'')===c.id)){
      e.bins.push({id:mtplNewId(),comp:c.id,measure:'计量',volume:'',sort:e.bins.length+1}); added++;
    }
  });
  mtplReindex(); rerender();
  toast(added?('已带入 '+added+' 个组件，请填写容积'):'该型号的组件已全部配置');
}

function renderBody(d){
  const kpiN=d.kpis?d.kpis.length:0;
  const kpiCols=kpiN%5===0?5:(kpiN%3===0?3:4);
  return (d.kpis?'<div class="kpis" style="grid-template-columns:repeat('+kpiCols+',minmax(0,1fr))">'+d.kpis.map(kpiHTML).join('')+'</div>':'')+
    (d.currency?currencyHTML(d.currency):'')+
    (d.charts?'<div class="charts">'+d.charts.map(chartHTML).join('')+'</div>':'')+
    (d.matrix?matrixHTML(d.matrix):'')+
    (d.tables?tableHTML(d.tables[state.subtab||'point']):(d.table?tableHTML(d.table):''))+
    calloutsHTML(d.callouts);
}
/* ---- Root 渲染（图形化总览） ---- */
function rootNum(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function rootPct(on,dev){ return dev?(on/dev*100).toFixed(1)+'%':'—'; }
function rootKPI(l,v,u){
  return '<div class="kpi"><div class="kpi-l">'+esc(l)+'</div><div class="kpi-v">'+esc(v)+
    (u?'<span class="cu">'+esc(u)+'</span>':'')+'</div></div>';
}
function rootCols(def){
  return def.map((d,i)=>({t:d[0],n:!!d[1],link:!!d[2]||i===0,badge:!!d[3]}));
}
function rootTable(t){
  const head='<tr>'+t.cols.map(c=>'<th'+(c.n?' class="num"':'')+'>'+esc(c.t)+'</th>').join('')+'</tr>';
  const body=t.rows.map(r=>'<tr>'+t.cols.map((c,i)=>{
    const v=r[i];
    if(c.badge){
      const cls=v==='高'?'danger':(v==='中'?'warn':'muted');
      return '<td><span class="badge '+cls+'">'+esc(v)+'</span></td>';
    }
    if(c.link&&v!=='—') return '<td'+(c.n?' class="num"':'')+'><span class="lnk strong" data-drill="root:'+esc(v)+'">'+esc(v)+'</span></td>';
    if(v==='—'||v==='') return '<td'+(c.n?' class="num muted"':' class="muted"')+'>—</td>';
    const sv=(c.n&&typeof v==='number')?rootNum(v):v;
    return '<td'+(c.n?' class="num"':'')+'>'+esc(sv)+'</td>';
  }).join('')+'</tr>').join('');
  if(t.bare) return '<div class="tbl-wrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
  return '<div class="tbl-panel root-tbl">'+
    '<div class="tbl-hd"><span class="t">'+esc(t.title)+(t.count?'<span class="tn">'+esc(t.count)+'</span>':'')+'</span>'+
    '<span class="a"><button class="btn" data-act="export">导出</button></span></div>'+
    '<div class="tbl-wrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
    (t.foot?'<div class="tbl-ft"><span>'+esc(t.foot)+'</span><span></span></div>':'')+'</div>';
}
/* 横向条：宽度 = v/max；v2 为条内深色段（如在线数） */
function rbar(o){
  const max=o.max||1;
  const w=Math.max(o.v/max*100,0.8);
  const dual=(o.v2!=null&&o.v!=null);
  const inner=dual?'<span class="fi" style="width:'+(o.v?(o.v2/o.v*100):0).toFixed(1)+'%"></span>':'';
  const bg=dual?'':'background:'+(o.tone==='bad'?'#e79a9a':'var(--accent)');
