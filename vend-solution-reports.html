  return '<div class="rlist">'+rows.map(r=>'<div class="rbar'+(fault?' bad':'')+'" title="'+esc(fault?r[0]:(r[2]||r[0]))+' '+rfmt(r[idx])+'"><span class="nm">'+esc(fault?r[0]:(r[2]||r[0]))+'</span><span class="tr"><span class="fl" style="width:'+(r[idx]/max*100).toFixed(1)+'%"></span></span><span class="vl">'+rfmt(r[idx])+'</span></div>').join('')+'</div>';
}
function rootAnalysis(role,ci){
  const tab=state.rootTab||'country';
  let rows=(tab==='country'?RCOUNTRY:tab==='maker'?RMAKER:tab==='model'?RMODEL:RFAULT)[role].map(r=>r.slice());
  if(ci&&tab==='country') rows=rows.filter((r,i)=>i===ci-1);
  else if(ci){const share=[.3,.33,.15,.22][ci-1];rows=rows.map(r=>r.map((v,i)=>i>0&&typeof v==='number'?Math.round(v*share):v));}
  let graphic,cols,data;
  if(tab==='country'){
    graphic=rootDonut(rows);cols=['国家','设备数','在线数','在线率','故障数'];data=rows.map(r=>[r[0],r[1],r[2],rootPct(r[2],r[1]),r[3]]);
  }else if(tab==='maker'){
    graphic=rootBars(rows);cols=['制造商','设备数','在线数','在线率','故障数'];data=rows.map(r=>[r[0],r[1],r[2],rootPct(r[2],r[1]),r[3]]);
  }else if(tab==='model'){
    graphic=rootBars(rows,false,true);cols=['设备类型','制造商','型号','设备数','在线数','故障数'];data=rows;
  }else{
    graphic=rootBars(rows,true);cols=['故障类型','故障设备数','故障事件数','影响等级'];data=rows;
  }
  return '<div class="ranalysis"><div class="tabs">'+[['country','按国家'],['maker','按制造商'],['model','按型号'],['fault','按故障']].map(t=>'<div class="tab'+(tab===t[0]?' active':'')+'" data-rtab="'+t[0]+'">'+t[1]+'</div>').join('')+'</div>'+graphic+'<div class="rtable-title">'+(tab==='fault'?'故障类型 Top 5':'设备运行明细')+'</div>'+rootTable({bare:true,cols:cols.map((c,i)=>({t:c,n:i>0&&!(tab==='model'&&i<3)&&!(tab==='fault'&&i===3),badge:tab==='fault'&&i===3})),rows:data})+'</div>';
}
function rootLine(f){
  const len=[1,7,30,30,30][f.pi],W=680,H=228,pl=46,pr=16,pt=16,pb=30,base=f.dev[0],on=f.dev[1];
  const total=Array.from({length:len},(_,i)=>Math.round(len===1?base:base-len*1.5+i*1.5+Math.sin(i/3)*4)),online=Array.from({length:len},(_,i)=>Math.round(len===1?on:total[i]*on/base+Math.sin(i/2.5)*6));
  const lo=Math.floor((Math.min.apply(null,online)-70)/500)*500,hi=Math.ceil((Math.max.apply(null,total)+60)/500)*500,x=i=>pl+(W-pl-pr)*i/Math.max(1,len-1),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g='';for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4,yy=y(v);g+='<line x1="'+pl+'" y1="'+yy+'" x2="'+(W-pr)+'" y2="'+yy+'" stroke="#eef0f3"/><text x="'+(pl-9)+'" y="'+(yy+3)+'" text-anchor="end" style="font-size:10px;fill:#a1a1aa">'+rfmt(Math.round(v))+'</text>';}
  const line=(a,c)=>'<polyline fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="'+a.map((v,i)=>x(i)+','+y(v)).join(' ')+'"/>';
  let labels='';[0,.25,.5,.75,1].forEach(p=>{const i=Math.round((len-1)*p);labels+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" style="font-size:10px;fill:#a1a1aa">'+(f.pi===0?'当前':(i+1)+'日')+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="设备总数与在线设备趋势">'+g+labels+line(total,'#2563eb')+line(online,'#93c5fd')+'<circle cx="'+x(len-1)+'" cy="'+y(total[len-1])+'" r="3" fill="#2563eb"/><circle cx="'+x(len-1)+'" cy="'+y(online[len-1])+'" r="3" fill="#93c5fd"/></svg><div class="rlegend"><span><i style="background:#2563eb"></i>设备总数</span><span><i style="background:#93c5fd"></i>在线设备</span></div>';
}
function rootBusiness(f){
  const len=[1,7,30,30,30][f.pi],W=680,H=228,pl=46,pr=16,pt=16,pb=30,smax=Math.max(f.dev[3],f.dev[4])/len,hi=Math.max(10,Math.ceil(smax*1.3/1000)*1000),x=i=>pl+(W-pl-pr)*(i+.5)/len,y=v=>pt+(H-pt-pb)*(1-v/hi),bw=Math.min(12,(W-pl-pr)/len*.25);
  let g='';for(let i=0;i<5;i++){const v=hi*i/4,yy=y(v);g+='<line x1="'+pl+'" y1="'+yy+'" x2="'+(W-pr)+'" y2="'+yy+'" stroke="#eef0f3"/><text x="'+(pl-9)+'" y="'+(yy+3)+'" text-anchor="end" style="font-size:10px;fill:#a1a1aa">'+rfmt(Math.round(v))+'</text>';}
  let bars='';for(let i=0;i<len;i++){const sv=Math.round(f.dev[3]/len*(.86+((i*7)%9)/25)),bv=Math.round(f.dev[4]/len*(.88+((i*5)%8)/26)),xx=x(i);bars+='<rect x="'+(xx-bw-2)+'" y="'+y(sv)+'" width="'+bw+'" height="'+(H-pb-y(sv))+'" rx="1.5" fill="#2563eb"><title>'+(i+1)+'日 · 成功售卖 '+rfmt(sv)+'</title></rect><rect x="'+(xx+2)+'" y="'+y(bv)+'" width="'+bw+'" height="'+(H-pb-y(bv))+'" rx="1.5" fill="#93c5fd"><title>'+(i+1)+'日 · 成功制作 '+rfmt(bv)+'</title></rect>';}
  let labels='';[0,.25,.5,.75,1].forEach(p=>{const i=Math.round((len-1)*p);labels+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" style="font-size:10px;fill:#a1a1aa">'+(f.pi===0?'当前':(i+1)+'日')+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="成功售卖与成功制作趋势">'+g+bars+labels+'</svg><div class="rlegend"><span><i style="background:#2563eb"></i>成功售卖</span><span><i style="background:#93c5fd"></i>成功制作</span></div>';
}

  if(!MX.edit)return;
  const {ri,li,val}=MX.edit,r=mxFind(MX.field).rows[ri],loc=MX_L[li],v=val.trim();
  if(v) r.cells[loc]={t:v,by:'manual'}; else delete r.cells[loc];

function mxRunAI(scope){
  const fields=scope==='page'?[MX.field]:MX_FIELDS.flatMap(c=>c.children).flatMap(g=>g.leaves.map(f=>f.id));
  let n=0;
  fields.forEach(fid=>mxFind(fid).rows.forEach(r=>{
    if(r.grp)return;
    MX_T.forEach(l=>{ if(!r.cells[l]&&MX_AI[r.src]&&MX_AI[r.src][l]){ r.cells[l]={t:MX_AI[r.src][l],by:'ai'}; n++; } });
  }));
  MX.aiPop=false; MX.busy=false; mxRender();
  toast('已翻译 '+n+' 项'+(scope==='page'?'（仅本页）':'（全局）'));
}

function locStatusBadge(s){
  if(s==='ok') return '<span class="badge ok">已翻译</span>';
  if(s==='out') return '<span class="badge warn">待确认</span>';
  if(s==='partial') return '<span class="badge warn">部分</span>';
  return '<span class="badge muted">未翻译</span>';
}
function locItemStatus(it,locale){
  if(locale==='en-US') return 'ok';
  const t=it.tr[locale], o=it.out&&it.out[locale], fields=LOC_FIELDS[it.type];
  let outdated=false; fields.forEach(f=>{ if(o&&o[f]) outdated=true; });
  if(outdated) return 'out';
  let done=0; fields.forEach(f=>{ if(t&&t[f]) done++; });
  if(done===fields.length) return 'ok';
  if(done===0) return 'miss';
  return 'partial';
}
function locTermResolve(map,k,id){
  if(!map) return {v:'(未配置)',fb:false};
  if(LOC.termMiss && id==='PROD_002' && k!=='en'){ if(map.en!==undefined) return {v:map.en,fb:true,fbFrom:'en-US'}; return {v:'(未翻译)',fb:false}; }
  if(map[k]!==undefined) return {v:map[k],fb:false};
  if(map.en!==undefined) return {v:map.en,fb:true,fbFrom:'en-US'};
  return {v:'(未翻译)',fb:false};
}

/* 6.5.2 翻译管理 */
function locTranslate(){
  const tLang=LOC.tLang, q=LOC.q.trim().toLowerCase();
  let items=LOC_ITEMS.filter(it=>{
    if(LOC.entity!=='All' && it.type!==LOC.entity) return false;
    if(q){ const hay=(it.id+' '+it.src.name+' '+((it.tr[tLang]&&it.tr[tLang].name)||'')).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }).filter(it=>{
    if(LOC.status==='All') return true;
    const s=locItemStatus(it,tLang);
    if(LOC.status==='ok') return s==='ok';
    if(LOC.status==='out') return s==='out';
    if(LOC.status==='miss') return s==='miss'||s==='partial';
    return true;
  });
  const total=items.length;
  const tr=items.filter(it=>locItemStatus(it,tLang)==='ok').length;
  const miss=items.filter(it=>{const s=locItemStatus(it,tLang);return s==='miss'||s==='partial';}).length;
  const out=items.filter(it=>locItemStatus(it,tLang)==='out').length;
  const ov='<div class="loc-grid">'+
    '<div class="loc-ov"><div class="l">总条目</div><div class="v">'+total+'</div><div class="d">当前筛选范围</div></div>'+
    '<div class="loc-ov"><div class="l">已翻译</div><div class="v ok">'+tr+'</div><div class="d">源内容未变化</div></div>'+
    '<div class="loc-ov"><div class="l">缺失 / 部分</div><div class="v muted">'+miss+'</div><div class="d">需补充翻译</div></div>'+
    '<div class="loc-ov"><div class="l">待确认</div><div class="v warn">'+out+'</div><div class="d">源内容已变化</div></div></div>';
  const langOpts=TENANT_LANGS.filter(l=>l.enabled).map(l=>'<option value="'+l.locale+'"'+(l.locale===tLang?' selected':'')+'>'+esc(l.name)+' · '+esc(l.locale)+'</option>').join('');
  const entOpts=[['All','全部类型'],['Product','商品'],['Category','分类'],['Ingredient','原料'],['Option','选项'],['Option Value','选项值'],['Tag','标签']].map(o=>'<option value="'+o[0]+'"'+(o[0]===LOC.entity?' selected':'')+'>'+o[1]+'</option>').join('');
  const stOpts=[['All','全部状态'],['ok','已翻译'],['miss','未翻译'],['out','待确认']].map(o=>'<option value="'+o[0]+'"'+(o[0]===LOC.status?' selected':'')+'>'+o[1]+'</option>').join('');
  const filters='<div class="filterbar"><span class="fitem">语言 <select data-loc-tlang>'+langOpts+'</select></span>'+
    '<span class="fitem">实体类型 <select data-loc-entity>'+entOpts+'</select></span>'+
    '<span class="fitem">翻译状态 <select data-loc-status>'+stOpts+'</select></span>'+
    '<span class="fitem">搜索 <input data-loc-search value="'+esc(LOC.q)+'" placeholder="按名称 / ID 搜索" style="height:36px;border:1px solid var(--ds-border-input);border-radius:var(--r-sm);padding:0 11px;font-family:inherit;font-size:13px;width:180px"></span>'+
    '<span class="fbar-spacer"></span><span class="fbar-meta">字段级状态 · 不影响业务数据</span></div>';
  const rows=items.map(it=>{
    const s=locItemStatus(it,tLang);
    const t=it.tr[tLang];
    const tname=(tLang==='en-US'||(t&&t.name))?esc(tLang==='en-US'?it.src.name:t.name):'<span class="missing">[Missing]</span>';
    return '<tr><td><span class="badge muted">'+esc(it.type)+'</span></td>'+
      '<td><div class="strong">'+esc(it.src.name)+'</div><div class="sub muted" style="font-size:11px">'+esc(it.id)+'</div></td>'+
      '<td>'+tname+'</td>'+
      '<td>'+locStatusBadge(s)+'</td>'+
      '<td><button class="btn" data-loc-edit="'+it.id+'">查看 / 编辑</button></td></tr>';
  }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:24px">无匹配条目</td></tr>';
  let html='<div class="page">'+locHead('翻译管理','Translation Management','在一个页面集中检查、维护不同语言的翻译内容。')+
    filters+ov+
    '<div class="tbl-panel"><div class="tbl-hd"><span class="t">翻译条目</span><span class="a"><span class="fbar-meta">目标语言：'+esc(tLang)+'</span></span></div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>实体类型</th><th>源内容 (en-US)</th><th>翻译 ('+esc(tLang)+')</th><th>状态</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="tbl-ft"><span>显示 '+items.length+' 条</span><span>Translation Status：Translated / Untranslated / Outdated</span></div></div>';
  if(LOC.edit) html+=locEditDrawer(LOC.edit);
  html+='</div>';
  return html;
}

/* 6.5.3 商品本地化 */
function locProduct(){
  const L=LOC.prodLang, isSrc=L==='en-US', k=LOC_KEY[L], P=PROD_DETAIL;
  let total=0, done=0; const chk=v=>{ total++; if(v!==undefined) done++; };
  chk(LOC_PROD[P.id][k]); chk(LOC_PROD_DESC[P.id][k]); chk(LOC_CAT[P.cat][k]);
  P.optGroups.forEach(([oc,vals])=>{ chk(LOC_OPT[oc][k]); vals.forEach(v=>chk(LOC_OPTVAL[v][k])); });
  P.tags.forEach(t=>chk(LOC_TAG[t][k]));
  const pct=Math.round(done/total*100);
  const tg=(val,type,code,field)=>{
    if(isSrc) return '<span class="src">'+esc(val!==undefined?val:'')+'</span>';
    return '<div class="tgt"><input data-prod-input="'+type+'|'+code+'|'+field+'" value="'+esc(val!==undefined?val:'')+'" placeholder="未翻译"></div>';
  };
  const info='<div class="loc-block"><div class="blk-h">商品信息</div>'+
    '<div class="loc-row"><div class="lab">商品名称<small>Product Name</small></div><div class="src">'+esc(LOC_PROD[P.id].en)+'</div>'+tg(LOC_PROD[P.id][k],'prod',P.id,'name')+'</div>'+
    '<div class="loc-row"><div class="lab">商品描述<small>Description</small></div><div class="src">'+esc(LOC_PROD_DESC[P.id].en)+'</div>'+tg(LOC_PROD_DESC[P.id][k],'prod',P.id,'desc')+'</div></div>';
  const cat='<div class="loc-block"><div class="blk-h">商品分类</div>'+
    '<div class="loc-row"><div class="lab">'+esc(LOC_CAT[P.cat].en)+'<small>Category</small></div><div class="src">'+esc(LOC_CAT[P.cat].en)+'</div>'+tg(LOC_CAT[P.cat][k],'cat',P.cat,'name')+'</div></div>';
  const optHtml=P.optGroups.map(([oc,vals])=>{
    let s='<div class="loc-block"><div class="blk-h">'+esc(LOC_OPT[oc].en)+' · '+esc(oc)+'</div>';
    s+='<div class="loc-row"><div class="lab">'+esc(LOC_OPT[oc].en)+'<small>Option</small></div><div class="src">'+esc(LOC_OPT[oc].en)+'</div>'+tg(LOC_OPT[oc][k],'opt',oc,'name')+'</div>';
    vals.forEach(v=>{ s+='<div class="loc-row"><div class="lab">'+esc(LOC_OPTVAL[v].en)+'<small>'+esc(v)+'</small></div><div class="src">'+esc(LOC_OPTVAL[v].en)+'</div>'+tg(LOC_OPTVAL[v][k],'optval',v,'name')+'</div>'; });
    s+='</div>'; return s;
  }).join('');
  const tagHtml='<div class="loc-block"><div class="blk-h">商品标签</div>'+P.tags.map(t=>'<div class="loc-row"><div class="lab">'+esc(LOC_TAG[t].en)+'<small>'+esc(t)+'</small></div><div class="src">'+esc(LOC_TAG[t].en)+'</div>'+tg(LOC_TAG[t][k],'tag',t,'name')+'</div>').join('')+'</div>';
  const langOpts=TENANT_LANGS.filter(l=>l.enabled).map(l=>'<option value="'+l.locale+'"'+(l.locale===L?' selected':'')+'>'+esc(l.name)+' · '+esc(l.locale)+'</option>').join('');
  const head=locHead('商品本地化','Product Localization · '+esc(P.id),'<label class="fitem">目标语言 <select class="role-sel" data-prod-lang>'+langOpts+'</select></label>');
  const completion='<div class="loc-default"><div><div class="lbl">翻译完成度（'+esc(L)+'）</div><div class="val">'+pct+'% <small>'+done+' / '+total+' 字段</small></div></div><div class="loc-completion" style="flex:1;max-width:320px"><div class="loc-bar"><i style="width:'+pct+'%"></i></div></div></div>';
  let html='<div class="page">'+head+completion+info+cat+optHtml+tagHtml;
  if(!isSrc) html+='<div style="margin-top:4px"><button class="btn accent" data-prod-save>保存更改</button></div>';
  html+='</div>';
  return html;
}

function trNow(){
  const d=new Date(), p=function(n){ return String(n).length<2?'0'+n:String(n); };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function trAIText(f,loc){
  const src=String(f.source||'');
  if(f.protect) return src;
  if(loc==='en-US') return src.split('\n').map(function(l){ return TR_AI_DICT[l.trim()]||l.trim(); }).join('\n');
  const pre={'ja-JP':'日本語：','zh-TW':'繁體：','th-TH':'ไทย：'};
  return (pre[loc]||'['+loc+'] ')+src;
}
function trStartAI(mode){
  if(!TR.edit||TR.ai) return;
  const res=trRes(TR.edit.id), loc=TR.target;
  let fields=trFields(res);
  if(mode==='all'){
    fields=fields.filter(function(f){ const r=trRec(res.id,f.key,loc); return !r||!r.v||r.src!=='人工'; });
  }else if(mode.indexOf('sec:')===0){
    const k=mode.slice(4); fields=fields.filter(function(f){ return f.key===k||f.parent===k; });
  }else{
    fields=fields.filter(function(f){ return f.key===mode; });
  }
  if(!fields.length){ toast('没有可翻译的字段'); return; }
  const manual=fields.filter(function(f){ const r=trRec(res.id,f.key,loc); return r&&r.v&&r.src==='人工'; });
  TR.pending=fields.map(function(f){ return f.key; });
  if(manual.length){ TR.confirm={kind:'ai'}; rerender(); return; }
  trAIRun(TR.pending);
}
function trAIRun(keys){
  const res=trRes(TR.edit.id), loc=TR.target;
  TR.ai={keys:keys}; TR.pending=null; TR.confirm=null; rerender();
  setTimeout(function(){
    keys.forEach(function(k){
      const f=trFields(res).find(function(x){ return x.key===k; });
      if(f){ TR.draft[k]=trAIText(f,loc); TR.draftSrc[k]='AI'; }
    });
    TR.ai=null; TR.dirty=true; rerender();
    toast('已完成 '+keys.length+' 个字段的 AI 翻译');
  },650);
}
function trSave(){
  if(!TR.edit) return;
  const res=trRes(TR.edit.id), loc=TR.target;
  let n=0;
  trFields(res).forEach(function(f){
    const k=trKey(res.id,f.key,loc), v=String(TR.draft[f.key]!==undefined?TR.draft[f.key]:'').trim();
    if(v){
      TR_RECORDS[k]={v:v,st:'translated',src:TR.draftSrc[f.key]||'人工',digest:trDigest(f.source),at:trNow()};
      n++;
    }else delete TR_RECORDS[k];
  });
  TR.draft={}; TR.draftSrc={}; TR.dirty=false; rerender(); toast('已保存 '+n+' 条翻译');
}

  TR.draft={}; TR.draftSrc={}; TR.dirty=false; TR.ai=null; rerender(); toast('已放弃未保存的修改');

  const tabs=mod.tabs;
  const tabBar=tabs.length?'<div class="tabs">'+tabs.map(([id,name])=>
    '<div class="tab'+(id===state.tab?' active':'')+'" data-tab="'+id+'">'+esc(name)+'</div>').join('')+'</div>':'';
  let subBar='',body;
  if(data.views){
    const active=(data.views.find(x=>x[0]===state.subtab)||data.views[0])[0];
    subBar='<div class="chips" style="margin-bottom:12px">'+data.views.map(([id,name])=>
      '<button class="chip'+(id===active?' on':'')+'" data-subtab="'+id+'">'+esc(name)+'</button>').join('')+'</div>';
    body=renderBody(data.views.find(x=>x[0]===active)[2]);
  }else{
    subBar=(data.subtabs)?'<div class="chips" style="margin-bottom:12px">'+data.subtabs.map(([id,name])=>
      '<button class="chip'+(state.subtab===id?' on':'')+'" data-subtab="'+id+'">'+esc(name)+'</button>').join('')+'</div>':'';
    body=data.locked?lockedHTML(state.mod,state.tab):(data.builder?builderHTML():renderBody(data));
  }
  const canExport=!(data.locked||data.builder);
  const fkeys=data.filters||((data.locked||data.builder)?F_LITE:F_BASE);
  return '<div class="page">'+
    '<div class="page-hd"><div><div class="ttl"><h2>'+esc(title)+'</h2><span class="pri '+pri.toLowerCase()+'">'+pri+'</span></div>'+
    (desc?'<p>'+esc(desc)+'</p>':'')+'</div>'+
    '<div class="hd-act">'+(canExport
      ? '<button class="btn accent" data-act="export">导出当前报表</button>'
      : '<button class="btn" disabled>暂无可导出数据</button>')+'</div></div>'+
    tabBar+filtersHTML(fkeys)+subBar+body+'</div>';
}

function currentSec(){ return SECTIONS[state.sec]||SECTIONS.analytics; }

function renderNav(){
  const sec=currentSec();
  let list=sec.subs, sub=sec.sub, foot=sec.foot;
  if(state.role==='root' && state.sec==='analytics'){
    list=[{id:'platform',name:'平台总览',pri:'P0'}]; sub='租户 · 设备 · 业务 · 故障'; foot='全平台数据<br />不含消费者个人信息';
  }
  document.getElementById('subnavHd').textContent=(state.role==='root'&&state.sec==='analytics')?'平台级视图':sec.name;
  document.getElementById('subnavSub').textContent=sub;
  document.getElementById('subFoot').innerHTML=foot;
  const actMod=(state.sec==='settings'&&(state.mod==='lang'||state.mod==='matrix'))?'lang':state.mod;
  document.getElementById('subItems').innerHTML=list.map(m=>
    '<div class="sub-item'+(m.id===actMod?' active':'')+'" data-mod="'+m.id+'"><span>'+esc(m.name)+'</span></div>').join('');
  document.querySelectorAll('.nav-item[data-mod]').forEach(n=>n.classList.toggle('active', n.dataset.mod===state.sec));
  document.querySelectorAll('.nav-child[data-catsub]').forEach(n=>n.classList.toggle('active', state.sec==='catalog'&&n.dataset.catsub===state.mod));
  const catalog=state.sec==='catalog';
  document.body.classList.toggle('catalog-inline',catalog);
  const catalogNav=document.querySelector('.nav-item[data-mod="catalog"]');
  if(catalogNav) catalogNav.classList.toggle('catalog-open',catalog);
  if(state.role==='root') document.querySelectorAll('.sub-item .pri').forEach(e=>e.textContent='ROOT');
}

function contentHTML(){
  if(state.tagOpen) return tagsPage();
  if(SET.open) return settingsPage();
  if(state.sec==='devicecfg') return deviceConfigPage();
  if(state.sec==='settings') return (state.mod==='lang'||state.mod==='matrix')?localizationPage():tagGroupAdminPage();
  if(state.role==='root') return pageHTML();
  if(state.sec==='analytics') return pageHTML();
  if(state.sec==='catalog') return state.mod==='freshmadeui'?oldUIPage():catalogPage();
  if(state.sec==='machine') return state.mod==='template'?machineTemplatePage():machinePage();
  return '';
}

function render(){
  document.body.classList.remove('mdr-open');
  if(state.tagOpen){
    const sl=tagSourceLabel();
    document.getElementById('crumbs').innerHTML=sl.crumb+' / <b>标签管理</b>';
    document.title='VendSolution · 标签管理';
    document.getElementById('roleSel').value=state.role;
    renderNav();
    document.getElementById('content').innerHTML=contentHTML();
    window.scrollTo(0,0);
    return;
  }
  if(SET.open){
    const sl=tagSourceLabel();
    document.getElementById('crumbs').innerHTML=sl.crumb+' / <b>标签设置</b>';
    document.title='VendSolution · 标签设置';
    document.getElementById('roleSel').value=state.role;
    renderNav();
    document.getElementById('content').innerHTML=contentHTML();
    window.scrollTo(0,0);
    return;
  }
  const sec=currentSec();
  let crumb,title;
  if(state.sec==='devicecfg'){
    const sub=sec.subs.find(s=>s.id===state.mod);
    crumb=sec.name+' / <b>'+esc(sub?sub.name:'')+'</b>'; title='VendSolution · '+sec.name;
  }else if(state.role==='root'){
    crumb='报表与分析 / <b>平台总览</b>'; title='VendSolution · 平台总览';
  }else if(state.sec==='analytics'){
    const m=MODULES.find(x=>x.id===state.mod);
    const tname=m?m.tabs.find(t=>t[0]===state.tab)||['','']:'';
    crumb=sec.name+' / <b>'+esc(m?m.name:'')+'</b> / '+esc(tname[1]);
    title='VendSolution · '+(m?m.name:'')+(tname[1]?' / '+tname[1]:'');
  }else{
    const subId=(state.sec==='settings'&&(state.mod==='lang'||state.mod==='matrix'))?'lang':state.mod;
    const sub=sec.subs.find(s=>s.id===subId);
    crumb=sec.name+' / <b>'+esc(sub?sub.name:'')+'</b>';
    title='VendSolution · '+esc(sub?sub.name:sec.name);
  }
  document.getElementById('crumbs').innerHTML=crumb;
  document.title=title;
  document.getElementById('roleSel').value=state.role;
  renderNav();
  document.getElementById('content').innerHTML=contentHTML();
  if(state.role==='admin' && state.sec==='analytics' && state.mod==='custom') updateBuilder();
  location.hash=state.role==='root'?'#/analytics/platform/'+state.rootRole+'/'+state.rootTab
    :'#/'+state.sec+'/'+state.mod+(state.sec==='analytics'&&state.tab?'/'+state.tab:'');
  window.scrollTo(0,0);
}

function showTab(mod,tab,role){
  state.tagOpen=false; SET.open=false;
  if(role) state.role=role;
  if(mod){
    state.sec='analytics'; state.mod=mod;
    const m=MODULES.find(x=>x.id===mod);
    state.tab=tab||(m?m.tabs[0][0]:null);
    state.trend=(mod==='freshbrew'&&state.tab==='production')?'all':'paid'; state.sort=null; state.subtab='point';
  }else if(tab){ state.tab=tab; state.sort=null; }
  render();
}

function gotoSub(mod){
  state.tagOpen=false; SET.open=false;
  state.mod=mod;
  if(state.sec==='analytics'){
    const m=MODULES.find(x=>x.id===mod);
    state.tab=m?m.tabs[0][0]:null;
    state.trend='paid'; state.sort=null;
  }
  render();
}

function setSection(id){
  state.tagOpen=false; SET.open=false;
  state.sec=id;
  const sec=SECTIONS[id];
  state.mod=sec.subs[0].id;
  if(id==='analytics'){ state.tab=MODULES[0].tabs[0][0]; state.trend='paid'; state.sort=null; }
  if(id==='settings'){ SET.type=SET.type||'PACKAGED_PRODUCT'; SET.kind='TAG'; SET.q='';SET.status='ALL';SET.page=1;SET.sel={};SET.grpQ='';SET.tagQ='';SET.leftSel={};SET.objSel={};SET.popup=null;SET.inlineEdit=null;SET.edit=null;SET.confirm=null;SET.drawer=null; }
  render();
}

function setRole(r){
  state.tagOpen=false; SET.open=false;
  state.role=r;
  if(r==='root'){
    state.sec='analytics'; state.mod='platform'; state.tab='platform';
    state.rootRole='global'; state.rootTab='country';
    toast('已切换 Platform Root：仅保留平台级概览，明细报表按权限隐藏');
  }else{
    state.sec='analytics'; state.mod='overview'; state.tab='sales';
    toast('已切换租户 Admin：恢复完整 P0 报表与明细下钻');
  }
  state.trend='paid'; state.sort=null;
  render();
}

document.addEventListener('click',e=>{
  if(TR.view==='editor'&&TR.dirty&&!TR.confirm){
    const navEl=e.target.closest('.nav-item'), subEl=e.target.closest('.sub-item'), backEl=e.target.closest('[data-trback]');
    if(navEl||subEl||backEl){
      e.preventDefault();
      TR.confirm={kind:'leave',next:navEl?{t:'sec',id:navEl.dataset.mod}:(subEl?{t:'sub',id:subEl.dataset.mod}:{t:'list'})};
      rerender(); return;
    }
  }
  const navTog=e.target.closest('[data-nav-toggle]');
  if(navTog){
    const expand=navTog.dataset.navToggle==='expand';
    document.body.classList.toggle('nav-rail',!expand);
    try{ localStorage.setItem('vendNavRail',expand?'0':'1'); }catch(err){}
    return;
  }
  const subTog=e.target.closest('[data-sub-toggle]');
  if(subTog){
    const collapsed=subTog.dataset.subToggle==='collapse';
    document.body.classList.toggle('sub-collapsed',collapsed);
    try{ localStorage.setItem('vendSubCollapsed',collapsed?'1':'0'); }catch(err){}
    return;
  }
  /* 机器 · 设备详情抽屉 */
  if(e.target.closest('[data-mdrclose]')){ closeMdr(); return; }
  const mrow=e.target.closest('[data-mrow]');
  if(mrow && !e.target.closest('select') && !e.target.closest('input')){ openMdr(mrow.dataset.mrow); return; }
  const rrole=e.target.closest('[data-rrole]');
  if(rrole){ state.rootRole=rrole.dataset.rrole; rootGo(); return; }
  const rtab=e.target.closest('[data-rtab]');
  if(rtab){ state.rootTab=rtab.dataset.rtab; rootGo(); return; }
  const catSub=e.target.closest('[data-catsub]');
  if(catSub){ gotoSub(catSub.dataset.catsub); return; }
  const nav=e.target.closest('.nav-item');
  if(nav){
    const id=nav.dataset.mod;
    if(id==='catalog'&&state.sec==='catalog'){
      document.body.classList.toggle('catalog-inline');
      nav.classList.toggle('catalog-open',document.body.classList.contains('catalog-inline'));
      return;
    }
    if(SECTIONS[id]) setSection(id);
    else toast('「'+nav.textContent.trim()+'」模块不在本次 Demo 范围');
    return;
  }
  const sub=e.target.closest('.sub-item');
  if(sub){ gotoSub(sub.dataset.mod); return; }
  /* 本地化和语言：顶部 tab 切换 */
  if(state.sec==='settings'){
    const lochTab=e.target.closest('[data-lochtab]');
    if(lochTab){ state.mod=lochTab.dataset.lochtab; MX.edit=null; MX.aiPop=false; render(); return; }
  }
  /* 本地化中心 · 多语言内容对照 */
  if(state.sec==='settings'&&state.mod==='matrix'){
    if(MX.aiPop&&!e.target.closest('.mx2-aiwrap')){ MX.aiPop=false; mxRender(); return; }
    const mxFieldEl=e.target.closest('[data-mx2-field]');
    if(mxFieldEl){ MX.field=mxFieldEl.dataset.mx2Field; MX.edit=null; mxRender(); return; }
    const mxGrpEl=e.target.closest('[data-mx2-grp]');
    if(mxGrpEl){ const k=mxGrpEl.dataset.mx2Grp; MX.open[k]=!MX.open[k]; mxRender(); return; }
    const mxAiBtn=e.target.closest('[data-mx2-ai]');
    if(mxAiBtn){ MX.aiPop=!MX.aiPop; mxRender(); return; }
    const mxCloseBtn=e.target.closest('[data-mx2-close]');
    if(mxCloseBtn){ MX.aiPop=false; mxRender(); return; }
    const mxScopeBtn=e.target.closest('[data-mx2-scope]');
    if(mxScopeBtn){ MX.aiPop=false; MX.busy=true; mxRender(); setTimeout(()=>mxRunAI(mxScopeBtn.dataset.mx2Scope),600); return; }
    const mxOkBtn=e.target.closest('[data-mx2-ok]');
    if(mxOkBtn){ mxCommit(false); return; }
    const mxCancelBtn=e.target.closest('[data-mx2-cancel]');
    if(mxCancelBtn){ MX.edit=null; mxRender(); return; }
    const mxCellEl=e.target.closest('td.mx2-cell[data-mx2-cell]');
    if(mxCellEl&&!MX.edit){ const p=mxCellEl.dataset.mx2Cell.split(':').map(Number); mxStartEdit(p[0],p[1]); return; }
  }
  /* 品牌型号与组件 */
  if(state.sec==='devicecfg'){
    /* 数据点子弹窗与复制弹窗（优先于编辑弹窗遮罩处理） */
    const dptMask=e.target.closest('[data-dcptmask]');
    if(dptMask && e.target===dptMask){ DC.pointEdit=null; rerender(); return; }
    const dptClose=e.target.closest('[data-dcptclose]');
    if(dptClose){ DC.pointEdit=null; rerender(); return; }
    const dptSave=e.target.closest('[data-dcptsave]');
    if(dptSave){ dcSavePoint(); return; }
    const dptEnumDel=e.target.closest('[data-dcptenumdel]');
    if(dptEnumDel){ dcPointEnumDel(Number(dptEnumDel.dataset.dcptenumdel)); return; }
    const dptEnumAdd=e.target.closest('[data-dcptenumadd]');
    if(dptEnumAdd){ dcPointEnumAdd(); return; }
    const cpMask=e.target.closest('[data-dccopymask]');
    if(cpMask && e.target===cpMask){ DC.copyFrom=null; rerender(); return; }
    const cpClose=e.target.closest('[data-dccopyclose]');
    if(cpClose){ DC.copyFrom=null; rerender(); return; }
    const cpSave=e.target.closest('[data-dccopysave]');
    if(cpSave){ dcSaveCopyPoints(); return; }
    /* 组件编辑弹窗内：数据点管理区按钮 */
    const dpNew=e.target.closest('[data-dcpointnew]');
    if(dpNew){ DC.pointEdit={mode:'new',draft:dcBlankPoint()}; rerender(); return; }
    const dpEdit=e.target.closest('[data-dcpointedit]');
    if(dpEdit){ const pid=dpEdit.dataset.dcpointedit; const pt=(DC.edit&&DC.edit.points||[]).find(x=>x.pid===pid); if(pt){ DC.pointEdit={mode:'edit',draft:dcClonePoint(pt)}; rerender(); } return; }
    const dpDel=e.target.closest('[data-dcpointdel]');
    if(dpDel){ const pid=dpDel.dataset.dcpointdel; if(DC.edit) DC.edit.points=(DC.edit.points||[]).filter(x=>x.pid!==pid); rerender(); return; }
    const dpCopyOpen=e.target.closest('[data-dccopypoints]');
    if(dpCopyOpen){ DC.copyFrom={src:'',checked:{}}; rerender(); return; }
    const dcMask=e.target.closest('[data-dcmask]');
    if(dcMask && e.target===dcMask){ dcCloseAll(); rerender(); return; }
    const dcClose=e.target.closest('[data-dcclose]');
    if(dcClose){ dcCloseAll(); rerender(); return; }
    const dcTab=e.target.closest('[data-dctab]');
    if(dcTab){ state.mod=dcTab.dataset.dctab; DC.q='';DC.brandFilter='';DC.catFilter=''; dcCloseAll(); render(); return; }
    const dcNew=e.target.closest('[data-dcnew]');
    if(dcNew){ dcOpenEdit(dcNew.dataset.dcnew,'NEW'); rerender(); const inp=document.querySelector('[data-dcname]'); if(inp)inp.focus(); return; }
    const dcEdit=e.target.closest('[data-dcedit]');
    if(dcEdit){ const p=dcEdit.dataset.dcedit.split(':'); dcOpenEdit(p[0],p[1]); rerender(); const inp=document.querySelector('[data-dcname]'); if(inp)inp.focus(); return; }
    const dcImgPick=e.target.closest('[data-dcimgpick]');
    if(dcImgPick){ const f=document.querySelector('[data-dcimgfile]'); if(f)f.click(); return; }
    const dcImgClear=e.target.closest('[data-dcimgclear]');
    if(dcImgClear){ if(DC.edit) DC.edit.img=''; rerender(); return; }
    const dcCmdEdit=e.target.closest('[data-dccmdedit]');
    if(dcCmdEdit){ const key=dcCmdEdit.dataset.dccmdedit; const l=DC_LINK.find(x=>x[0]+'|'+x[1]===key); DC.cmdEdit={key:key,value:l?l[2]:''}; rerender(); const inp=document.querySelector('[data-dccmdinput]'); if(inp){inp.focus();inp.select();} return; }
    const dcCmdSave=e.target.closest('[data-dcsavecmd]');
    if(dcCmdSave){ dcSaveCmd(); return; }
    const dcCmdCancel=e.target.closest('[data-dccmdcancel]');
    if(dcCmdCancel){ DC.cmdEdit=null; rerender(); return; }
    /* 适配浏览 */
    const bbDim=e.target.closest('[data-browsedim]');
    if(bbDim){ DC_BROWSE.dim=bbDim.dataset.browsedim; if(DC_BROWSE.dim==='brand'){ DC_BROWSE.brandId=''; DC_BROWSE.modelId=''; } else { DC_BROWSE.compId=''; } rerender(); return; }
    const bbCrumb=e.target.closest('[data-bbcrumb]');
    if(bbCrumb){
      const k=bbCrumb.dataset.bbcrumb;
      if(k==='brandroot'){ DC_BROWSE.brandId=''; DC_BROWSE.modelId=''; }
      else if(k==='brand'){ DC_BROWSE.modelId=''; }
      else if(k==='comproot'){ DC_BROWSE.compId=''; }
      rerender(); return;
    }
    const bbBrand=e.target.closest('[data-bbbrand]');
    if(bbBrand){ DC_BROWSE.dim='brand'; DC_BROWSE.brandId=bbBrand.dataset.bbbrand; DC_BROWSE.modelId=''; rerender(); return; }
    const bbModel=e.target.closest('[data-bbmodel]');
    if(bbModel){ const m=dcModelOf(bbModel.dataset.bbmodel); if(m){ DC_BROWSE.dim='brand'; DC_BROWSE.brandId=m.brand; DC_BROWSE.modelId=m.id; } rerender(); return; }
    const bbComp=e.target.closest('[data-bbcomp]');
    if(bbComp){ DC_BROWSE.dim='component'; DC_BROWSE.compId=bbComp.dataset.bbcomp; rerender(); return; }
    const dcDelete=e.target.closest('[data-dcdelete]');
    if(dcDelete){ const p=dcDelete.dataset.dcdelete.split(':'); DC.confirm={kind:p[0],id:p[1]}; rerender(); return; }
    const dcSave=e.target.closest('[data-dcsave]');
    if(dcSave){ dcSaveEdit(); return; }
    const dcConfirm=e.target.closest('[data-dcconfirm]');
    if(dcConfirm){ dcConfirmDo(); return; }
    const dcDrawer=e.target.closest('[data-dcdrawer]');
    if(dcDrawer){ const p=dcDrawer.dataset.dcdrawer.split(':'); DC.drawer={kind:p[0],id:p[1]}; DC.picker=null; rerender(); return; }
    const dcPicker=e.target.closest('[data-dcpicker]');
    if(dcPicker){ DC.picker={kind:dcPicker.dataset.dcpicker,q:'',brand:'',checked:{},cmd:{},newName:''}; rerender(); const inp=document.querySelector('[data-dcpickerq]'); if(inp)inp.focus(); return; }
    const dcPickerClose=e.target.closest('[data-dcpickerclose]');
    if(dcPickerClose){ DC.picker=null; rerender(); return; }
    const dcPickSave=e.target.closest('[data-dcpickersave]');
    if(dcPickSave){ dcSavePicker(); return; }
    const dcCreateNew=e.target.closest('[data-dccreatenew]');
    if(dcCreateNew){ dcCreateNewComp(); return; }
    const dcRemove=e.target.closest('[data-dcremove]');
    if(dcRemove){
      const p=dcRemove.dataset.dcremove.split(':'), kind=p[0], id=p[1], d=DC.drawer;
      if(d){
        for(let i=DC_LINK.length-1;i>=0;i--){
          if(kind==='component'&&d.kind==='model'&&DC_LINK[i][0]===d.id&&DC_LINK[i][1]===id) DC_LINK.splice(i,1);
          if(kind==='model'&&d.kind==='component'&&DC_LINK[i][0]===id&&DC_LINK[i][1]===d.id) DC_LINK.splice(i,1);
        }
        toast('已解除适配关系，组件资料保留');
      }
      rerender(); return;
    }
  }
  /* 机器模板 */
  if(state.sec==='machine'&&state.mod==='template'){
    const mm=e.target.closest('[data-mtplmask]');
    if(mm&&e.target===mm){ MTPL.edit=null;MTPL.view=null;MTPL.confirm=null;MTPL.step=1;rerender();return; }
    if(e.target.closest('[data-mtplclose]')){ MTPL.edit=null;MTPL.view=null;MTPL.confirm=null;MTPL.step=1;rerender();return; }
    const mn=e.target.closest('[data-mtplnew]');
    if(mn){ mtplOpenEdit('NEW',1); return; }
    const mv=e.target.closest('[data-mtplview]');
    if(mv){ MTPL.view=mv.dataset.mtplview;MTPL.edit=null;MTPL.confirm=null;rerender();return; }
    const med=e.target.closest('[data-mtpledit]');
    if(med){ mtplOpenEdit(med.dataset.mtpledit,1); return; }
    const mb=e.target.closest('[data-mtplbins]');
    if(mb){ mtplOpenEdit(mb.dataset.mtplbins,2); return; }
    const mdel=e.target.closest('[data-mtpldelete]');
    if(mdel){ MTPL.confirm=mdel.dataset.mtpldelete;MTPL.edit=null;MTPL.view=null;rerender();return; }
    if(e.target.closest('[data-mtplconfirm]')){
      const i=MACHINE_TPL.findIndex(x=>x.id===MTPL.confirm);
      if(i>=0) MACHINE_TPL.splice(i,1);
      MTPL.confirm=null; rerender(); toast('模板已删除'); return;
    }
    const mstep=e.target.closest('[data-mtplstep]');
    if(mstep){ MTPL.step=Number(mstep.dataset.mtplstep)||1; rerender(); return; }
    if(e.target.closest('[data-mtplnext]')){
      const ed=MTPL.edit; if(!ed) return;
      if(!ed.name.trim()){ toast('请填写模板名称'); return; }
      if(!ed.brand||!ed.model){ toast('请选择品牌与型号'); return; }
      MTPL.step=2; rerender(); return;
    }
    if(e.target.closest('[data-mtplsave]')){ mtplSave(); return; }
    if(e.target.closest('[data-mtplbinadd]')){
      const ed=MTPL.edit;
      if(ed){
        const comps=mtplCompsOf(ed.model);
        if(!comps.length){ toast('该型号暂无适配组件，请先在「品牌型号与组件」中关联组件'); return; }
        ed.bins.push({id:mtplNewId(),comp:comps[0].id,measure:'计量',volume:'',sort:ed.bins.length+1}); rerender();
      }
      return;
    }
    if(e.target.closest('[data-mtplbinauto]')){ mtplAutoBins(); return; }
    const mrem=e.target.closest('[data-mtplbinremove]');
    if(mrem){
      const ed=MTPL.edit;
      if(ed){ ed.bins.splice(Number(mrem.dataset.mtplbinremove),1); mtplReindex(); rerender(); }
      return;
    }
    const mmove=e.target.closest('[data-mtplbinmove]');
    if(mmove){

function dcCatOptions(sel){
  let h='<option value="">未分类</option>';
  Object.keys(DC_CATS).forEach(function(main){
    const subs=DC_CATS[main];
    if(subs.length){
      h+='<optgroup label="'+main+'">'+subs.map(function(s){
        const v=main+'/'+s; return '<option value="'+v+'"'+(sel===v?' selected':'')+'>'+s+'</option>';
      }).join('')+'</optgroup>';
    }else{
      h+='<option value="'+main+'"'+(sel===main?' selected':'')+'>'+main+'</option>';
    }
  });
  return h;
}
function dcCatTone(cat){
  if(!cat) return 'muted';
  if(cat.indexOf('料道')===0) return 'info';
  if(cat==='清洗') return 'success';
  return 'neutral';
}
function dcCatCell(cat){

  const n=dcNorm(name);
  if(kind==='brand') return DC_BRAND.some(x=>x.id!==exceptId&&dcNorm(x.name)===n);

function dcOpenEdit(kind,id){
  let img='', cat='', points=[];
  if(id!=='NEW'){
    const t=kind==='brand'?DC_BRAND.find(x=>x.id===id):(kind==='model'?DC_MODEL.find(x=>x.id===id):DC_COMP.find(x=>x.id===id));
    img=(t&&t.img)||'';
    cat=(t&&t.cat)||'';
    if(kind==='component') points=(t&&t.points)?t.points.map(dcClonePoint):[];
  }
  DC.edit={kind:kind,id:id,img:img,cat:cat,points:points};
}
function dcReadImage(file){
  if(!file||!DC.edit) return;
  if(!/^image\//.test(file.type)){ toast('请选择图片文件'); return; }
  const fr=new FileReader();
  fr.onload=function(){
    const im=new Image();
    im.onload=function(){
      const w=im.naturalWidth,h=im.naturalHeight,side=Math.min(w,h);
      if(!side){ toast('图片读取失败'); return; }
      const out=Math.min(side,512), cv=document.createElement('canvas');
      cv.width=out; cv.height=out;
      cv.getContext('2d').drawImage(im,(w-side)/2,(h-side)/2,side,side,0,0,out,out);
      DC.edit.img=cv.toDataURL('image/png');
      rerender(); toast('图片已裁切为 1:1 方形');
    };
    im.onerror=function(){ toast('图片读取失败'); };
    im.src=fr.result;
  };
  fr.onerror=function(){ toast('图片读取失败'); };
  fr.readAsDataURL(file);
}

function dcBrowseCompDim(){
  const B=DC_BROWSE;

  if(!comp){ DC_BROWSE.compId=''; return dcBrowseCompList(); }

  const brands=[];
  ms.forEach(m=>{ if(brands.indexOf(m.brand)<0) brands.push(m.brand); });
  const groups=brands.map(bid=>{
    const bm=ms.filter(m=>m.brand===bid);

      const link=DC_LINK.find(l=>l[0]===m.id&&l[1]===comp.id);
      return '<tr><td><span class="lnk strong" data-bbmodel="'+m.id+'">'+esc(m.name)+'</span></td><td>'+esc((link&&link[2])||'—')+'</td>'+
        '<td><span class="lnk" data-bbmodel="'+m.id+'">看该型号组件</span></td></tr>';
    }).join('');
    return '<div class="tbl-panel" style="margin-bottom:12px"><div class="tbl-hd"><span class="t">'+esc(dcBrandName(bid))+'</span><span class="a">'+bm.length+' 个型号</span></div>'+
      '<div class="tbl-wrap"><table><thead><tr><th>型号</th><th>指令代码</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';

/* ============================================================
   组件数据点（传感器）管理：渲染
   ============================================================ */
function dcPointRangeText(pt){
  if(pt.type==='value'){
    const seg=[];
    if(pt.min!=='') seg.push(pt.min);
    if(pt.max!=='') seg.push('~'+pt.max);
    const u=pt.unit?' '+pt.unit:'';
    return (seg.length?seg.join(' '):'—')+u;
  }
  if(pt.type==='enum') return (pt.enumVals||[]).join(' / ')||'—';
  return '—';
}
function dcPointDefaultText(pt){
  if(pt.type==='bool') return pt.def==='true'?'开（true）':(pt.def==='false'?'关（false）':'—');
  if(pt.def===''||pt.def==null) return '—';
  return pt.def;
}
function dcPointRowHTML(pt){
  const typeBadge='<span class="badge '+dcPointTypeTone(pt.type)+'">'+esc(dcPointTypeLabel(pt.type))+'</span>';
  const req=pt.required?'<span class="badge warn">必填</span>':'<span class="badge muted">选填</span>';
  const en='<input type="checkbox" data-dcpointenable="'+esc(pt.pid)+'"'+(pt.enabled?' checked':'')+' title="启停">';
  return '<tr>'+
    '<td><span class="strong">'+esc(pt.name)+'</span></td>'+
    '<td class="muted">'+esc(pt.code||'—')+'</td>'+
    '<td>'+typeBadge+'</td>'+
    '<td class="muted">'+esc(pt.unit||'—')+'</td>'+
    '<td class="muted">'+esc(dcPointRangeText(pt))+'</td>'+
    '<td class="muted">'+esc(dcPointDefaultText(pt))+'</td>'+
    '<td>'+req+'</td>'+
    '<td style="text-align:center">'+en+'</td>'+
    '<td><div class="row-actions"><span class="lnk" data-dcpointedit="'+esc(pt.pid)+'">编辑</span><span class="lnk danger" data-dcpointdel="'+esc(pt.pid)+'">删除</span></div></td>'+
  '</tr>';
}
function dcPointManageHTML(){

  }else if(p.type==='enum'){

  return '<div class="mx-mask" data-dcptmask><div class="mx w620"><div class="mx-hd"><div><h3>'+(pe.mode==='new'?'新增数据点':'编辑数据点')+'</h3><div class="mx-sub">定义类型与取值范围，对齐涂鸦物模型</div></div><button class="mx-x" data-dcptclose aria-label="关闭">×</button></div>'+
    '<div class="mx-bd">'+

function dcConfirmModal(){
  const c=DC.confirm;
  let title='',body='',footer='';
  if(c.kind==='brand'){
    const b=DC_BRAND.find(x=>x.id===c.id); if(!b) return '';
    title='无法删除品牌';
    body='品牌「'+esc(b.name)+'」下存在 <b>'+dcBrandModelCount(b.id)+'</b> 个型号。请先删除或转移其下的全部型号，再删除该品牌。';
    footer='<button class="btn accent" data-dcclose>知道了</button>';
  }else if(c.kind==='component'){
    const comp=dcCompOf(c.id); if(!comp) return '';
    title='无法删除组件';
    body='组件「'+esc(comp.name)+'」已关联 <b>'+dcCompModelCount(c.id)+'</b> 个型号。请先解除全部适配关系，再删除该组件。';
    footer='<button class="btn accent" data-dcclose>知道了</button>';
  }else{
    const m=dcModelOf(c.id); if(!m) return '';
    const n=DC_LINK.filter(l=>l[0]===m.id).length;
    title='删除型号';
    body='确定删除型号「'+esc(dcModelLabel(m))+'」？<br>将同时清理 <b>'+n+'</b> 条组件关联记录；全局组件资料不会被删除。<br><b style="color:var(--danger)">此操作不可恢复。</b>';
    footer='<button class="btn" data-dcclose>取消</button><button class="btn danger" data-dcconfirm>确认删除</button>';
  }
  return '<div class="mx-mask" data-dcmask><div class="mx w620"><div class="mx-hd"><div><h3>'+title+'</h3></div><button class="mx-x" data-dcclose aria-label="关闭">×</button></div>'+
    '<div class="mx-bd" style="font-size:13px;line-height:1.8;color:var(--text-2)">'+body+'</div>'+
    '<div class="mx-ft" style="display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)">'+footer+'</div></div></div>';
}
function dcDrawer(){
  const d=DC.drawer;
  if(d.kind==='model'){
    const m=dcModelOf(d.id); if(!m) return '';
    const comps=dcCompsOf(m.id);
    const head='<tr><th>组件名称</th><th>分类</th><th>指令代码</th><th>操作</th></tr>';
    const body=comps.length? comps.map(c=>'<tr><td><span class="strong">'+esc(c.name)+'</span></td><td>'+dcCatCell(c.cat)+'</td><td>'+dcCmdCell(m.id,c.id)+'</td><td><span class="lnk danger" data-dcremove="component:'+c.id+'">移除</span></td></tr>').join('')
      : '<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">暂无适配组件。</td></tr>';
    return '<div class="mask on" data-dcclose></div><div class="drawer on"><div class="drawer-hd"><div><h3>管理组件</h3><div class="mx-sub">'+esc(dcModelLabel(m))+'</div></div><button class="drawer-x" data-dcclose aria-label="关闭">×</button></div>'+
      '<div class="drawer-bd"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px"><b style="font-size:13px">适配组件（'+comps.length+'）</b><button class="btn accent" data-dcpicker="component">＋ 添加组件</button></div>'+
      '<div class="tbl-panel"><div class="tbl-wrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div></div>'+
      '<div class="drawer-ft"><span class="fbar-meta">共 '+comps.length+' 个组件</span><button class="btn" data-dcclose>关闭</button></div></div>';
  }
  const comp=dcCompOf(d.id); if(!comp) return '';
  const ms=dcModelsOf(comp.id);
  const head='<tr><th>品牌</th><th>型号</th><th>指令代码</th><th>操作</th></tr>';
  const body=ms.length? ms.map(m=>'<tr><td>'+esc(dcBrandName(m.brand))+'</td><td><span class="strong">'+esc(m.name)+'</span></td><td>'+dcCmdCell(m.id,comp.id)+'</td><td><span class="lnk danger" data-dcremove="model:'+m.id+'">移除</span></td></tr>').join('')
    : '<tr><td colspan="4" class="muted" style="text-align:center;padding:24px">暂无适配型号。</td></tr>';
  return '<div class="mask on" data-dcclose></div><div class="drawer on"><div class="drawer-hd"><div><h3>管理适配型号</h3><div class="mx-sub">'+esc(comp.name)+'</div></div><button class="drawer-x" data-dcclose aria-label="关闭">×</button></div>'+
    '<div class="drawer-bd"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px"><b style="font-size:13px">适配型号（'+ms.length+'）</b><button class="btn accent" data-dcpicker="model">＋ 添加型号</button></div>'+
    '<div class="tbl-panel"><div class="tbl-wrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div></div>'+
    '<div class="drawer-ft"><span class="fbar-meta">共 '+ms.length+' 个型号</span><button class="btn" data-dcclose>关闭</button></div></div>';
}
function dcPickerModal(){
  const p=DC.picker;
  const isComp=p.kind==='component';
  let items='';
  if(isComp){
    let list=DC_COMP.filter(c=>!(DC.drawer&&DC.drawer.kind==='model'&&DC_LINK.some(l=>l[0]===DC.drawer.id&&l[1]===c.id)));
    if(p.q) list=list.filter(c=>c.name.toLowerCase().indexOf(p.q.toLowerCase())>=0);
    items=list.length? list.map(c=>{
      if(p.cmd[c.id]===undefined) p.cmd[c.id]=dcDefaultCmd(c.id);
      return '<div class="bopt"><input type="checkbox" data-dcpick="'+c.id+'"'+(p.checked[c.id]?' checked':'')+'><span style="flex:1;min-width:0">'+esc(c.name)+'</span>'+
        '<input data-dcpickcmd="'+c.id+'" value="'+esc(p.cmd[c.id])+'" placeholder="指令代码" style="margin-top:0;flex:0 0 112px;width:112px;padding:2px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:11px"></div>';
    }).join('')
      : '<div class="muted" style="font-size:12px;padding:8px 0">'+(p.q?'未找到匹配结果。':'没有可添加的组件。')+'</div>';
  }else{
    let list=DC_MODEL.slice();
    if(p.brand) list=list.filter(m=>m.brand===p.brand);
    if(p.q){ const q=p.q.toLowerCase(); list=list.filter(m=>m.name.toLowerCase().indexOf(q)>=0||dcBrandName(m.brand).toLowerCase().indexOf(q)>=0); }
    list=list.filter(m=>!(DC.drawer&&DC.drawer.kind==='component'&&DC_LINK.some(l=>l[1]===DC.drawer.id&&l[0]===m.id)));
    items=list.length? list.map(m=>{
      const cid=(DC.drawer&&DC.drawer.kind==='component')?DC.drawer.id:'';
      if(p.cmd[m.id]===undefined) p.cmd[m.id]=dcDefaultCmd(cid);
      return '<div class="bopt"><input type="checkbox" data-dcpick="'+m.id+'"'+(p.checked[m.id]?' checked':'')+'><span style="flex:1;min-width:0">'+esc(dcModelLabel(m))+'</span>'+
        '<input data-dcpickcmd="'+m.id+'" value="'+esc(p.cmd[m.id])+'" placeholder="指令代码" style="margin-top:0;flex:0 0 112px;width:112px;padding:2px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:11px"></div>';
    }).join('')
      : '<div class="muted" style="font-size:12px;padding:8px 0">'+(p.q||p.brand?'未找到匹配结果。':'没有可添加的型号。')+'</div>';
  }
  const brandOpts='<option value="">全部品牌</option>'+DC_BRAND.map(b=>'<option value="'+b.id+'"'+(p.brand===b.id?' selected':'')+'>'+esc(b.name)+'</option>').join('');
  return '<div class="mx-mask" data-dcmask><div class="mx w620"><div class="mx-hd"><div><h3>'+(isComp?'添加组件':'添加适配型号')+'</h3><div class="mx-sub">'+(isComp?'从全局组件库选择，可填写指令代码':'跨品牌多选型号，可填写指令代码')+'</div></div><button class="mx-x" data-dcpickerclose aria-label="关闭">×</button></div>'+
    '<div class="mx-bd">'+
      '<div class="field"><label>搜索</label>'+dcSearchInput('data-dcpickerq',p.q,isComp?'搜索组件名称':'搜索型号或品牌')+'</div>'+
      (isComp?'':'<div class="field"><label>品牌筛选</label><select data-dcpickerbrand>'+brandOpts+'</select></div>')+
      '<div style="font-size:12px;color:var(--text-2);margin-bottom:6px">可选项</div>'+
      '<div class="set-pop-list" style="max-height:260px;border:1px solid var(--border);border-radius:var(--radius-sm)">'+items+'</div>'+
      (isComp?'<div class="field" style="margin-top:14px"><label>找不到组件？新建一个全局组件并关联当前型号</label><div style="display:flex;gap:8px"><input data-dcnewname value="'+esc(p.newName||'')+'" placeholder="输入新组件名称" style="flex:1;min-width:0"><button class="btn" data-dccreatenew style="white-space:nowrap;flex:0 0 auto">新建并关联</button></div></div>':'')+
    '</div>'+
    '<div class="mx-ft" style="display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)"><button class="btn" data-dcpickerclose>取消</button><button class="btn accent" data-dcpickersave>添加所选</button></div></div></div>';
}
function dcSaveEdit(){
  const e=DC.edit; if(!e) return;
  const inp=document.querySelector('[data-dcname]'); if(!inp) return;
  const name=inp.value.trim();
  if(!name){ toast('名称必填'); return; }
  const brandSel=document.querySelector('[data-dcbrand]');
  const brandId=brandSel?brandSel.value:'';
  const catSel=document.querySelector('[data-dccat]');
  const cat=catSel?catSel.value:'';
  if(e.kind==='model'&&!brandId){ toast('请选择品牌'); return; }
  if(dcDup(e.kind,name,e.id==='NEW'?null:e.id,brandId)){
    toast(e.kind==='model'?'同品牌下已存在同名型号':(e.kind==='brand'?'品牌名称已存在':'组件名称已存在')); return;
  }
  const today=todayStr();
  if(e.id==='NEW'){
    const id=dcNewId(e.kind==='brand'?'B':(e.kind==='model'?'M':'C'));
    if(e.kind==='brand') DC_BRAND.push({id:id,name:name,img:e.img||'',created:today,updated:today});
    else if(e.kind==='model') DC_MODEL.push({id:id,brand:brandId,name:name,img:e.img||'',created:today,updated:today});
    else DC_COMP.push({id:id,name:name,cat:cat,points:(e.points||[]).map(dcClonePoint),created:today,updated:today});
    toast((e.kind==='brand'?'品牌':(e.kind==='model'?'型号':'组件'))+'创建成功');
  }else{
    let t=null;
    if(e.kind==='brand') t=DC_BRAND.find(x=>x.id===e.id);
    else if(e.kind==='model') t=DC_MODEL.find(x=>x.id===e.id);
    else t=DC_COMP.find(x=>x.id===e.id);
    if(!t) return;
    t.name=name; if(e.kind==='model') t.brand=brandId;
    if(e.kind==='brand'||e.kind==='model') t.img=e.img||'';
    if(e.kind==='component'){ t.cat=cat; t.points=(e.points||[]).map(dcClonePoint); }
    t.updated=today;
    toast('已更新');
  }
  DC.edit=null; rerender();
}
/* ============================================================
   组件数据点（传感器）管理：交互逻辑
   ============================================================ */
function dcPointEnumAdd(){
  const pe=DC.pointEdit; if(!pe) return;
  const inp=document.querySelector('[data-dcptenumnew]'); if(!inp) return;
  const v=inp.value.trim(); if(!v){ toast('请输入枚举值'); return; }
  pe.draft.enumVals=pe.draft.enumVals||[];
  pe.draft.enumVals.push(v); rerender();
}
function dcPointEnumDel(i){
  const pe=DC.pointEdit; if(!pe) return;
  pe.draft.enumVals=pe.draft.enumVals||[];
  pe.draft.enumVals.splice(i,1); rerender();
}
function dcSavePoint(){
  const pe=DC.pointEdit; if(!pe||!DC.edit) return;
  const q=function(sel){ const el=document.querySelector(sel); return el?el.value.trim():''; };
  const name=q('[data-dcptname]');
  const code=q('[data-dcptcode]');
  if(!name){ toast('数据点名称必填'); return; }
  if(!code){ toast('标识 code 必填'); return; }
  if(!/^[A-Za-z][A-Za-z0-9_]*$/.test(code)){ toast('标识 code 需以字母开头，仅含字母/数字/下划线'); return; }
  const type=pe.draft.type;
  const dup=(DC.edit.points||[]).some(x=>x.code.toLowerCase()===code.toLowerCase() && x.pid!==pe.draft.pid);
  if(dup){ toast('标识 code 在组件内已存在'); return; }
  let unit='',min='',max='',step='',scale='',def='';
  const enumVals=pe.draft.enumVals||[];
  if(type==='value'){
    unit=q('[data-dcptunit]'); min=q('[data-dcptmin]'); max=q('[data-dcptmax]'); step=q('[data-dcptstep]'); scale=q('[data-dcptscale]'); def=q('[data-dcptdef]');
    if(min!==''&&max!==''&&Number(min)>Number(max)){ toast('最小值不能大于最大值'); return; }
  }else if(type==='enum'){
    if(!enumVals.length){ toast('枚举型至少需要一个枚举值'); return; }
    const dsel=document.querySelector('[data-dcptdef]'); def=dsel?dsel.value:'';
  }else if(type==='bool'){
    const dsel=document.querySelector('[data-dcptdef]'); def=dsel?dsel.value:'false';
  }else{
    def=q('[data-dcptdef]');
  }
  const reqEl=document.querySelector('[data-dcptrequired]');
  const enEl=document.querySelector('[data-dcptenabled]');
  const pt=dcClonePoint({pid:pe.draft.pid||dcNewPointId(),code:code,name:name,type:type,unit:unit,min:min,max:max,step:step,scale:scale,enumVals:enumVals,def:def,required:reqEl?reqEl.checked:false,enabled:enEl?enEl.checked:true});
  if(pe.mode==='new'){
    DC.edit.points=(DC.edit.points||[]).concat(pt);
  }else{
    DC.edit.points=(DC.edit.points||[]).map(x=>x.pid===pe.draft.pid?pt:x);
  }
  DC.pointEdit=null; rerender(); toast('数据点已保存');
}
function dcSaveCopyPoints(){
  const cf=DC.copyFrom; if(!cf||!DC.edit) return;
  const ids=Object.keys(cf.checked).filter(k=>cf.checked[k]);
  const src=DC_COMP.find(c=>c.id===cf.src);
  if(!src||!ids.length){ toast('请选择要复制的数据点'); return; }
  const picked=(src.points||[]).filter(pt=>ids.indexOf(pt.pid)>=0);
  let added=0;
  picked.forEach(function(pt){
    const c=dcClonePoint(pt); c.pid=dcNewPointId();
    let code=c.code, n=1;
    while((DC.edit.points||[]).some(x=>x.code===code)){ code=c.code+'_'+(n++); }
    c.code=code;
    DC.edit.points=(DC.edit.points||[]).concat(c); added++;
  });
  DC.copyFrom=null; rerender();
  toast('已复制 '+added+' 个数据点');
}
function dcConfirmDo(){
  const c=DC.confirm; if(!c) return;
  if(c.kind==='model'){
    const m=dcModelOf(c.id); if(!m) return;
    const i=DC_MODEL.indexOf(m); if(i>=0) DC_MODEL.splice(i,1);
    for(let j=DC_LINK.length-1;j>=0;j--) if(DC_LINK[j][0]===c.id) DC_LINK.splice(j,1);
    toast('型号已删除，组件资料保持不变');
  }
  DC.confirm=null; rerender();
}
function dcSavePicker(){
  const p=DC.picker, d=DC.drawer; if(!p||!d) return;
  const ids=Object.keys(p.checked).filter(k=>p.checked[k]);
  let added=0;
  ids.forEach(function(id){
    const cmd=String(p.cmd[id]||'').trim()||dcDefaultCmd(p.kind==='component'?id:d.id);
    if(p.kind==='component'){
      if(!DC_LINK.some(l=>l[0]===d.id&&l[1]===id)){ DC_LINK.push([d.id,id,cmd]); added++; }
    }else{
      if(!DC_LINK.some(l=>l[0]===id&&l[1]===d.id)){ DC_LINK.push([id,d.id,cmd]); added++; }
    }
  });
  const today=todayStr();
  if(p.kind==='component'){ const m=dcModelOf(d.id); if(m) m.updated=today; }
  else { const comp=dcCompOf(d.id); if(comp) comp.updated=today; }
  DC.picker=null; rerender();
  toast(added?('已添加 '+added+' 条适配关系'):'没有新增适配关系');
}
function dcCreateNewComp(){
  const p=DC.picker, d=DC.drawer; if(!p||!d) return;
  const inp=document.querySelector('[data-dcnewname]'); if(!inp) return;
  const name=inp.value.trim(); if(!name){ toast('组件名称必填'); return; }
  if(dcDup('component',name)){ toast('组件名称已存在，请直接选择该组件'); return; }
  const id=dcNewId('C'), today=todayStr();
  DC_COMP.push({id:id,name:name,cat:'',created:today,updated:today});
  if(d.kind==='model'&&!DC_LINK.some(l=>l[0]===d.id&&l[1]===id)) DC_LINK.push([d.id,id,(p.cmd[id]||'').trim()||dcDefaultCmd(id)]);
  p.checked[id]=true; p.newName='';
  rerender(); toast('已创建全局组件并关联当前型号');
}

/* 菜单折叠状态：记住用户选择 */
(function(){
  try{
    if(localStorage.getItem('vendNavRail')==='0') document.body.classList.remove('nav-rail');
    if(localStorage.getItem('vendSubCollapsed')==='1') document.body.classList.add('sub-collapsed');
  }catch(e){}
})();

/* 初始路由 */
(function(){
  const h=location.hash.match(/#\/([a-z]+)\/([a-z]+)(?:\/([a-z]+))?(?:\/([a-z]+))?/);
  /* 兼容旧路由：本地化中心已并入系统设置 */
  if(h && h[1]==='localization'){ h[1]='settings'; }
  if(h && SECTIONS[h[1]]){
    const secId=h[1];
    state.sec=secId;
    if(secId==='analytics'){
      if(h[2]==='platform'){
        state.role='root'; state.mod='platform'; state.tab='platform';
        if(h[3]&&ROOT[h[3]]) state.rootRole=h[3];
        if(h[4]&&['country','maker','model','fault','tenants'].indexOf(h[4])>=0) state.rootTab=h[4];
        render(); return;
      }
      const mod=MODULES.some(m=>m.id===h[2])?h[2]:'overview';
      const m=MODULES.find(x=>x.id===mod);
      state.mod=mod;
      state.tab=h[3]&&m.tabs.some(t=>t[0]===h[3])?h[3]:m.tabs[0][0];
      render(); return;
    }
    const sec=SECTIONS[secId];
    const extraMods=secId==='settings'?['matrix']:[];
    state.mod=(sec.subs.some(s=>s.id===h[2])||extraMods.indexOf(h[2])>=0)?h[2]:sec.subs[0].id;
    render(); return;
  }
  state.sec='analytics'; state.mod='overview'; state.tab='sales';
  render();
})();
</script>
