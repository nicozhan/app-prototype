<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>补货中 · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
.rf-back{
  display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 2px;
  font-size:14px;font-weight:600;color:var(--brand);white-space:nowrap
}

/* 机器头 + 待补货 */
.rf-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:2px 2px 0}
.rf-head-info{min-width:0}
.rf-code{font-size:12px;line-height:16px;font-weight:700;letter-spacing:2.8px;color:var(--brand)}
.rf-name{
  margin-top:3px;font-size:22px;line-height:30px;font-weight:800;letter-spacing:-.5px;
  color:var(--ink);overflow-wrap:anywhere
}
.rf-sub{margin-top:2px;font-size:14px;line-height:20px;font-weight:600;color:var(--text-2)}
.rf-total{
  flex:0 0 auto;margin-top:6px;padding:9px 12px 10px;text-align:left;
  border:1px solid var(--brand-line);border-radius:var(--r-ctl);background:var(--brand-weak)
}
.rf-total-k{display:block;font-size:11px;line-height:15px;font-weight:700;color:var(--text-2)}
.rf-total-v{
  display:block;margin-top:1px;font-size:26px;line-height:30px;font-weight:800;
  letter-spacing:-.9px;color:var(--brand);font-variant-numeric:tabular-nums
}
.rf-total-s{display:block;margin-top:-1px;font-size:11px;line-height:15px;font-weight:600;color:var(--text-2)}

/* 商品卡 */
.rf-lvl{margin-top:10px;font-size:13px;line-height:18px;font-weight:700;color:var(--brand)}
.rf-pname{margin-top:1px;font-size:18px;line-height:25px;font-weight:700;letter-spacing:-.2px;color:var(--ink)}
.rf-stock{
  margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:13px;line-height:19px;color:var(--text-2)
}
.rf-stock b{
  color:var(--brand);font-weight:800;font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right
}
.rf-dot{width:6px;height:6px;border-radius:50%;background:var(--warn);display:inline-block;flex:0 0 auto}

/* 补货量 */
.rf-unit{font-size:12px;line-height:17px;font-weight:600;color:var(--text-2)}
.rf-stepper{
  height:52px;display:grid;grid-template-columns:56px 1fr 56px;overflow:hidden;
  border:1px solid var(--brand-line);border-radius:var(--r-ctl);background:var(--brand-weak)
}
.rf-stepper button{
  display:flex;align-items:center;justify-content:center;
  font-size:24px;line-height:1;font-weight:700;color:var(--brand)
}
.rf-stepper button:active{background:var(--brand-weak)}
.rf-stepper .mid{
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);border-left:1px solid var(--line);border-right:1px solid var(--line);
  font-size:22px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums
}
.rf-after{
  margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--brand-weak);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12px;line-height:17px;color:var(--text-2)
}
.rf-after b{
  color:var(--brand);font-weight:800;font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right
}

/* 日期设置 */
.rf-date{
  margin-top:10px;height:46px;padding:0 12px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;
  border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface-2)
}
.rf-date span{font-size:13px;line-height:19px;font-weight:600;color:var(--text-2);flex:0 0 auto}
.rf-date input{
  min-width:0;width:132px;border:0;background:transparent;outline:0;padding:0;
  color:var(--brand);font-size:14px;font-weight:800;text-align:right;
  font-variant-numeric:tabular-nums
}

/* 快捷操作 */
.rf-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* 底部 */
.rf-actions{display:grid;grid-template-columns:.85fr 1.15fr;gap:10px}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left"><a class="rf-back" href="restock-list.html" onclick="return appBack(event)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>返回</a></span>
    <h1>补货中</h1>
    <span class="nav-right"></span>
  </header>

  <div class="body">

    <section class="rf-head">
      <div class="rf-head-info">
        <div class="rf-code">VM-1001</div>
        <h2 class="rf-name">曼谷机场 T1-A01</h2>
        <div class="rf-sub">ID: VM-1001</div>
        <div id="machineTag" class="mt-8"></div>
      </div>
      <div class="rf-total">
        <span class="rf-total-k">待补货</span>
        <span class="rf-total-v">6</span>
        <span class="rf-total-s">种商品 · 39 件</span>
      </div>
    </section>

    <section class="card mt-12">
      <div class="card-head">
        <span class="badge brand">糖浆</span>
        <span class="badge warn"><span class="rf-dot"></span>低库存</span>
      </div>
      <div class="card-body">
        <div class="rf-lvl">L3 · 糖浆</div>
        <div class="rf-pname">糖浆</div>
        <div class="rf-stock"><span>当前库存</span><b id="curStock">180 ml / 1000 ml</b></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3 class="card-title">补货量</h3>
        <span class="rf-unit">单位：ml</span>
      </div>
      <div class="card-body">
        <div class="rf-stepper">
          <button type="button" onclick="step(-50)" aria-label="减少">−</button>
          <div class="mid" id="addQty">500</div>
          <button type="button" onclick="step(50)" aria-label="增加">+</button>
        </div>
        <div class="rf-after"><span>补货后库存 / 总容量</span><b id="afterStock">680 ml / 1000 ml</b></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h3 class="card-title">日期设置</h3></div>
      <div class="card-body">
        <div class="segmented rf-seg">
          <button type="button" class="active" onclick="seg(this)">按生产日期</button>
          <button type="button" onclick="seg(this)">按时间</button>
        </div>
        <div class="rf-date">
          <span>预计到期日</span>
          <input type="date" id="expDate" value="2026-09-04" aria-label="预计到期日">
        </div>
      </div>
    </section>

    <div class="rf-quick">
      <button type="button" class="btn btn-danger-weak btn-sm" onclick="clearStock()">清空当前库存</button>
      <button type="button" class="btn btn-secondary btn-sm" onclick="fillAll()">全部补满</button>
    </div>

  </div>

  <footer class="footer">
    <div class="rf-actions">
      <button type="button" class="btn btn-ghost" onclick="appBack(event)">取消</button>
      <button type="button" class="btn btn-primary" onclick="confirmRestock()">确认补货</button>
    </div>
  </footer>

</main>

<script>
  const CAP = 1000, INIT_CUR = 180;
  let cur = INIT_CUR, add = 500;
  function render(){
    document.getElementById('addQty').textContent = add;
    document.getElementById('afterStock').textContent = Math.min(cur + add, CAP) + ' ml / ' + CAP + ' ml';
    document.getElementById('curStock').textContent = cur + ' ml / ' + CAP + ' ml';
  }
  function step(d){ add = Math.max(0, Math.min(CAP - cur, add + d)); render(); }
  function seg(b){ document.querySelectorAll('.rf-seg button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }
  function clearStock(){ add = 0; render(); }
  function fillAll(){ add = CAP - cur; render(); }
  function confirmRestock(){
    location.href = 'restock-done.html?mode=coffee';
  }
  render();

  /* 双门长按链路：接收 Machine Details 传入的 door，并在返回时保留 */
  (function(){
    var d = new URLSearchParams(location.search).get('door');
    if(d !== 'left' && d !== 'right') return;
    var tag = document.createElement('span');
    tag.className = 'badge brand';
    tag.textContent = d === 'left' ? '左门' : '右门';
    document.getElementById('machineTag').appendChild(tag);
    document.querySelector('.rf-back').setAttribute('href', 'restock-list.html?door=' + d);
  })();
</script>
<script src="app-ui.js"></script>
</body>
</html>
