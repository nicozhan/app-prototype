<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>设备详情 · 咖啡机</title>
<link rel="stylesheet" href="app-ui.css">
<style>
/* 咖啡机 · 页面前缀 cf- */
.cf-device{padding:2px 0 10px}
.cf-device-name{font-size:19px;line-height:26px;font-weight:700;letter-spacing:-.4px}
.cf-device-id{margin-top:2px;font-size:12px;line-height:17px;color:var(--text-2);font-variant-numeric:tabular-nums}
.cf-tags{display:flex;gap:6px;margin-top:8px}
.cf-stats{margin-bottom:8px}



/* 状态值 */
.cf-ok{color:var(--ok)}

/* 现场图片（与单门柜实拍一致：1:1、可更换） */
.cf-photo{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.cf-photo-img{display:block;width:100%;height:100%;object-fit:cover}
.ph-btn{
  position:absolute;right:10px;bottom:10px;z-index:3;height:28px;padding:0 10px;
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  background:rgba(255,255,255,.94);color:var(--text);font-size:12px;line-height:18px;font-weight:700;
  box-shadow:0 2px 8px rgba(11,16,47,.14)
}
.ph-btn:active{background:#fff}
.ph-btn svg{width:14px;height:14px}
.ph-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-reset{margin-top:10px}
</style>
</head>
<body>
<main class="app" id="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left">
      <button class="icon-btn" aria-label="返回" onclick="appHome(event,'home')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    </span>
    <h1>设备详情</h1>
    <span class="nav-right"></span>
  </header>

  <div class="body">
    <section class="cf-device">
      <div class="cf-device-name" data-device-name>中央广场咖啡机</div>
      <div class="cf-device-id"><span data-device-id>CM-2001</span> · 咖啡机</div>
      <div class="cf-tags"><span class="badge ok" data-conn-badge><span class="dot ok"></span>在线</span></div>
    </section>

    <section class="stats cf-stats" aria-label="料仓与售出">
      <div class="stat"><div class="stat-label">料仓数量</div><div class="stat-value">8<small>个</small></div></div>
      <div class="stat"><div class="stat-label">上次补货后售出杯数</div><div class="stat-value">124<small>杯</small></div></div>
    </section>

    <section class="card" aria-label="现场图片">
      <div class="card-head"><h2 class="card-title">现场图片</h2></div>
      <div class="card-body">
        <div class="cf-photo" id="photoWrap">
          <img class="cf-photo-img" id="cfPhoto" src="assets/device-cm-2001.jpg" alt="中央广场咖啡机 现场照片" width="800" height="800">
          <button class="ph-btn" id="photoBtn" type="button" aria-haspopup="dialog" aria-controls="photoSheet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l.9-1.4h6.8L16.3 6h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.1"/></svg>
            <span id="photoBtnLabel">更换照片</span>
          </button>
        </div>
      </div>
    </section>

    <section class="card" aria-label="设备状态">
      <div class="card-head"><h2 class="card-title">设备状态</h2></div>
      <div class="card-body">
        <div class="rows">
          <div class="row"><span class="row-k">在线状态</span><span class="row-v cf-ok" data-conn-value>在线</span></div>
          <div class="row"><span class="row-k">舱门状态</span><span class="row-v" id="doorState">已关闭</span></div>
          <div class="row"><span class="row-k">料仓数量</span><span class="row-v">8 个</span></div>
          <div class="row"><span class="row-k">上次补货</span><span class="row-v">2026-11-18 09:20</span></div>
        </div>
      </div>
    </section>

    <section class="card" aria-label="远程操作">
      <div class="card-head"><h2 class="card-title">远程操作</h2></div>
      <div class="card-body">
        <div class="ops">
          <button class="btn btn-secondary" type="button" data-unlock aria-haspopup="dialog" aria-controls="unlockSheet">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
            <span data-unlock-label>开锁</span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <footer class="footer">
    <button class="btn btn-primary btn-block" id="restockBtn"><span>开始补货</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </footer>

  <div class="overlay" id="unlockSheet" role="dialog" aria-modal="true" aria-labelledby="unlockTitle">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-head">
        <h2 id="unlockTitle">远程开锁</h2>
        <button class="close" type="button" data-close aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <p class="sheet-note">确认后柜门可被打开，请确认设备周边安全后再继续。</p>
        <div class="rows">
          <div class="row"><span class="row-k">设备</span><span class="row-v">CM-2001 · 中央广场咖啡机</span></div>
          <div class="row"><span class="row-k">门状态</span><span class="row-v">已关闭</span></div>
        </div>
        <div class="sheet-btns">
          <button class="btn btn-ghost" type="button" data-close>取消</button>
          <button class="btn btn-primary" type="button" data-unlock-confirm>确认开锁</button>
        </div>
      </div>
    </div>
  </div>


  <div class="overlay" id="photoSheet" role="dialog" aria-modal="true" aria-labelledby="photoTitle">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-head">
        <h2 id="photoTitle">现场图片</h2>
        <button class="close" type="button" data-photo-close aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <p class="sheet-note">照片用于设备识别与远程巡检。建议正对设备拍摄，光线均匀、设备完整入画；支持 JPG / PNG，单张不超过 10MB。</p>
        <div class="ph-acts">
          <button class="btn btn-secondary" type="button" id="phCamera">拍照</button>
          <button class="btn btn-secondary" type="button" id="phAlbum">从相册选择</button>
        </div>
        <button class="btn btn-ghost btn-block ph-reset" type="button" id="phReset" hidden>恢复默认图片</button>
      </div>
    </div>
  </div>
  <input type="file" id="phInput" accept="image/*" hidden>

  <div class="toast" id="toast" role="status"></div>
</main>
<script>
(function(){
  document.getElementById('restockBtn').addEventListener('click',function(){location.href='coffee-restock.html?id=CM-2001&name='+encodeURIComponent('中央广场咖啡机')});
  document.addEventListener('DOMContentLoaded',function(){
    if(window.appUnlock)appUnlock({buttons:'[data-unlock]',sheet:'unlockSheet',statusRow:'doorState',toast:'toast'});
  });
})();
</script>
<script>
/* 现场图片：点击图片 / 右下角按钮 → 拍照或相册替换，按设备缓存在本地 */
(function(){
  var qs=new URLSearchParams(location.search);
  var deviceId=qs.get('id')||'CM-2001';
  var deviceName=qs.get('name')||'中央广场咖啡机';
  var DEFAULTS={'CM-2001':'assets/device-cm-2001.jpg'};
  var fallback=DEFAULTS[deviceId]||'assets/device-cm-2001.jpg';
  var KEY='vs:device-photo:'+deviceId;

  var photo=document.getElementById('cfPhoto');
  var wrap=document.getElementById('photoWrap');
  var sheet=document.getElementById('photoSheet');
  var label=document.getElementById('photoBtnLabel');
  var resetBtn=document.getElementById('phReset');
  var input=document.getElementById('phInput');
  var toastEl=document.getElementById('toast');
  var toastTimer;

  function toast(text){
    if(!toastEl)return;
    toastEl.textContent=text;toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toastEl.classList.remove('show')},1800);
  }
  function stored(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
  function save(value){try{value?localStorage.setItem(KEY,value):localStorage.removeItem(KEY)}catch(e){}}

  function render(src){
    var show=src||fallback;
    if(show){
      photo.src=show;
      photo.alt=deviceName+' 现场照片';
    }
    label.textContent=show?'更换照片':'上传照片';
    resetBtn.textContent='恢复默认图片';
    resetBtn.hidden=!stored();
  }
  function openSheet(){sheet.classList.add('open')}
  function closeSheet(){sheet.classList.remove('open')}

  render(stored());

  wrap.addEventListener('click',function(event){
    if(event.target.closest('#photoBtn')||event.target===wrap||event.target===photo)openSheet();
  });
  sheet.querySelectorAll('[data-photo-close]').forEach(function(btn){btn.addEventListener('click',closeSheet)});
  sheet.addEventListener('click',function(event){if(event.target===sheet)closeSheet()});
  document.addEventListener('keydown',function(event){if(event.key==='Escape')closeSheet()});

  document.getElementById('phCamera').addEventListener('click',function(){
    input.setAttribute('capture','environment');input.click();
  });
  document.getElementById('phAlbum').addEventListener('click',function(){
    input.removeAttribute('capture');input.click();
  });

  input.addEventListener('change',function(){
    var file=input.files&&input.files[0];
    input.value='';
    if(!file)return;
    if(!/^image\//.test(file.type)){toast('请选择图片文件');return}
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=1200,w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(Math.max(w,h)>max){var k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
        var canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        var data=canvas.toDataURL('image/jpeg',0.86);
        save(data);render(data);closeSheet();toast('现场图片已更新');
      };
      img.onerror=function(){toast('图片读取失败，请重试')};
      img.src=reader.result;
    };
    reader.onerror=function(){toast('图片读取失败，请重试')};
    reader.readAsDataURL(file);
  });

  resetBtn.addEventListener('click',function(){
    save('');render('');
    closeSheet();
    toast('已恢复默认图片');
  });
})();
</script>
<script src="app-ui.js"></script>
</body>
</html>
