<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>点位商品销售统计 · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
  .sp-filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .sp-flt{
    display:block;text-align:left;padding:8px 10px;border:1px solid var(--line);
    border-radius:var(--r-ctl);background:var(--surface)
  }
  .sp-flt:active{background:var(--surface-2)}
  .sp-flb{display:block;font-size:10px;line-height:14px;font-weight:600;color:var(--text-3)}
  .sp-flv{
    margin-top:1px;display:flex;align-items:center;justify-content:space-between;gap:2px;
    font-size:13px;line-height:19px;font-weight:600;white-space:nowrap
  }
  .sp-flv svg{color:var(--text-3);flex:0 0 auto}
  .sp-flv span{min-width:0;overflow:hidden;text-overflow:ellipsis}

  .sp-line{
    display:block;margin-top:2px;font-size:12px;line-height:17px;color:var(--text-2);
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .sp-line b{font-weight:600;color:var(--ink)}

  .sp-count{font-size:11px;line-height:16px;color:var(--text-2);white-space:nowrap}
  .sp-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <div class="nav-left">
      <a class="icon-btn" href="stats.html" aria-label="返回" onclick="return appBack(event)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
    </div>
    <h1>点位商品销售统计</h1>
    <span></span>
  </header>

  <div class="body">

    <div class="sp-filters">
      <button class="sp-flt" type="button">
        <span class="sp-flb">点位</span>
        <span class="sp-flv"><span>北京国贸店</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </button>
      <button class="sp-flt" type="button">
        <span class="sp-flb">时间</span>
        <span class="sp-flv"><span>近7天</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </button>
      <button class="sp-flt" type="button">
        <span class="sp-flb">商品分类</span>
        <span class="sp-flv"><span>全部分类</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </button>
    </div>

    <section class="stats mt-12">
      <div class="stat primary">
        <div class="stat-label">销售额</div>
        <div class="stat-value">¥ 6,850</div>
      </div>
      <div class="stat">
        <div class="stat-label">销售数量</div>
        <div class="stat-value">248<small>件</small></div>
      </div>
    </section>

    <section class="card mt-12">
      <div class="card-head bordered">
        <h2 class="card-title">商品销售明细</h2>
        <span class="sp-count">共 3 个商品</span>
      </div>
      <div class="list">

        <div class="item">
          <span class="item-icon">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
          </span>
          <span class="item-body">
            <span class="item-name">美式咖啡</span>
            <span class="sp-line">销量 <b>68 杯</b> · 销售额 <b>¥ 1,020</b></span>
            <span class="sp-line">占点位销售额 <b>14.9%</b></span>
          </span>
        </div>

        <div class="item">
          <span class="item-icon">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
          </span>
          <span class="item-body">
            <span class="item-name">拿铁</span>
            <span class="sp-line">销量 <b>52 杯</b> · 销售额 <b>¥ 1,040</b></span>
            <span class="sp-line">占点位销售额 <b>15.2%</b></span>
          </span>
        </div>

        <div class="item">
          <span class="item-icon">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
          </span>
          <span class="item-body">
            <span class="item-name">卡布奇诺</span>
            <span class="sp-line">销量 <b>35 杯</b> · 销售额 <b>¥ 700</b></span>
            <span class="sp-line">占点位销售额 <b>10.2%</b></span>
          </span>
        </div>

      </div>
    </section>

  </div>

  <footer class="footer">
    <div class="sp-acts">
      <a class="btn btn-ghost" href="#">查看销售趋势</a>
      <a class="btn btn-primary" href="#">导出报表</a>
    </div>
  </footer>

</main>
<script src="app-ui.js"></script>
</body>
</html>
