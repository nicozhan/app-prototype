<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>告警详情 · VendSolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vend.css">
<style>
  .screen{ width:393px; max-width:100%; min-height:100dvh;
    padding-bottom:calc(28px + env(safe-area-inset-bottom)); }
  .lk{ color:var(--blue); font-weight:700; font-size:12px; white-space:nowrap; margin-left:6px; }
  .okv{ color:var(--green); font-weight:700; }
</style>
</head>
<body>
<div class="screen">

  <div class="dtop">
    <a class="back" href="alerts.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回</a>
    <div class="title">告警详情</div>
    <span class="right">
      <a class="iconbtn" href="alerts.html" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </a>
    </span>
  </div>

  <!-- 状态头（C4 标准：整圈描边 + 顶部色条） -->
  <div class="sect sev p2">
    <div class="sstrip"></div>
    <div class="sin">
      <div class="dstat">
        <span class="st badge b-green">已完成</span>
        <span class="alvl p2">P2</span>
      </div>
      <div class="tktitle" style="font-size:17px;margin-top:9px">设备离线</div>
      <div style="font-size:11.5px;color:var(--gray);margin-top:5px;letter-spacing:.2px">
        设备告警 · DEVICE_OFFLINE · 60e340a2-fe34-4255-9511-2899ffeab032</div>
    </div>
  </div>

  <!-- 基本信息 -->
  <div class="sect">
    <div class="hd"><h3>基本信息</h3></div>
    <div class="frow"><span class="k">设备</span><span class="v">SN0010155 <a class="lk" href="machines.html">查看</a></span></div>
    <div class="frow"><span class="k">点位</span><span class="v">—</span></div>
    <div class="frow"><span class="k">租户</span><span class="v">JAVA</span></div>
    <div class="frow"><span class="k">告警时间</span><span class="v">2026/10/25 14:27</span></div>
    <div class="frow"><span class="k">状态</span><span class="v"><span class="badge b-green">已完成</span></span></div>
  </div>

  <!-- 告警信息 -->
  <div class="sect">
    <div class="hd"><h3>告警信息</h3></div>
    <div class="frow"><span class="k">告警类型</span><span class="v">设备离线</span></div>
    <div class="frow"><span class="k">当前状态</span><span class="v"><span class="okv">正常</span></span></div>
    <div class="frow"><span class="k">持续时间</span><span class="v">7 分钟</span></div>
  </div>

  <!-- 关联工单 -->
  <div class="sect">
    <div class="hd"><h3>关联工单</h3><span class="rt">工单已创建</span></div>
    <a class="drow" href="app_workorder/ticket-detail.html" style="text-decoration:none;color:inherit">
      <div>
        <div class="t">WO2114242490149998594</div>
        <div class="s">点击查看工单处理详情</div>
      </div>
      <span class="chev">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </span>
    </a>
  </div>

</div>
</body>
</html>
