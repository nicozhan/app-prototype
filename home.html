<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>欢迎使用 · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
/* 首页 · 页面前缀 hm- */
.hm-top{display:flex;align-items:center;gap:6px;margin:-4px 0 2px -10px}
.hm-head{min-width:0}
.hm-brand{display:block;font-size:10px;line-height:14px;font-weight:700;letter-spacing:2.2px;color:var(--brand)}
.hm-title{margin-top:1px;font-size:24px;line-height:32px;font-weight:800;letter-spacing:-.6px}

.hm-sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:14px 2px 7px}
.hm-sec h2{font-size:12px;line-height:17px;font-weight:700;letter-spacing:.4px;color:var(--text-2)}
.hm-sec span{font-size:11px;line-height:16px;color:var(--text-3)}

.hm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hm-tile{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;
  border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);color:var(--ink)
}
.hm-tile:active{background:var(--surface-2)}
.hm-ic{
  width:44px;height:44px;border-radius:12px;background:var(--brand-weak);color:var(--brand);
  display:flex;align-items:center;justify-content:center
}
.hm-ic svg{width:22px;height:22px}
.hm-lb{
  max-width:100%;font-size:13px;line-height:18px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.hm-tile.soon{background:var(--surface-2)}
.hm-tile.soon .hm-ic{background:var(--surface);border:1.5px dashed var(--brand-line);color:var(--text-3)}
.hm-tile.soon .hm-lb{color:var(--text-2)}
.hm-cs{margin-top:-4px;font-size:10px;line-height:14px;font-weight:600;letter-spacing:.2px;color:var(--text-3)}

.hm-about{display:flex;align-items:center;gap:12px;padding:14px;margin-top:10px}
.hm-about .hm-ic{background:var(--warn-bg);color:var(--orange)}
.hm-about .t{display:block;font-size:14px;line-height:20px;font-weight:700}
.hm-about .s{display:block;margin-top:1px;font-size:12px;line-height:17px;color:var(--text-2)}
.hm-about .chev{margin-left:auto;color:var(--text-3)}
</style>
</head>
<body>
<main class="app">

    <a class="card hm-about" href="my.html">
