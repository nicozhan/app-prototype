<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>欢迎使用 · VendSolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vend.css">
<style>
  .welcome{ padding:20px 20px 4px; display:flex; gap:14px; align-items:flex-start; }
  .welcome .brand{ font-size:12px; font-weight:600; letter-spacing:2.5px; color:var(--blue); }
  .welcome h1{ font-size:27px; font-weight:900; letter-spacing:-.3px; margin-top:2px; }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:14px 20px 0; }
  .tile{ background:#fff; border-radius:var(--r); box-shadow:var(--shadow);
    padding:18px 8px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .tile .ic{ width:44px; height:44px; border-radius:12px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; color:var(--blue); }
  .tile .ic svg{ width:22px; height:22px; }
  .tile .lb{ font-size:14px; font-weight:600; }
  .tile.soon{ background:#F4F6FE; box-shadow:none; }
  .tile.soon .ic{ background:#fff; border:1.5px dashed #C9D2F5; color:#B3BCE4; }
  .tile.soon .lb{ color:#9AA1BC; }
  .tile.soon .cs{ font-size:10.5px; color:#B3BCE4; margin-top:-6px; }
  .about{ margin:20px 20px 0; display:flex; align-items:center; gap:14px;
    padding:16px; }
  .about .ic{ width:40px; height:40px; border-radius:12px; background:var(--orange-bg);
    color:var(--orange); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .about .ic svg{ width:20px; height:20px; }
  .about .t{ font-size:15px; font-weight:700; }
  .about .s{ font-size:12px; color:var(--gray); margin-top:2px; }
  .about .chev{ margin-left:auto; color:#C9D2F5; }
</style>
</head>
<body>
<div class="screen">
  <div class="welcome">
    <a class="iconbtn" href="login.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <div>
      <div class="brand">VENDSOLUTION</div>
      <h1>欢迎使用</h1>
    </div>
  </div>

  <div class="section"><h2>功能</h2></div>
  <div class="grid">

  </div>

  <div class="divider"></div>
  <div class="section">

  </div>
  <div class="grid">
    <div class="tile soon"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="lb">选品</span><span class="cs">Coming Soon</span></div>
    <div class="tile soon"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></span><span class="lb">点位拓展</span><span class="cs">Coming Soon</span></div>
    <div class="tile soon"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></span><span class="lb">Vendy's AI</span><span class="cs">Coming Soon</span></div>
    <div class="tile soon"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span><span class="lb">补货员KPI</span><span class="cs">Coming Soon</span></div>
  </div>

  <div class="divider"></div>
  <a class="about card" href="my.html">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>
