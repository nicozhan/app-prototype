<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2434c8">
<title>我的 · VendSolution</title>
<link rel="stylesheet" href="app-ui.css">
<style>
.my-profile{
  padding:18px;border-radius:var(--r-card);background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:14px
}
.my-avatar{
  width:56px;height:56px;flex:0 0 auto;padding:0;border:0;border-radius:50%;
  background:#fff;position:relative;display:block;cursor:pointer
}
.my-avatar-img{
  display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff
}
.my-avatar:active .my-avatar-img{opacity:.88}
.my-avatar .edit{
  position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;
  background:var(--orange);box-shadow:0 0 0 2px var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center
}
.my-id{min-width:0}
.my-name{font-size:18px;line-height:24px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.my-email{margin-top:2px;font-size:12px;line-height:17px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.my-org{margin-top:1px;font-size:12px;line-height:17px;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 头像弹层按钮排布（与设备现场图片弹层一致） */
.ph-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-reset{margin-top:10px}
/* 语言抽屉：单选项 */
.lang-list{display:flex;flex-direction:column;margin-top:2px}
.lang-opt{
  width:100%;min-height:54px;padding:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--line);background:transparent;color:var(--ink);
  font-size:15px;line-height:21px;font-weight:600;text-align:left
}
.lang-opt:last-child{border-bottom:0}
.lang-opt:active{background:#fafbfd}
.lang-flag{
  width:22px;flex:0 0 auto;text-align:center;font-size:17px;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif
}
.lang-name{flex:1;min-width:0}
/* 列表行「语言」后面的当前语言 + 旗 */
#langValue.with-flag{display:flex;align-items:center;gap:6px}
#langValue .row-flag{
  font-size:14px;line-height:1;flex:0 0 auto;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif
}
.lang-check{flex:0 0 auto;width:20px;height:20px;color:var(--brand);opacity:0}
.lang-opt[aria-checked="true"] .lang-check{opacity:1}
.lang-opt[aria-checked="true"] .lang-name{color:var(--brand)}
</style>
</head>
<body>
<main class="app">

  <div class="status"><span>9:41</span><span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M1 4.2a10.5 10.5 0 0 1 14 0M3.5 6.8a6.7 6.7 0 0 1 9 0M6.2 9.4a2.7 2.7 0 0 1 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span class="battery"><i></i></span></span></div>

  <header class="navbar">
    <span class="nav-left"><button class="icon-btn" type="button" aria-label="返回" onclick="appBack(event)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button></span>
    <h1>我的</h1>
    <span class="nav-right"></span>
  </header>

  <div class="body">

    <section class="my-profile">
      <button class="my-avatar" type="button" id="avatarBtn" aria-haspopup="dialog" aria-controls="avatarSheet" aria-label="修改头像">
        <img class="my-avatar-img" id="myAvatar" src="assets/avatar-leo.jpg" alt="Leo Venderful 头像" width="240" height="240">
        <span class="edit"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg></span>
      </button>
      <div class="my-id">
        <div class="my-name">Leo Venderful</div>
        <div class="my-email">leo@vendsolution.ai</div>
        <div class="my-org">Vendfone Team · Sydney Area 2</div>
      </div>
    </section>

    <section class="card mt-12">
      <div class="list">
        <button class="item no-thumb" type="button" id="langItem" aria-haspopup="dialog" aria-controls="langSheet">
          <span class="item-body">
            <span class="item-name">语言</span>
            <span class="item-sub" id="langValue">简体中文</span>
          </span>
          <svg class="item-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <button class="item no-thumb" type="button">
          <span class="item-body">
            <span class="item-name">用户指南</span>
          </span>
          <svg class="item-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <button class="item no-thumb" type="button">
          <span class="item-body">
            <span class="item-name">关于</span>
            <span class="item-sub">Version 0.1.0</span>
          </span>
          <svg class="item-go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </button>
      </div>
    </section>

  </div>

  <footer class="footer on-bg">
    <button class="btn btn-danger-weak btn-block" type="button" id="logout">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5M20 12H9M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/></svg>
      退出登录
    </button>
  </footer>

  <div class="overlay" id="avatarSheet" role="dialog" aria-modal="true" aria-labelledby="avatarTitle">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-head">
        <h2 id="avatarTitle">修改头像</h2>
        <button class="close" type="button" data-avatar-close aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <p class="sheet-note">头像仅用于本人账号展示。建议正脸、光线均匀，系统按 1:1 居中裁切；支持 JPG / PNG，单张不超过 10MB。</p>
        <div class="ph-acts">
          <button class="btn btn-secondary" type="button" id="avCamera">拍照</button>
          <button class="btn btn-secondary" type="button" id="avAlbum">从相册选择</button>
        </div>
        <button class="btn btn-ghost btn-block ph-reset" type="button" id="avReset" hidden>恢复默认头像</button>
      </div>
    </div>
  </div>
  <input type="file" id="avInput" accept="image/*" hidden>

  <div class="overlay" id="langSheet" role="dialog" aria-modal="true" aria-labelledby="langTitle">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-head">
        <h2 id="langTitle">选择语言</h2>
        <button class="close" type="button" data-lang-close aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <div class="lang-list" role="radiogroup" aria-labelledby="langTitle">
          <button class="lang-opt" type="button" role="radio" aria-checked="true" data-lang="中文(简体)" aria-label="中文(简体)，中国">
            <span class="lang-flag" aria-hidden="true">🇨🇳</span>
            <span class="lang-name">中文(简体)</span>
            <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
          </button>
          <button class="lang-opt" type="button" role="radio" aria-checked="false" data-lang="English" aria-label="English，United Kingdom">
            <span class="lang-flag" aria-hidden="true">🇬🇧</span>
            <span class="lang-name">English</span>
            <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
          </button>
          <button class="lang-opt" type="button" role="radio" aria-checked="false" data-lang="Tiếng Việt" aria-label="Tiếng Việt，Việt Nam">
            <span class="lang-flag" aria-hidden="true">🇻🇳</span>
            <span class="lang-name">Tiếng Việt</span>
            <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
          </button>
          <button class="lang-opt" type="button" role="radio" aria-checked="false" data-lang="中文(繁體)" aria-label="中文(繁體)，中国香港">
            <span class="lang-flag" aria-hidden="true">🇭🇰</span>
            <span class="lang-name">中文(繁體)</span>
            <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

</main>
<script>
document.getElementById('logout').addEventListener('click',function(){
  if(confirm('确认退出登录？'))appLogout();
});

/* 页面内轻提示（头像 / 语言共用） */
function showToast(text){
  var el=document.getElementById('toast');
  if(!el)return;
  el.textContent=text;el.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(function(){el.classList.remove('show')},1800);
}

/* ---------- 头像：点自己头像修改（无独立入口） ---------- */
(function(){
  var DEFAULT='assets/avatar-leo.jpg';
  var KEY='vs:my-avatar';
  var img=document.getElementById('myAvatar');
  var btn=document.getElementById('avatarBtn');
  var sheet=document.getElementById('avatarSheet');
  var resetBtn=document.getElementById('avReset');
  var input=document.getElementById('avInput');

  function stored(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
  function save(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}}

  function render(src){
    img.src=src||DEFAULT;
    resetBtn.hidden=!stored();
  }
  function openSheet(){sheet.classList.add('open')}
  function closeSheet(){sheet.classList.remove('open')}

  render(stored());

  btn.addEventListener('click',openSheet);
  sheet.querySelectorAll('[data-avatar-close]').forEach(function(el){el.addEventListener('click',closeSheet)});
  sheet.addEventListener('click',function(event){if(event.target===sheet)closeSheet()});
  document.addEventListener('keydown',function(event){if(event.key==='Escape')closeSheet()});

  document.getElementById('avCamera').addEventListener('click',function(){
    input.setAttribute('capture','user');input.click();
  });
  document.getElementById('avAlbum').addEventListener('click',function(){
    input.removeAttribute('capture');input.click();
  });
  resetBtn.addEventListener('click',function(){
    save('');render('');closeSheet();showToast('已恢复默认头像');
  });

  input.addEventListener('change',function(){
    var file=input.files&&input.files[0];
    input.value='';
    if(!file)return;
    if(!/^image\//.test(file.type)){showToast('请选择图片文件');return}
    var reader=new FileReader();
    reader.onload=function(){
      var im=new Image();
      im.onload=function(){
        var w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;
        var side=Math.min(w,h),sx=(w-side)/2,sy=(h-side)/2;
        var out=Math.min(480,side);
        var canvas=document.createElement('canvas');
        canvas.width=out;canvas.height=out;
        canvas.getContext('2d').drawImage(im,sx,sy,side,side,0,0,out,out);
        var data=canvas.toDataURL('image/jpeg',0.88);
        save(data);render(data);closeSheet();showToast('头像已更新');
      };
      im.onerror=function(){showToast('图片读取失败，请重试')};
      im.src=reader.result;
    };
    reader.onerror=function(){showToast('图片读取失败，请重试')};
    reader.readAsDataURL(file);
  });
})();

/* ---------- 语言：下侧抽屉单选（暂不做翻译，仅切换选中项与行内文案） ---------- */
(function(){
  var KEY='vs:my-language';
  var DEFAULT='中文(简体)';
  /* 抽屉选项 → 列表行内显示的文案；切英文 / 越南语 / 繁体后行内同步 */
  var ROW_TEXT={'中文(简体)':'简体中文','English':'English','Tiếng Việt':'Tiếng Việt','中文(繁體)':'中文(繁體)'};
  /* 语言对应的国家 / 地区旗（繁體中文按中国香港标注） */
  var FLAG={'中文(简体)':'🇨🇳','English':'🇬🇧','Tiếng Việt':'🇻🇳','中文(繁體)':'🇭🇰'};

  var item=document.getElementById('langItem');
  var value=document.getElementById('langValue');
  var sheet=document.getElementById('langSheet');
  var opts=[].slice.call(document.querySelectorAll('#langSheet .lang-opt'));

  function stored(){try{return localStorage.getItem(KEY)||DEFAULT}catch(e){return DEFAULT}}
  function save(v){try{localStorage.setItem(KEY,v)}catch(e){}}

  function render(){
    var cur=stored();
    opts.forEach(function(btn){
      var on=btn.getAttribute('data-lang')===cur;
      btn.setAttribute('aria-checked',on?'true':'false');
    });
    value.classList.add('with-flag');
    value.innerHTML='<span class="row-flag" aria-hidden="true">'+(FLAG[cur]||'')+'</span><span>'+(ROW_TEXT[cur]||cur)+'</span>';
  }
  function openSheet(){render();sheet.classList.add('open')}
  function closeSheet(){sheet.classList.remove('open')}

  render();

  item.addEventListener('click',openSheet);
  sheet.querySelectorAll('[data-lang-close]').forEach(function(el){el.addEventListener('click',closeSheet)});
  sheet.addEventListener('click',function(event){if(event.target===sheet)closeSheet()});
  document.addEventListener('keydown',function(event){if(event.key==='Escape')closeSheet()});

  opts.forEach(function(btn){
    btn.addEventListener('click',function(){
      var lang=btn.getAttribute('data-lang');
      save(lang);render();closeSheet();
      showToast('已切换为 '+(ROW_TEXT[lang]||lang));
    });
  });
})();
</script>
<script src="app-ui.js"></script>
</body>
</html>
