<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>告警 · VendSolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vend.css">
<style>
  .screen{ width:393px; max-width:100%; min-height:100dvh;
    padding-bottom:calc(28px + env(safe-area-inset-bottom)); }
  .searchrow{ padding:8px 14px 0; }
  .search{ padding:9px 12px; border-radius:11px; }
  .search input{ flex:1; min-width:0; border:none; outline:none; background:transparent;
    font-family:inherit; font-size:13px; color:var(--ink); }
  .search input::placeholder{ color:#9AA1BC; }
  .aclear{ display:flex; align-items:center; justify-content:center; gap:6px;
    width:calc(100% - 22px); margin:2px 11px 10px; padding:9px; background:var(--bg);
    color:var(--blue); border:none; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer; }
  .aclear svg{ width:13px; height:13px; }
</style>
</head>
<body>
<div class="screen">

  <!-- 页头 -->
  <div class="ttop">
    <div class="title">告警</div>
    <button class="fltbtn" id="fltBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>筛选
    </button>
  </div>

  <!-- 筛选面板 -->
  <div class="tfilter" id="tfilter">
    <div class="fg">
      <div class="fl">租户</div>
      <div class="opts" id="tenantOpts">
        <span class="opt on" data-v="all">全部</span>
        <span class="opt" data-v="JAVA">JAVA</span>
        <span class="opt" data-v="默认租户">默认租户</span>
      </div>
    </div>
    <div class="fg">
      <div class="fl">告警类型</div>
      <div class="opts" id="typeOpts">
        <span class="opt on" data-v="all">全部</span>
        <span class="opt" data-v="设备离线">设备离线</span>
        <span class="opt" data-v="温度过高">温度过高</span>
        <span class="opt" data-v="出货异常">出货异常</span>
        <span class="opt" data-v="库存不足">库存不足</span>
        <span class="opt" data-v="支付异常">支付异常</span>
        <span class="opt" data-v="日结异常">日结异常</span>
      </div>
    </div>
    <div class="fg">
      <div class="fl">等级</div>
      <div class="opts" id="lvlOpts">
        <span class="opt on" data-v="all">全部</span>
        <span class="opt" data-v="P0">P0</span>
        <span class="opt" data-v="P1">P1</span>
        <span class="opt" data-v="P2">P2</span>
      </div>
    </div>
    <div class="fg">
      <div class="fl">状态</div>
      <div class="opts" id="stOpts">
        <span class="opt on" data-v="all">全部</span>
        <span class="opt" data-v="todo">待处理</span>
        <span class="opt" data-v="doing">处理中</span>
        <span class="opt" data-v="done">已完成</span>
        <span class="opt" data-v="closed">已关闭</span>
      </div>
    </div>
    <div class="fg">
      <div class="fl">时间</div>
      <div class="opts" id="timeOpts">
        <span class="opt on" data-v="all">全部</span>
        <span class="opt" data-v="today">今天</span>
        <span class="opt" data-v="7d">近 7 天</span>
        <span class="opt" data-v="30d">近 30 天</span>
      </div>
    </div>
    <button class="aclear" id="clearBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>清除过滤条件
    </button>
  </div>

  <!-- 分类分段：全部 / 设备告警 / 运营告警 -->
  <div class="tmain" id="catTabs">
    <span class="mt on" data-v="all">全部 <small id="cAll"></small></span>
    <span class="mt" data-v="dev">设备告警 <small id="cDev"></small></span>
    <span class="mt" data-v="ops">运营告警 <small id="cOps"></small></span>
  </div>

  <!-- 搜索 -->
  <div class="searchrow">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="kw" placeholder="搜索告警名称 / 设备SN / 告警ID">
    </div>
  </div>

  <!-- 告警列表 -->
  <div class="tklist" id="alist"></div>
</div>

<script>
var DEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>';
var PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';

/* 严重度：P0 严重 / P1 警告 / P2 提示；状态点样式映射 */
var SEV = {
  P0:{ cls:'p0', txt:'P0 · 严重' },
  P1:{ cls:'p1', txt:'P1 · 警告' },
  P2:{ cls:'p2', txt:'P2 · 提示' }
};
var STC = { todo:'s-todo', doing:'s-doing', done:'s-done', closed:'s-closed' };

var NOW = Date.now();
var MIN = 60*1000, H = 60*MIN, D = 24*H;

/* 前 3 条为真实示例（设备告警 / 设备离线 / P2 / SN0010155 / JAVA / 已完成），其余为演示数据 */
var ALERTS = [
  { id:'60e340a2-fe34-4255-9511-2899ffeab032', cat:'dev', kind:'设备离线', name:'设备离线',
    lvl:'P2', sn:'SN0010155', site:'—', tenant:'JAVA', time:'2026/10/25 14:27', ts:NOW-41*MIN,
    st:'已完成', stKey:'done', stCls:'b-green', wo:'WO2114242490149998594' },
  { id:'04f113e8-d6aa-4263-bf6d-7b418bb000a8', cat:'dev', kind:'设备离线', name:'设备离线',
    lvl:'P2', sn:'SN0010155', site:'—', tenant:'JAVA', time:'2026/10/25 12:57', ts:NOW-2*H-11*MIN,
    st:'已完成', stKey:'done', stCls:'b-green', wo:'WO2114242490149998601' },
  { id:'e41f042e-9c25-453f-a1b5-8d8f82f1000d', cat:'dev', kind:'设备离线', name:'设备离线',
    lvl:'P2', sn:'SN0010155', site:'—', tenant:'JAVA', time:'2026/10/25 11:21', ts:NOW-3*H-47*MIN,
    st:'已完成', stKey:'done', stCls:'b-green', wo:'WO2114242490149998610' },
  { id:'a1b2c3d4-5e6f-4000-8000-000000000001', cat:'dev', kind:'温度过高', name:'柜内温度过高',
    lvl:'P0', sn:'SN0020301', site:'上海 A 店', tenant:'JAVA', time:'2026/10/25 14:40', ts:NOW-28*MIN,
    st:'待处理', stKey:'todo', stCls:'b-red', wo:null },
  { id:'a1b2c3d4-5e6f-4000-8000-000000000002', cat:'dev', kind:'出货异常', name:'出货电机卡货',
    lvl:'P1', sn:'SN0010120', site:'北京 B 店', tenant:'JAVA', time:'2026/10/25 13:05', ts:NOW-2*H-3*MIN,
    st:'处理中', stKey:'doing', stCls:'b-blue', wo:'WO2114242490149998622' },
  { id:'a1b2c3d4-5e6f-4000-8000-000000000003', cat:'ops', kind:'库存不足', name:'库存低于安全水位',
    lvl:'P1', sn:'—', site:'上海 A 店', tenant:'JAVA', time:'2026/10/25 10:12', ts:NOW-4*H-56*MIN,
    st:'处理中', stKey:'doing', stCls:'b-blue', wo:null },
  { id:'a1b2c3d4-5e6f-4000-8000-000000000004', cat:'ops', kind:'支付异常', name:'支付成功率下降',
    lvl:'P0', sn:'—', site:'—', tenant:'JAVA', time:'2026/10/24 21:48', ts:NOW-17*H-20*MIN,
    st:'已关闭', stKey:'closed', stCls:'b-gray', wo:null },
  { id:'a1b2c3d4-5e6f-4000-8000-000000000005', cat:'ops', kind:'日结异常', name:'日结金额对不上',
    lvl:'P2', sn:'—', site:'深圳科技园', tenant:'默认租户', time:'2026/10/24 23:59', ts:NOW-15*H-9*MIN,
    st:'已完成', stKey:'done', stCls:'b-green', wo:null }
];

var cat='all', tenant='all', kind='all', lvl='all', st='all', time='all', kw='';

function filtered(){
  var list = ALERTS.filter(function(a){
    if(cat!=='all' && a.cat!==cat) return false;
    if(tenant!=='all' && a.tenant!==tenant) return false;
    if(kind!=='all' && a.kind!==kind) return false;
    if(lvl!=='all' && a.lvl!==lvl) return false;
    if(st!=='all' && a.stKey!==st) return false;
    if(time!=='all'){
      var now=Date.now();
      if(time==='today'){ var d=new Date(); d.setHours(0,0,0,0); if(a.ts < d.getTime()) return false; }
      if(time==='7d' && now-a.ts > 7*D) return false;
      if(time==='30d' && now-a.ts > 30*D) return false;
    }
    if(kw){
      var s=(a.name+' '+a.kind+' '+a.sn+' '+a.id+' '+a.site+' '+a.tenant).toLowerCase();
      if(s.indexOf(kw.toLowerCase())===-1) return false;
    }
    return true;
  });
  /* P0 置顶，同级按时间倒序 */
  var order={P0:0,P1:1,P2:2};
  list.sort(function(x,y){
    if(order[x.lvl]!==order[y.lvl]) return order[x.lvl]-order[y.lvl];
    return y.ts-x.ts;
  });
  return list;
}

function render(){
  document.getElementById('cAll').textContent = ALERTS.length;
  document.getElementById('cDev').textContent = ALERTS.filter(function(a){return a.cat==='dev';}).length;
  document.getElementById('cOps').textContent = ALERTS.filter(function(a){return a.cat==='ops';}).length;

  var list = filtered();
  var el = document.getElementById('alist');
  if(!list.length){
    el.innerHTML = '<div class="tkempty">暂无符合条件的告警</div>';
    return;
  }
  el.innerHTML = list.map(function(a){
    var sev = SEV[a.lvl];
    var typeTxt = a.cat==='dev' ? '设备告警' : '运营告警';
    var typeCls = a.cat==='dev' ? 'achip dev' : 'achip ops';
    var chips = '<span class="' + typeCls + '">' + typeTxt + '</span>';
    if(a.sn && a.sn!=='—') chips += '<span class="achip">' + DEV + a.sn + '</span>';
    if(a.site && a.site!=='—') chips += '<span class="achip">' + PIN + a.site + '</span>';
    chips += '<span class="achip">' + a.tenant + '</span>';
    return '<a class="acard ' + sev.cls + '" href="alert-detail.html">'
         +   '<div class="astrip"></div>'
         +   '<div class="ain">'
         +     '<div class="atop">'
         +       '<span class="alvl"><span class="sdot"></span>' + sev.txt + '</span>'
         +       '<span class="ast2 ' + STC[a.stKey] + '"><span class="tdot"></span>' + a.st + '</span>'
         +     '</div>'
         +     '<div class="atitle">' + a.name + '</div>'
         +     '<div class="achips">' + chips + '</div>'
         +     '<div class="afoot"><span class="atime">' + a.time + '</span><span class="abtn">查看 →</span></div>'
         +   '</div>'
         + '</a>';
  }).join('');
}

/* 分类分段 */
document.getElementById('catTabs').addEventListener('click', function(e){
  var m = e.target.closest('.mt'); if(!m) return;
  this.querySelectorAll('.mt').forEach(function(x){ x.classList.remove('on'); });
  m.classList.add('on');
  cat = m.dataset.v;
  render();
});

/* 筛选面板开关 */
document.getElementById('fltBtn').addEventListener('click', function(){
  document.getElementById('tfilter').classList.toggle('open');
});

/* 各筛选组 */
function bindOpts(id, cb){
  document.getElementById(id).addEventListener('click', function(e){
    var o = e.target.closest('.opt'); if(!o) return;
    this.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('on'); });
    o.classList.add('on');
    cb(o.dataset.v);
    render();
  });
}
bindOpts('tenantOpts', function(v){ tenant=v; });
bindOpts('typeOpts',   function(v){ kind=v; });
bindOpts('lvlOpts',    function(v){ lvl=v; });
bindOpts('stOpts',     function(v){ st=v; });
bindOpts('timeOpts',   function(v){ time=v; });

/* 清除过滤条件 */
document.getElementById('clearBtn').addEventListener('click', function(){
  cat='all'; tenant='all'; kind='all'; lvl='all'; st='all'; time='all'; kw='';
  document.getElementById('kw').value='';
  document.querySelectorAll('#tfilter .opts').forEach(function(g){
    g.querySelectorAll('.opt').forEach(function(x,i){ x.classList.toggle('on', i===0); });
  });
  document.querySelectorAll('#catTabs .mt').forEach(function(x,i){ x.classList.toggle('on', i===0); });
  render();
});

/* 搜索 */
document.getElementById('kw').addEventListener('input', function(){
  kw = this.value.trim();
  render();
});

render();
</script>
</body>
</html>
